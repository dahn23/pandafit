<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PandaFit — Classement de la séance</title>
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #160f26; --panel: #221a38; --text: #f4f2fa; --dim: #9992ad; --green: #43cea2; --gold: #f4c542; --silver: #c9cfd8; --bronze: #d9905a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at top, #2a1d4a 0%, var(--bg) 60%); color: var(--text); font-family: 'Montserrat', sans-serif; overflow: hidden; }
  .screen { height: 100%; display: flex; flex-direction: column; padding: 3.5vh 5vw; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 3vw; }
  .brand { display: flex; align-items: center; gap: 1.2vw; }
  .brand img { width: 6vh; height: 6vh; border-radius: 1.2vh; }
  .brand .t { font-weight: 900; font-size: 3.2vh; }
  .brand .s { font-weight: 600; font-size: 2vh; color: var(--dim); }
  .live { display: flex; align-items: center; gap: .8vw; font-weight: 800; font-size: 2.2vh; color: var(--green); }
  .live i { width: 1.4vh; height: 1.4vh; border-radius: 50%; background: var(--green); animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  h1 { font-size: 6.4vh; font-weight: 900; margin: 3vh 0 .6vh; letter-spacing: -.02em; }
  .sub { font-size: 2.6vh; color: var(--dim); font-weight: 600; }
  .sub b { color: var(--text); }
  .board { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(5, auto); grid-auto-flow: column; gap: 1.6vh 3vw; margin-top: 4vh; align-content: start; }
  .row { display: flex; align-items: center; gap: 1.6vw; background: var(--panel); border-radius: 1.6vh; padding: 1.6vh 2vw; transition: transform .4s; }
  .row .r { font-weight: 900; font-size: 3.4vh; width: 5vh; text-align: center; color: var(--dim); }
  .row .p { flex: 1; font-weight: 800; font-size: 3.4vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sc { font-weight: 900; font-size: 4vh; color: var(--green); }
  .row .sc small { font-size: 2vh; color: var(--dim); font-weight: 700; }
  .row.n1 { box-shadow: inset 0 0 0 .35vh var(--gold); } .row.n1 .r { color: var(--gold); }
  .row.n2 { box-shadow: inset 0 0 0 .35vh var(--silver); } .row.n2 .r { color: var(--silver); }
  .row.n3 { box-shadow: inset 0 0 0 .35vh var(--bronze); } .row.n3 .r { color: var(--bronze); }
  .empty { grid-column: 1 / -1; text-align: center; font-size: 3vh; color: var(--dim); margin-top: 8vh; line-height: 1.5; }
  footer { display: flex; justify-content: space-between; font-size: 2vh; color: var(--dim); font-weight: 600; }
  @media (max-aspect-ratio: 1/1) { .board { grid-template-columns: 1fr; grid-template-rows: none; grid-auto-flow: row; } h1 { font-size: 4.6vh; } }
  .ask { max-width: 520px; margin: 18vh auto 0; text-align: center; }
  .ask input { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--panel); color: var(--text); font-size: 22px; text-align: center; text-transform: uppercase; font-family: inherit; margin: 18px 0 12px; }
  .ask button { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--green); color: #0d2a22; font-weight: 800; font-size: 18px; font-family: inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="screen" id="screen"></div>
<script>
const SUPABASE_URL = 'https://kabjpqvbukhhqvdjnkzr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_QgLSQJyPJ09Uj3vCKCUykA_ca1LTm5E';
const OFFER_LABELS = {
  demo_vip: 'Démo PandaFit', decouverte: "Journée de l'équilibre", team_building: "Journée de l'équilibre – Team building",
  mois_equilibre: "Mois de l'équilibre", campagne_annuelle: 'Campagne annuelle',
};
const screen = document.getElementById('screen');
const code = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function askCode(msg) {
  screen.innerHTML = `
    <div class="ask">
      <div class="brand" style="justify-content:center;"><img src="/icon-192.png" alt=""><div class="t">PandaFit</div></div>
      <p class="sub" style="margin-top:18px;">${msg || 'Entre le code de la séance pour afficher le classement.'}</p>
      <input id="code" placeholder="PANDA-XXXX" value="${esc(code)}">
      <button id="go">Afficher le classement</button>
    </div>`;
  document.getElementById('go').addEventListener('click', () => {
    let c = document.getElementById('code').value.trim().toUpperCase();
    if (c && !c.startsWith('PANDA-')) c = 'PANDA-' + c;
    if (c) location.search = '?code=' + encodeURIComponent(c);
  });
}

async function fetchBoard() {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/event_leaderboard`, {
    method: 'POST', cache: 'no-store',
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_code: code }),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function draw(b) {
  const top = b.top || [];
  screen.innerHTML = `
    <header>
      <div class="brand"><img src="/icon-192.png" alt=""><div><div class="t">PandaFit</div><div class="s">L'équilibre est dans le mouvement</div></div></div>
      <div class="live"><i></i>${b.status === 'cloturee' ? 'Séance terminée' : 'En direct'}</div>
    </header>
    <h1>${esc(b.title || 'Classement PandaFit Index')}</h1>
    <div class="sub">${esc(b.client || '')} · ${esc(OFFER_LABELS[b.offer] || '')} · <b>${b.participants || 0}</b> participant${(b.participants || 0) > 1 ? 's' : ''}</div>
    <div class="board">
      ${top.length ? top.map((r, i) => `
        <div class="row n${i + 1}"><span class="r">${i + 1}</span><span class="p">${esc(r.pseudo)}</span><span class="sc">${r.score}<small> /100</small></span></div>
      `).join('') : '<div class="empty">Les meilleurs PandaFit Index apparaîtront ici.<br>Passe ton test et choisis un pseudo pour entrer au classement !</div>'}
    </div>
    <footer><span>Code de la séance : ${esc(code)}</span><span>pandafit.ch</span></footer>`;
}

async function tick() {
  try {
    const b = await fetchBoard();
    if (!b) { askCode('Code inconnu, ou séance pas encore ouverte ou terminée depuis plus de 2 jours.'); return; }
    draw(b);
  } catch (e) { /* coupure réseau passagère : on garde l'affichage et on réessaie */ }
  setTimeout(tick, 3000);
}

if (!code) askCode(); else tick();
</script>
</body>
</html>
