      msg.style.color = 'var(--primary)';
    } else {
      msg.textContent = "Code introuvable — vérifie l'orthographe, ou continue sans.";
      msg.style.color = '#ff8a97';
    }
  });
}

function indexPrepareStatic() {
  let remaining = 3;
  content.innerHTML = screenGenericPrepare(remaining, 'circle-dot', "Test 1 : reste centré, ça démarre dans...");
  const timer = setInterval(() => {
    remaining--;
    const el = document.getElementById('genericPrepareNum');
    if (remaining <= 0) { clearInterval(timer); SoundFx.go(); runStaticTest(); }
    else if (el) el.textContent = remaining;
  }, 1000);
}
function screenIndexStaticPlaying() {
  return `
    <h1 class="page-title">Test 1/2 — Équilibre statique</h1>
    <div class="zone-hud">
      <div class="hearts" id="idxStaticHearts"></div>
      <div class="timer" id="idxStaticTimer">20s</div>
    </div>
    <div class="index-canvas-wrap"><canvas id="indexCanvas" width="300" height="300"></canvas></div>
    <p class="page-sub" style="text-align:center;">Reste bien centré, sans forcer.</p>
  `;
}
function runStaticTest() {
  content.innerHTML = screenIndexStaticPlaying();
  IndexTest.startStaticTest(
    (snap) => {
      const hearts = document.getElementById('idxStaticHearts');
      const timer = document.getElementById('idxStaticTimer');
      if (hearts) hearts.innerHTML = heartsHTML(Math.max(0, IndexTest.STATIC_LIVES - snap.livesLost), IndexTest.STATIC_LIVES);
      if (timer) timer.textContent = `${Math.max(0, Math.round(IndexTest.STATIC_DURATION_S - snap.elapsed))}s`;
      const canvas = document.getElementById('indexCanvas');
      if (canvas) {
        const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2, pxPerCm = 26;
        ctx.clearRect(0, 0, w, h);
        ctx.beginPath(); ctx.arc(cx, cy, snap.radius * pxPerCm, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(67,206,162,0.15)'; ctx.fill();
        ctx.strokeStyle = '#43cea2'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(cx + snap.x * pxPerCm, cy - snap.y * pxPerCm, 9, 0, Math.PI * 2);
        ctx.fillStyle = '#c86dd7'; ctx.fill();
      }
    },
    (staticResult) => { indexStaticResult = staticResult; indexPrepareMovement(); }
  );
}
let indexStaticResult = null;

function indexPrepareMovement() {
  let remaining = 3;
  content.innerHTML = `
    <div class="connect-hero">
      <div class="icon"><i data-lucide="check-circle"></i></div>
      <h2>Test 1 terminé</h2>
      <p>Passons au test 2 : mouvement haut/bas, ça démarre dans...</p>
      <div style="font-size:64px;font-weight:800;" id="genericPrepareNum">${remaining}</div>
    </div>
  `;
  const timer = setInterval(() => {
    remaining--;
    const el = document.getElementById('genericPrepareNum');
    if (remaining <= 0) { clearInterval(timer); SoundFx.go(); runMovementTest(); }
    else if (el) el.textContent = remaining;
  }, 1000);
}
function screenIndexMovementPlaying() {
  return `
    <h1 class="page-title">Test 2/2 — Équilibre en mouvement</h1>
    <div class="zone-hud">
      <div class="timer" id="idxMovePoints">0 pts</div>
      <div class="timer" id="idxMoveTimer">20s</div>
    </div>
    <div class="index-canvas-wrap"><canvas id="indexCanvas" width="300" height="300"></canvas></div>
    <p class="page-sub" style="text-align:center;">Franchis les deux lignes en haut/bas, garde un rythme régulier.</p>
  `;
}
function runMovementTest() {
  content.innerHTML = screenIndexMovementPlaying();
  IndexTest.startMovementTest(
    (snap) => {
      const pts = document.getElementById('idxMovePoints');
      const timer = document.getElementById('idxMoveTimer');
      if (pts) pts.textContent = `${snap.points} pts`;
      if (timer) timer.textContent = `${Math.max(0, Math.round(IndexTest.MOVE_DURATION_S - snap.elapsed))}s`;
      const canvas = document.getElementById('indexCanvas');
      if (canvas) {
        const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2, pxPerCm = 22;
        ctx.clearRect(0, 0, w, h);
        const lineY1 = cy - IndexTest.MOVE_LINE_CM * pxPerCm, lineY2 = cy + IndexTest.MOVE_LINE_CM * pxPerCm;
        ctx.strokeStyle = '#0a3d91'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, lineY1); ctx.lineTo(w, lineY1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, lineY2); ctx.lineTo(w, lineY2); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy - snap.y * pxPerCm, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#c86dd7'; ctx.fill();
      }
    },
    (movementResult) => {
      const overall = IndexTest.computeOverallIndex(indexStaticResult.score, movementResult.score);
      finishIndexTest(overall, indexStaticResult, movementResult);
    }
  );
}
async function finishIndexTest(overall, staticResult, movementResult) {
  if (!currentEmployee) {
    currentEmployee = await PandaFitBackend.createEmployee(clientConfig);
  }
  PandaFitBackend.recordSession(clientConfig, 'indextest', overall, {
    staticScore: staticResult.score, movementScore: movementResult.score,
    rmsCm: staticResult.rmsCm, amplitudeCm: movementResult.amplitudeCm,
    regularityScore: movementResult.regularityScore, cycles: movementResult.cycles,
  }, currentEmployee?.id).then(submitPendingAnswersIfAny);
  content.innerHTML = screenIndexResult(overall, staticResult, movementResult);
  wireIndexResult();
}
function screenIndexResult(overall, staticResult, movementResult) {
  return `
    <h1 class="page-title">Ton PandaFit Index</h1>
    <div class="index-score-big"><div class="num">${overall}</div><div class="lbl">/ 100</div></div>
    <div class="index-breakdown">
      <div><div class="n">${staticResult.score}</div><div class="l">Équilibre statique</div></div>
      <div><div class="n">${movementResult.score}</div><div class="l">Mouvement</div></div>
    </div>
    <div class="card" style="margin-top:16px;">
      <h2>Détails</h2>
      <div class="result-stat"><span>Oscillation moyenne (statique)</span><span>${staticResult.rmsCm} cm</span></div>
      <div class="result-stat"><span>Régularité du mouvement</span><span>${movementResult.regularityScore}/100</span></div>
      <div class="result-stat"><span>Amplitude du mouvement</span><span>${movementResult.amplitudeCm} cm</span></div>
    </div>
    ${currentEmployee ? `
      <div class="card" style="margin-top:16px;text-align:center;">
        <h2>Garde ton PandaFit Index</h2>
        <p class="page-sub">Scanne ce code avec l'appareil photo de <b>ton téléphone</b> pour voir ton historique et le retrouver la prochaine fois.</p>
        <canvas id="employeeQrCanvas" style="margin:0 auto;display:block;"></canvas>
        <p id="employeeQrFallback" class="page-sub" style="display:none;word-break:break-all;"></p>
        <p class="page-sub" style="margin-top:10px;">Ton code personnel : <b>${currentEmployee.claim_token}</b></p>
      </div>
    ` : ''}
    <div class="row" style="margin-top:14px;">
      <button class="btn-primary" id="btnIndexReplay">Refaire le test</button>
      <button class="btn-ghost" id="btnIndexHome">Retour à l'accueil</button>
    </div>
  `;
}
function wireIndexResult() {
  document.getElementById('btnIndexReplay')?.addEventListener('click', () => launchIndexWithQuestionnaire());
  document.getElementById('btnIndexHome')?.addEventListener('click', () => { currentEmployee = null; navigate('home'); });
  const canvas = document.getElementById('employeeQrCanvas');
  if (canvas && currentEmployee) {
    const url = `${location.origin}/mon-index.html?token=${currentEmployee.claim_token}`;
    if (window.QRCode) {
      QRCode.toCanvas(canvas, url, { width: 180, margin: 1, color: { dark: '#1c162e', light: '#ffffff' } }, (err) => {
        if (err) {
          canvas.style.display = 'none';
          const fb = document.getElementById('employeeQrFallback');
          if (fb) { fb.style.display = 'block'; fb.innerHTML = `Le QR n'a pas pu se charger — ouvre ce lien depuis ton téléphone : <br><b>${url}</b>`; }
        }
      });
    } else {
      canvas.style.display = 'none';
      const fb = document.getElementById('employeeQrFallback');
      if (fb) { fb.style.display = 'block'; fb.innerHTML = `Le QR n'a pas pu se charger — ouvre ce lien depuis ton téléphone : <br><b>${url}</b>`; }
    }
  }
}

/* ---------- Écran : configuration de la tablette (une seule fois) ---------- */
function screenDeviceSetup(errorMsg) {
  return `
    <div class="connect-hero">
      <div class="icon"><i data-lucide="key"></i></div>
      <h2>Configuration de la tablette</h2>
      <p>Cette tablette n'est pas encore reliée à un client PandaFit. Entre la clé fournie par le superadmin (une seule fois).</p>
      <input id="deviceKeyInput" placeholder="ex: DEV-TEST-0001" style="width:100%;padding:14px;border-radius:12px;border:none;background:var(--panel-hi);color:var(--text);font-size:15px;margin-bottom:12px;box-sizing:border-box;">
      ${errorMsg ? `<p style="color:#ff8a97;font-size:13px;margin-bottom:12px;">${errorMsg}</p>` : ''}
      <button class="btn-primary" id="btnSaveDeviceKey" style="width:100%">Valider</button>
    </div>
  `;
}
function wireDeviceSetup() {
  document.getElementById('btnSaveDeviceKey')?.addEventListener('click', async () => {
    const val = document.getElementById('deviceKeyInput').value.trim();
    if (!val) return;
    try {
      clientConfig = await PandaFitBackend.fetchClientConfig(val);
      PandaFitBackend.setDeviceKey(val);
      log(`Tablette reliée au client "${clientConfig.clientName}".`);
      gamesCatalog = await PandaFitBackend.fetchGamesCatalog(); await refreshHighlights(); applyNavLockVisuals();
      render();
    } catch (e) {
      content.innerHTML = screenDeviceSetup(e.message);
      wireDeviceSetup();
    }
  });
}

/* ---------- Démarrage ---------- */
async function boot() {
  log('Application PandaFit prête.');
document.getElementById('btnFullscreen')?.addEventListener('click', () => {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  }
});
  const savedKey = PandaFitBackend.getDeviceKey();
  if (!savedKey) {
    content.innerHTML = screenDeviceSetup();
    wireDeviceSetup();
    return;
  }
  try {
    clientConfig = await PandaFitBackend.fetchClientConfig(savedKey);
    log(`Tablette reliée au client "${clientConfig.clientName}".`);
    gamesCatalog = await PandaFitBackend.fetchGamesCatalog(); await refreshHighlights(); applyNavLockVisuals();
    const reconnectResult = await PandaFitSensor.tryAutoReconnect();
    if (reconnectResult.success) log('Capteur reconnecté automatiquement (sans sélecteur).');
    else log('Reconnexion automatique non effectuée : ' + reconnectResult.reason);
    render();
  } catch (e) {
    log('Erreur de configuration : ' + e.message);
    content.innerHTML = screenDeviceSetup(e.message);
    wireDeviceSetup();
  }
}
boot();

</script>
