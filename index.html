    --grad-accent: linear-gradient(120deg, var(--accent), var(--accent-dark));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Montserrat', -apple-system, sans-serif;
    overscroll-behavior: none;
  }
  #app { max-width: 900px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  /* --- Top bar --- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--grad-main); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 16px; color: #0c2018;
  }
  .brand .name { font-weight: 700; font-size: 18px; letter-spacing: 0.01em; }
  .status-pill {
    display: flex; align-items: center; gap: 7px;
    background: var(--panel); border-radius: 100px; padding: 7px 14px;
    font-size: 12.5px; color: var(--text-dim);
  }
  .status-pill .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--destructive); }
  .status-pill.connected .dot { background: var(--primary); box-shadow: 0 0 6px var(--primary); }
  .status-pill.searching .dot { background: #e0a83e; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }

  .content { flex: 1; padding: 6px 20px 100px; }

  /* --- Generic --- */
  h1.page-title { font-size: 22px; font-weight: 700; margin: 6px 0 4px; }
  p.page-sub { color: #c7c2db; font-size: 21px; margin: 0 0 22px; line-height: 1.45; }
  .centered-page { display: flex; flex-direction: column; justify-content: center; min-height: 75vh; }
  .panda-watcher {
    position: fixed; top: 68px; left: 16px; width: 46vw; height: 46vw; max-width: 230px; max-height: 230px; z-index: 50;
    border-radius: 50%; background: #fdfaf3; border: 3px solid var(--primary);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .panda-watcher-face { position: absolute; width: 92%; height: 92%; object-fit: contain; opacity: 0; transition: opacity 0.15s; }
  .panda-watcher-face.active { opacity: 1; }
  .happy-bounce { animation: pandaHappyBounce 0.5s ease; }
  @keyframes pandaHappyBounce { 0%,100% { transform: scale(1); } 30% { transform: scale(1.18) rotate(-4deg); } 60% { transform: scale(1.1) rotate(4deg); } }

  .football-pitch {
    position: relative; height: 46vh; border-radius: 20px; overflow: hidden; margin: 10px 0;
    background: repeating-linear-gradient(180deg, #2e8b4e 0 40px, #34974f 40px 80px);
    display: flex; align-items: center; justify-content: center;
  }
  .football-goal-distant { position: absolute; top: 14%; font-size: 40px; transition: transform 0.3s linear; }
  .football-runner { position: absolute; bottom: 18%; font-size: 54px; transition: transform 0.15s ease; }
  .football-vgauge {
    position: absolute; right: 14px; top: 10%; bottom: 10%; width: 16px; border-radius: 8px;
    background: linear-gradient(180deg, #39ff8a, #e8112d 45%, #e8112d 55%, #39ff8a);
  }
  .football-vgauge-marker { position: absolute; left: -5px; width: 26px; height: 8px; background: #fff; border-radius: 4px; transition: top 0.15s ease; }

  .football-goalzone-wrap { display: flex; justify-content: center; margin: 10px 0; }
  .football-goalzone {
    position: relative; width: 100%; max-width: 480px; aspect-ratio: 900/413;
    background-size: contain; background-repeat: no-repeat; background-position: center;
    border-radius: 14px; overflow: hidden;
  }
  .football-target {
    position: absolute; width: 44px; height: 44px; margin-left: -22px; margin-top: -22px;
    border-radius: 50%; background: rgba(255,255,255,0.5); border: 4px solid #e0a83e;
    transition: left 0.1s linear, top 0.1s linear, background 0.15s, border-color 0.15s;
  }
  .football-target.hit { background: rgba(67,206,162,0.7); border-color: #43cea2; }
  .football-target.miss { background: rgba(230,55,78,0.7); border-color: #e6374e; }

  .football-result-reveal { position: relative; display: flex; justify-content: center; margin: 10px 0 18px; }
  .football-result-reveal .frame {
    position: relative; background: #fdfaf3; border-radius: 20px; padding: 16px 24px;
    display: flex; justify-content: center; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .football-result-reveal img { width: 140px; height: auto; position: relative; z-index: 1; }
  .football-result-reveal::before {
    content: ''; position: absolute; width: 140px; height: 140px; border-radius: 50%;
    border: 6px solid #fff; animation: resultFrameGrow 1.1s ease-out forwards;
  }
  @keyframes resultFrameGrow { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(1.6); opacity: 0; } }
  .catch-pulse { position: absolute; width: 50px; height: 50px; border-radius: 50%; animation: catchPulse 0.5s ease-out forwards; }
  .catch-pulse.good { background: #43cea2; }
  .catch-pulse.bad { background: #e6374e; }
  @keyframes catchPulse { 0% { transform: scale(0.3); opacity: 0.9; } 100% { transform: scale(2.4); opacity: 0; } }

  .card {
    background: var(--panel); border-radius: 18px; padding: 20px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--text-dim); margin: 0 0 12px; font-weight: 700;
  }

  button, .btn {
    font-family: inherit; border: none; cursor: pointer;
    border-radius: 14px; font-weight: 700; font-size: 15px;
    padding: 15px 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary { background: var(--grad-main); color: #0c2018; width: 100%; }
  .btn-accent { background: var(--grad-accent); color: #fff; width: 100%; }
  .btn-ghost { background: var(--panel-hi); color: var(--text); }
  .btn-destructive { background: rgba(230,55,78,0.15); color: #ff8a97; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button:active { transform: scale(0.98); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 140px; }

  /* --- Home --- */
  .lang-switch-home { display: flex; justify-content: center; gap: 16px; margin: 8px 0; }
  .lang-flag-btn {
    width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--panel);
    font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer;
    padding: 0; line-height: 1;
  }
  .lang-flag-btn.active { outline: 3px solid var(--primary); }
  .lang-switch-spacer { height: 60px; }
  .hero-play {
    background: var(--grad-main); border-radius: 22px; padding: 28px 24px;
    margin-bottom: 16px; position: relative; overflow: hidden;
  }
  .hero-play h3 { margin: 0 0 6px; font-size: 20px; color: #0c2018; font-weight: 800; }
  .hero-play p { margin: 0 0 18px; color: #0c2018; opacity: 0.75; font-size: 13.5px; }
  .hero-play button { background: #0c2018; color: #fff; width: 100%; }

  .hero-index {
    background: var(--grad-accent); border-radius: 22px; padding: 18px 20px;
    margin-bottom: 16px; display: flex; align-items: center; gap: 16px; cursor: pointer;
  }
  .hero-index-logo { width: 52px; height: 52px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.2)); }
  .hero-index-text { flex: 1; }
  .hero-index-text h3 { margin: 0 0 2px; font-size: 17px; color: #fff; font-weight: 800; }
  .hero-index-text p { margin: 0; color: #fff; opacity: 0.85; font-size: 13px; }
  .hero-index > [data-lucide] { color: #fff; opacity: 0.8; width: 22px; height: 22px; }

  .tile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile {
    background: var(--panel); border-radius: 16px; padding: 18px;
    display: flex; flex-direction: column; gap: 10px; cursor: pointer;
    border: 1px solid transparent; transition: border-color 0.15s;
  }
  .tile:active { border-color: var(--primary); }
  .tile .emoji { font-size: 26px; }
  .tile .label { font-weight: 700; font-size: 14.5px; }
  .tile .sub { font-size: 12px; color: var(--text-dim); }

  /* --- Connect screen --- */
  .connect-hero { text-align: center; padding: 30px 10px 10px; }
  .connect-hero .icon { font-size: 52px; margin-bottom: 14px; }
  .connect-hero h2 { font-size: 19px; margin: 0 0 8px; }
  .connect-hero p { color: var(--text-dim); font-size: 14px; margin: 0 0 26px; }

  /* --- Calibration --- */
  .countdown-circle {
    width: 180px; height: 180px; border-radius: 50%;
    border: 6px solid var(--panel-hi); display: flex; align-items: center; justify-content: center;
    margin: 20px auto; position: relative;
  }
  .countdown-circle .num { font-size: 56px; font-weight: 800; }
  .countdown-ring {
    position: absolute; inset: -6px; border-radius: 50%;
    background: conic-gradient(var(--primary) calc(var(--pct) * 1%), transparent 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 6px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 6px));
  }

  /* --- Games grid --- */
  .game-card {
    background: var(--panel); border-radius: 18px; padding: 18px;
    display: flex; align-items: center; gap: 16px; margin-bottom: 12px;
    cursor: pointer;
  }
  .game-card .emoji { font-size: 30px; width: 50px; text-align: center; }
  .game-card .info { flex: 1; }
  .game-card .info .name { font-weight: 700; font-size: 15.5px; margin-bottom: 2px; }
  .game-card .info .desc { font-size: 12.5px; color: var(--text-dim); }
  .badge-soon {
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    background: var(--panel-hi); color: var(--text-dim); padding: 4px 8px; border-radius: 8px;
  }

  /* --- Settings rows --- */
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0; border-bottom: 1px solid var(--panel-hi);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-row .lbl { font-size: 14px; color: var(--text-dim); }
  .setting-row .val { font-size: 14px; font-weight: 600; }

  /* --- Bottom nav --- */
  .bottomnav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    max-width: 900px; margin: 0 auto;
    background: rgba(27,22,45,0.92); backdrop-filter: blur(10px);
    display: flex; border-top: 1px solid var(--panel-hi);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  .navbtn {
    flex: 1; background: none; border: none; display: flex; flex-direction: column;
    align-items: center; gap: 4px; padding: 8px 4px; color: var(--text-dim); font-size: 10.5px;
    font-weight: 600; border-radius: 12px;
  }
  .navbtn .ic { font-size: 20px; }
  .navbtn.active { color: var(--primary); }
  .navbtn.locked { opacity: 0.4; }
  .navbtn .ic { position: relative; }
  .navbtn .lock-badge {
    display: none;
    position: absolute; bottom: -3px; right: -6px; width: 11px !important; height: 11px !important;
    background: var(--bg); border-radius: 50%; padding: 1px;
  }
  .navbtn.locked .lock-badge { display: block; }

  /* --- Zone game --- */
  .segmented { display: flex; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .segmented button {
    flex: 1; min-width: 80px; background: var(--panel-hi); color: var(--text-dim);
    padding: 12px 10px; font-size: 13.5px;
  }
  .segmented button.selected { background: var(--grad-main); color: #0c2018; }
  .hearts { font-size: 40px; letter-spacing: 6px; flex: 1; text-align: center; }
  .zone-hud {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
  }
  .zone-hud .timer { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .zone-canvas-wrap { display: flex; justify-content: center; margin: 10px 0 20px; }
  #zoneCanvas { background: #14101f; border-radius: 20px; }
  .result-stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--panel-hi); gap: 12px; }
  .result-stat:last-child { border-bottom: none; }
  .result-stat > span:first-child { color: var(--text-dim); flex-shrink: 0; }
  .result-stat > span:last-child { text-align: right; }
  .detail-row { padding: 10px 0; border-bottom: 1px solid var(--panel-hi); }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .lbl { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
  .detail-row .val { font-size: 14px; line-height: 1.4; }
  .result-score { text-align: center; margin: 10px 0 20px; }
  .result-score .num { font-size: 44px; font-weight: 800; background: var(--grad-main); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .result-score .lbl { font-size: 12.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }

  /* --- Jeu Migros : Le Panier Malin --- */
  .migros-canvas-wrap { display: flex; justify-content: center; margin: 10px 0 16px; }
  #migrosCanvas { background: linear-gradient(180deg, #fff7ef, #ffe4c7); border-radius: 20px; }

  /* --- Jeu Ski Prevention : Position Carres --- */
  /* --- Jeu Slalom Réflexe --- */
  .slalom-canvas-wrap { display: flex; justify-content: center; margin: 10px 0 16px; }
  #slalomCanvas {
    background: linear-gradient(180deg, #dff0ff 0%, #f4f9ff 55%, #ffffff 100%);
    border-radius: 20px; box-shadow: inset 0 0 0 1px rgba(10,61,145,0.08);
  }
  .slalom-flash {
    text-align: center; font-weight: 800; font-size: 15px; letter-spacing: 0.04em;
    margin-bottom: 6px; min-height: 20px;
  }
  .ski-tip { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--panel-hi); }
  .ski-tip:last-child { border-bottom: none; }
  .ski-tip .ic { font-size: 20px; }
  .ski-tip .txt { font-size: 13.5px; color: var(--text-dim); line-height: 1.4; }

  /* --- Test PandaFit Index --- */
  .index-canvas-wrap { display: flex; justify-content: center; margin: 10px 0 16px; }
  #indexCanvas { background: #14101f; border-radius: 20px; }
  .index-score-big {
    text-align: center; margin: 8px 0 20px;
  }
  .index-score-big .num {
    font-size: 64px; font-weight: 800;
    background: linear-gradient(120deg, var(--primary), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .index-score-big .lbl { font-size: 13px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
  .index-breakdown { display: flex; gap: 12px; }
  .index-breakdown > div { flex: 1; background: var(--panel-hi); border-radius: 14px; padding: 14px; text-align: center; }
  .index-breakdown .n { font-size: 26px; font-weight: 800; }
  .index-breakdown .l { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

  /* --- Carrousel Défis/Challenges/Événements --- */
  .highlights-wrap { position: relative; margin-bottom: 16px; touch-action: pan-y; }
  .main-stack { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
  .main-stack .stack-item { cursor: pointer; }
  .main-stack .stack-item .highlight-card { margin-bottom: 0; }
  .highlight-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .main-stack .stack-item .highlight-row { margin-bottom: 0; }
  .highlight-row .highlight-card { flex: 0 0 75%; margin-bottom: 0; }
  .hc-score-box {
    flex: 1; border-radius: 20px; padding: 10px 6px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center; position: relative; overflow: visible;
    color: #fff;
  }
  .hc-score-box.leading { background: linear-gradient(160deg, #43cea2, #1a7a52); }
  .hc-score-box.trailing { background: linear-gradient(160deg, #ff9a3c, #d9480f); }
  .hc-score-box .pulse-ring { position: absolute; inset: 0; border-radius: 20px; z-index: 0; animation: hcPulse 1.8s ease-out infinite; }
  .hc-score-box.leading .pulse-ring { background: #43cea2; }
  .hc-score-box.trailing .pulse-ring { background: #ff9a3c; }
  @keyframes hcPulse { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.4); opacity: 0; } }
  .hc-score-box > * { position: relative; z-index: 1; }
  .hc-score-box .crown-row { display: flex; align-items: center; gap: 3px; font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.9; }
  .hc-score-box .leader-name { font-size: 11.5px; font-weight: 700; margin: 3px 0 1px; line-height: 1.2; }
  .hc-score-box .leader-score { font-size: 19px; font-weight: 800; }
  .hc-score-box .divider { width: 65%; height: 1px; background: rgba(255,255,255,0.35); margin: 8px 0; }
  .hc-score-box .tablet-name { font-size: 10px; opacity: 0.9; line-height: 1.2; }
  .hc-score-box .tablet-score { font-size: 14px; font-weight: 700; margin-top: 1px; }
  .highlight-card {
    position: relative; border-radius: 20px; overflow: hidden; height: 190px;
    display: flex; align-items: flex-end; padding: 16px 18px; cursor: grab;
    background-size: cover; background-position: center;
  }
  .highlight-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(0,0,0,0.72) 100%);
  }
  .highlight-card .hc-badge {
    position: absolute; top: 14px; left: 18px; font-size: 10.5px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 10px; border-radius: 100px;
    background: rgba(255,255,255,0.18); backdrop-filter: blur(4px); z-index: 1;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .highlight-card .hc-content { position: relative; z-index: 1; color: #fff; }
  .highlight-card .hc-title { font-size: 17px; font-weight: 800; margin-bottom: 3px; }
  .highlight-card .hc-standings {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-size: 12px; margin-top: 8px; padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.25); color: #fff; opacity: 0.95;
  }
  .highlight-card .hc-standings b { font-weight: 800; }
  .highlight-card .hc-sub { font-size: 12.5px; opacity: 0.9; }
  .highlight-dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
  .highlight-dots .d { width: 6px; height: 6px; border-radius: 50%; background: var(--panel-hi); }
  .highlight-dots .d.active { background: var(--primary); width: 18px; border-radius: 4px; }
  .carousel-label {
    display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 4px 0 8px;
  }
  .log-box {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px;
    color: var(--text-dim); background: #14101f; border-radius: 10px; padding: 10px;
    max-height: 110px; overflow-y: auto; white-space: pre-wrap; margin-top: 10px;
  }
  a.linklike { color: var(--primary); text-decoration: underline; cursor: pointer; }
  [data-lucide] { display: inline-block; vertical-align: -0.15em; width: 1em; height: 1em; }
  .ic-lg [data-lucide] { width: 44px; height: 44px; }
  .ic-xl [data-lucide] { width: 52px; height: 52px; }
  .heart-full { color: #e6374e; }
  .heart-empty { color: var(--panel-hi); }
</style>
</head>
<body>
<div id="app">

<script>
/* Lucide redessine les <i data-lucide="..."> en SVG. Comme le contenu est
   souvent réinjecté via innerHTML, on relance ça en tâche de fond plutôt que
   de traquer chaque endroit — c'est idempotent et très peu coûteux. */
setInterval(() => { if (window.lucide) lucide.createIcons(); }, 350);
/* =====================================================================================
   BACKEND — PandaFitBackend (connexion Supabase)
   Phase 1 : la tablette s'identifie via une "device_key" (configurée une seule fois,
   par le superadmin), récupère son client + la liste des jeux activés, et envoie
   chaque score joué.
   ===================================================================================== */
const PandaFitBackend = (() => {
  const SUPABASE_URL = 'https://kabjpqvbukhhqvdjnkzr.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_QgLSQJyPJ09Uj3vCKCUykA_ca1LTm5E';
  const REST = SUPABASE_URL + '/rest/v1';
  const STORAGE_KEY = 'pandafit_device_key';

  function headers(extra) {
    return Object.assign({
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
    }, extra || {});
  }

  function getDeviceKey() {
    try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
  }
  function setDeviceKey(key) {
    try { localStorage.setItem(STORAGE_KEY, key); } catch (e) { /* pas de stockage dispo */ }
  }
  function clearDeviceKey() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  /** Récupère le client + les jeux activés pour une device_key donnée. */
  async function fetchClientConfig(deviceKey) {
    const devRes = await fetch(
      `${REST}/devices?device_key=eq.${encodeURIComponent(deviceKey)}&select=id,name,client_id,clients(id,name,show_ready_to_play,show_index_banner,rh_pin,lock_games,index_sort_order,index_questionnaire_id,index_image_url)`,
      { headers: headers() }
    );
    if (!devRes.ok) throw new Error('Impossible de contacter le serveur (devices).');
    const devices = await devRes.json();
    if (!devices.length) throw new Error("Clé de tablette inconnue. Vérifie auprès du superadmin PandaFit.");
    const device = devices[0];
    const clientId = device.client_id;
    const clientName = device.clients ? device.clients.name : '—';
    const showReadyToPlay = device.clients ? device.clients.show_ready_to_play : true;
    const showIndexBanner = device.clients ? device.clients.show_index_banner : true;
    const rhPin = device.clients ? device.clients.rh_pin : '0000';
    const lockGames = device.clients ? device.clients.lock_games : false;
    const indexSortOrder = device.clients ? (device.clients.index_sort_order ?? -1000) : -1000;
    const indexQuestionnaireId = device.clients ? device.clients.index_questionnaire_id : null;
    const indexImageUrl = device.clients ? device.clients.index_image_url : null;

    const cgRes = await fetch(
      `${REST}/client_games?client_id=eq.${clientId}&enabled=eq.true&select=game_id,sort_order,image_url,questionnaire_id&order=sort_order`,
      { headers: headers() }
    );
    if (!cgRes.ok) throw new Error('Impossible de contacter le serveur (client_games).');
    const rows = (await cgRes.json()).filter(r => r.game_id !== 'indextest');
    const enabledGameIds = rows.map(r => r.game_id);
    const gameSortOrders = {};
    const gameImages = {};
    const gameQuestionnaires = {};
    rows.forEach(r => { gameSortOrders[r.game_id] = r.sort_order || 0; gameImages[r.game_id] = r.image_url || null; gameQuestionnaires[r.game_id] = r.questionnaire_id || null; });

    return { deviceId: device.id, deviceName: device.name, clientId, clientName, enabledGameIds, gameSortOrders, gameImages, gameQuestionnaires, showReadyToPlay, showIndexBanner, rhPin, lockGames, indexSortOrder, indexQuestionnaireId, indexImageUrl };
  }

  /** Enregistre le score d'une partie terminée. */
  async function recordSession(config, gameId, score, meta, employeeId) {
    if (!config) return null;
    try {
      const res = await fetch(`${REST}/sessions`, {
        method: 'POST',
        headers: headers({ Prefer: 'return=representation' }),
        body: JSON.stringify({
          device_id: config.deviceId,
          client_id: config.clientId,
          game_id: gameId,
          score: Math.round(score || 0),
          meta: meta || null,
          employee_id: employeeId || null,
        }),
      });
      const rows = res.ok ? await res.json() : [];
      return rows[0]?.id || null;
    } catch (e) { return null; /* pas grave si ça échoue ponctuellement, on ne bloque pas le jeu */ }
  }

  /** Récupère les questions + réponses possibles d'un questionnaire. */
  async function fetchQuestionnaire(questionnaireId) {
    if (!questionnaireId) return [];
    try {
      const res = await fetch(
        `${REST}/questions?questionnaire_id=eq.${questionnaireId}&select=*,question_options(*)&order=sort_order`,
        { headers: headers() }
      );
      const rows = res.ok ? await res.json() : [];
      rows.forEach(q => q.question_options.sort((a, b) => a.sort_order - b.sort_order));
      return rows;
    } catch (e) { return []; }
  }

  /** Enregistre les réponses données, liées à la partie qui vient d'être jouée. */
  async function recordQuestionResponses(sessionId, answers) {
    if (!sessionId || !answers || !answers.length) return;
    try {
      await fetch(`${REST}/question_responses`, {
        method: 'POST',
        headers: headers({ Prefer: 'return=minimal' }),
        body: JSON.stringify(answers.map(a => ({ session_id: sessionId, question_id: a.questionId, option_id: a.optionId }))),
      });
    } catch (e) { /* pas grave si ça échoue ponctuellement */ }
  }

  /** Retrouve un employé à partir de son code personnel. */
  async function findEmployeeByCode(config, code) {
    try {
      const res = await fetch(`${REST}/employees?claim_token=eq.${encodeURIComponent(code.trim().toUpperCase())}&select=*`, { headers: headers() });
      const rows = res.ok ? await res.json() : [];
      return rows[0] || null;
    } catch (e) { return null; }
  }

  /** Crée un nouvel employé (anonyme au départ) avec un code personnel unique. */
  async function createEmployee(config) {
    const code = 'PF-' + Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
    try {
      const res = await fetch(`${REST}/employees`, {
        method: 'POST',
        headers: headers({ Prefer: 'return=representation' }),
        body: JSON.stringify({ client_id: config.clientId, claim_token: code }),
      });
      const rows = res.ok ? await res.json() : [];
      return rows[0] || null;
    } catch (e) { return null; }
  }

  /** Récupère défis, challenges et événements actifs pour ce client/cette tablette,
   *  mélangés en "un de chaque catégorie" (round-robin). */
  async function computeDefiStandings(defi, config, devicesCache) {
    try {
      const res = await fetch(
        `${REST}/sessions?client_id=eq.${config.clientId}&game_id=eq.${defi.game_id}&played_at=gte.${defi.start_date}&played_at=lte.${defi.end_date}T23:59:59&select=score,device_id`,
        { headers: headers() }
      );
      const rows = res.ok ? await res.json() : [];
      if (defi.mode === 'tablet_vs_tablet') {
        const byDevice = {};
        rows.forEach(r => { byDevice[r.device_id] = (byDevice[r.device_id] || 0) + (r.score || 0); });
        const yours = byDevice[config.deviceId] || 0;
        let leaderName = null, leaderPoints = 0;
        Object.entries(byDevice).forEach(([devId, total]) => {
          if (total > leaderPoints) { leaderPoints = total; leaderName = devicesCache[devId] || 'Tablette'; }
        });
        return { mode: 'tablet_vs_tablet', yours, yoursLabel: 'Ta tablette', leaderName, leaderPoints };
      }
      const total = rows.reduce((a, r) => a + (r.score || 0), 0);
      return { mode: 'company_total', yours: total, yoursLabel: 'Total entreprise' };
    } catch (e) { return null; }
  }

  async function computeChallengeStandings(challenge, config) {
    try {
      const participants = challenge.challenge_participants || [];
      const participantIds = participants.map(p => p.client_id);
      if (!participantIds.length) return null;
      const idsFilter = participantIds.join(',');
      const res = await fetch(
        `${REST}/sessions?client_id=in.(${idsFilter})&game_id=eq.${challenge.game_id}&played_at=gte.${challenge.start_date}&played_at=lte.${challenge.end_date}T23:59:59&select=score,client_id`,
        { headers: headers() }
      );
      const rows = res.ok ? await res.json() : [];
      const totals = {};
      rows.forEach(r => { totals[r.client_id] = (totals[r.client_id] || 0) + (r.score || 0); });
      const standings = participantIds
        .map(cid => ({ clientId: cid, name: participants.find(p => p.client_id === cid)?.clients?.name || '—', total: totals[cid] || 0 }))
        .sort((a, b) => b.total - a.total);
      const yours = standings.find(s => s.clientId === config.clientId)?.total || 0;
      const leader = standings[0];
      return { mode: 'company_vs_company', yours, yoursLabel: 'Tes points', leaderName: leader?.name, leaderPoints: leader?.total || 0 };
    } catch (e) { return null; }
  }

  async function fetchHighlights(config) {
    if (!config) return { mainHighlights: [], eventHighlights: [] };
    const today = new Date().toISOString().slice(0, 10);
    try {
      const [defisRes, participRes, eventsRes, devicesRes] = await Promise.all([
        fetch(`${REST}/defis?client_id=eq.${config.clientId}&start_date=lte.${today}&end_date=gte.${today}&is_active=eq.true&select=*,games(name)`, { headers: headers() }),
        fetch(`${REST}/challenge_participants?client_id=eq.${config.clientId}&select=challenge_id`, { headers: headers() }),
        fetch(`${REST}/events?client_id=eq.${config.clientId}&start_date=lte.${today}&end_date=gte.${today}&is_active=eq.true&select=*,event_devices(device_id)`, { headers: headers() }),
        fetch(`${REST}/devices?client_id=eq.${config.clientId}&select=id,name`, { headers: headers() }),
      ]);
      const defisActive = defisRes.ok ? await defisRes.json() : [];
      const participations = participRes.ok ? await participRes.json() : [];
      const eventsAll = eventsRes.ok ? await eventsRes.json() : [];
      const devicesList = devicesRes.ok ? await devicesRes.json() : [];
      const devicesCache = {};
      devicesList.forEach(d => { devicesCache[d.id] = d.name; });

      let challengesActive = [];
      const challengeIds = participations.map(p => p.challenge_id);
      if (challengeIds.length) {
        const idsFilter = challengeIds.join(',');
        const chRes = await fetch(
          `${REST}/challenges?id=in.(${idsFilter})&start_date=lte.${today}&end_date=gte.${today}&is_active=eq.true&select=*,games(name),challenge_participants(client_id,clients(name))`,
          { headers: headers() }
        );
        challengesActive = chRes.ok ? await chRes.json() : [];
      }

      const eventsActive = eventsAll.filter(e => e.all_devices || (e.event_devices || []).some(ed => ed.device_id === config.deviceId));

      const gameItems = (config.enabledGameIds || []).map(gid => ({
        type: 'game',
        data: { id: gid, image_url: (config.gameImages && config.gameImages[gid]) || null },
        sort_order: (config.gameSortOrders && config.gameSortOrders[gid]) || 0,
      }));
      const indexItem = config.showIndexBanner ? [{ type: 'index', data: {}, sort_order: config.indexSortOrder ?? -1000 }] : [];

      const mainHighlights = [
        ...defisActive.map(d => ({ type: 'defi', data: d, sort_order: d.sort_order || 0 })),
        ...challengesActive.map(c => ({ type: 'challenge', data: c, sort_order: c.sort_order || 0 })),
        ...gameItems,
        ...indexItem,
      ].sort((a, b) => a.sort_order - b.sort_order);

      const eventHighlights = eventsActive
        .map(e => ({ type: 'event', data: e, sort_order: e.sort_order || 0 }))
        .sort((a, b) => a.sort_order - b.sort_order);

      await Promise.all(mainHighlights.map(async (item) => {
        if (item.type === 'defi') item.standings = await computeDefiStandings(item.data, config, devicesCache);
        else if (item.type === 'challenge') item.standings = await computeChallengeStandings(item.data, config);
      }));

      return { mainHighlights, eventHighlights };
    } catch (e) { return { mainHighlights: [], eventHighlights: [] }; }
  }

  /** Catalogue global des jeux (nom/description/photo par défaut, valable pour tous les clients). */
  async function fetchGamesCatalog() {
    try {
      const res = await fetch(`${REST}/games?select=id,name,description,image_url,name_en,name_de,name_it,description_en,description_de,description_it`, { headers: headers() });
      const rows = res.ok ? await res.json() : [];
      const catalog = {};
      rows.forEach(r => { catalog[r.id] = r; });
      return catalog;
    } catch (e) { return {}; }
  }

  return { getDeviceKey, setDeviceKey, clearDeviceKey, fetchClientConfig, recordSession, fetchHighlights, fetchGamesCatalog, findEmployeeByCode, createEmployee, fetchQuestionnaire, recordQuestionResponses };
})();

/* =====================================================================================
   MOTEUR CAPTEUR — PandaFitSensor
   Contrat repris à l'identique du code Flutter d'origine (device_bloc.dart,
   bluetooth_device_model.dart, panda_fit_admos_device.dart). Ne pas modifier ces
   constantes/calculs sans re-valider avec un capteur réel : c'est le lien critique.
   ===================================================================================== */
const PandaFitSensor = (() => {
  const SERVICE_UUID   = "0000acc1-1211-ef1e-aaaa-aaaaaaaaaaaa";
  const DATA_CHAR_UUID = "00000180-0000-1000-8000-00805f9b34fb";
  const FW_CHAR_UUID   = "00000181-0000-1000-8000-00805f9b34fb";
  const EXPECTED_PACKET_LENGTH = 16;
  const AVERAGE_EVERY = 2;
  const COORD_MAX_VALUE = 1500;
  const NAME_PREFIXES = ['ASI_BLE', 'AdMOS_BLE', 'PandaFit'];

  let device = null, characteristic = null;
  let center = { x: 0, y: 0 };
  let averageBuffer = [];
  let listeners = { data: [], status: [] };
  let packetCount = 0, lastSecondCount = 0, lastSecondTime = 0, hz = 0;
  let calibrationSamples = null; // array while calibrating, else null

  try {
    const saved = JSON.parse(localStorage.getItem('pandafit_center') || 'null');
    if (saved && typeof saved.x === 'number') center = saved;
  } catch (e) { /* pas de stockage dispo, on reste sur 0,0 */ }

  function toSigned8(byte) { return byte > 127 ? byte - 256 : byte; }

  function getLogarithmicValue(n) {
    if (n === 0) return 0;
    const sign = n > 0 ? 1 : -1;
    const abs = Math.abs(n);
    const value = Math.round((Math.log(abs) / Math.LN2) * Math.sqrt(abs)) * sign;
    return Math.min(value, COORD_MAX_VALUE);
  }

  function parsePacket(bytes) {
    const xMSB = bytes[1], xLSB = bytes[0], yMSB = bytes[3], yLSB = bytes[2];
    let x = (toSigned8(xMSB) << 8) | (xLSB & 0xFF);
    let y = (toSigned8(yMSB) << 8) | (yLSB & 0xFF);
    x = getLogarithmicValue(x);
    y = getLogarithmicValue(y);
    return {
      calibrated: { x: x - center.x, y: y - center.y },
      raw: { x, y }
    };
  }

  function emit(kind, payload) { listeners[kind].forEach(fn => fn(payload)); }

  function onData(evt) {
    const bytes = new Uint8Array(evt.target.value.buffer);
    if (bytes.length !== EXPECTED_PACKET_LENGTH) return;

    packetCount++; lastSecondCount++;
    const now = performance.now();
    if (now - lastSecondTime >= 1000) { hz = lastSecondCount; lastSecondCount = 0; lastSecondTime = now; }

    const { calibrated, raw } = parsePacket(bytes);

    if (calibrationSamples) calibrationSamples.push(raw);

    averageBuffer.push(calibrated);
    if (averageBuffer.length >= AVERAGE_EVERY) {
      const sum = averageBuffer.reduce((a, b) => ({ x: a.x + b.x, y: a.y + b.y }), { x: 0, y: 0 });
      averageBuffer = [];
      emit('data', {
        x: Math.trunc(sum.x / AVERAGE_EVERY),
        y: Math.trunc(sum.y / AVERAGE_EVERY),
        packetCount, hz
      });
    }
  }

  function setStatus(status, detail) { emit('status', { status, detail, device: device?.name }); }

  async function connectToDevice(bluetoothDevice) {
    device = bluetoothDevice;
    device.addEventListener('gattserverdisconnected', () => {
      characteristic = null;
      setStatus('disconnected', 'Le capteur s\'est déconnecté.');
    });
    setStatus('searching', 'Connexion…');
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(DATA_CHAR_UUID);
    await characteristic.startNotifications();
    characteristic.addEventListener('characteristicvaluechanged', onData);
    packetCount = 0; lastSecondCount = 0; lastSecondTime = performance.now();
    setStatus('connected', device.name);
    return device;
  }

  async function connect() {
    if (!navigator.bluetooth) {
      setStatus('error', "Web Bluetooth indisponible sur ce navigateur.");
      throw new Error('no-bluetooth');
    }
    setStatus('searching', 'Recherche…');
    const chosen = await navigator.bluetooth.requestDevice({
      filters: NAME_PREFIXES.map(p => ({ namePrefix: p })),
      optionalServices: [SERVICE_UUID]
    });
    return connectToDevice(chosen);
  }

  /** Tente une reconnexion silencieuse (sans sélecteur) à un capteur déjà autorisé.
   *  Ne fonctionne que si les 2 drapeaux Chrome expérimentaux sont activés sur l'appareil.
   *  Réessaie plusieurs fois avec un petit délai (la puce Bluetooth met parfois un
   *  instant à "revoir" l'appareil après le chargement de la page).
   *  Renvoie { success, reason } pour pouvoir diagnostiquer un échec. */
  async function tryAutoReconnect() {
    if (!navigator.bluetooth) return { success: false, reason: 'Web Bluetooth indisponible sur ce navigateur.' };
    if (!navigator.bluetooth.getDevices) return { success: false, reason: "getDevices() non disponible — les drapeaux Chrome ne sont probablement pas actifs (ou Chrome n'a pas redémarré depuis)." };
    let known;
    try {
      known = await navigator.bluetooth.getDevices();
    } catch (e) {
      return { success: false, reason: 'Erreur en listant les appareils connus : ' + e.message };
    }
    if (!known.length) return { success: false, reason: "getDevices() a répondu mais n'a trouvé aucun appareil précédemment autorisé — reconnecte une fois manuellement via le sélecteur, puis recharge." };
    const match = known.find(d => NAME_PREFIXES.some(p => d.name && d.name.startsWith(p)));
    if (!match) return { success: false, reason: `${known.length} appareil(s) connu(s) trouvé(s), mais aucun avec un nom correspondant (${known.map(d => d.name || '(sans nom)').join(', ')}).` };

    const attempts = 4;
    let lastError = null;
    for (let i = 1; i <= attempts; i++) {
      try {
        await connectToDevice(match);
        return { success: true };
      } catch (e) {
        lastError = e;
        if (i < attempts) await new Promise(r => setTimeout(r, 1000));
      }
    }
    return { success: false, reason: `Échec après ${attempts} tentatives : ${lastError?.message}` };
  }

  function disconnect() {
    if (device && device.gatt.connected) device.gatt.disconnect();
    setStatus('disconnected', '');
  }

  function isConnected() { return !!(device && device.gatt && device.gatt.connected); }

  /** Calibration: enregistre les échantillons pendant `seconds`, puis moyenne -> nouveau centre. */
  function calibrate(seconds, onTick, onDone) {
    calibrationSamples = [];
    let remaining = seconds;
    onTick && onTick(remaining);
    const timer = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(timer);
        const samples = calibrationSamples || [];
        calibrationSamples = null;
        if (samples.length > 0) {
          const sum = samples.reduce((a, b) => ({ x: a.x + b.x, y: a.y + b.y }), { x: 0, y: 0 });
          center = { x: Math.round(sum.x / samples.length), y: Math.round(sum.y / samples.length) };
          try { localStorage.setItem('pandafit_center', JSON.stringify(center)); } catch (e) {}
        }
        onDone && onDone(center, samples.length);
      } else {
        onTick && onTick(remaining);
      }
    }, 1000);
  }

  function on(kind, fn) { listeners[kind].push(fn); }
  function off(kind, fn) { listeners[kind] = listeners[kind].filter(f => f !== fn); }
  function getDeviceName() { return device?.name || null; }
  function getCenter() { return center; }

  return { connect, disconnect, isConnected, calibrate, on, off, getDeviceName, getCenter, tryAutoReconnect };
})();

/* =====================================================================================
   PETIT LECTEUR DE SONS — bips générés (pas de fichiers audio à fournir/copier)
   ===================================================================================== */
const SoundFx = (() => {
  let ctx = null;
  function getCtx() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); return ctx; }
  function beep(freq, durationMs, type = 'sine', gain = 0.15) {
    try {
      const c = getCtx();
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type; osc.frequency.value = freq;
      g.gain.value = gain;
      osc.connect(g); g.connect(c.destination);
      osc.start();
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + durationMs / 1000);
      osc.stop(c.currentTime + durationMs / 1000);
    } catch (e) { /* audio non dispo, on ignore */ }
  }
  return {
    ready: () => beep(660, 120),
    go: () => beep(880, 180),
    lifeLost: () => beep(180, 220, 'sawtooth', 0.18),
    finish: () => { beep(523, 140); setTimeout(() => beep(784, 260), 150); },
  };
})();

/* =====================================================================================
   JEU : THE ZONE — reste dans le cercle, ne perds pas tes vies
   Reprend la logique de game_the_zone_bloc.dart : rayon de zone en cm selon la
   difficulté, la vie n'est perdue qu'à la TRANSITION vers l'extérieur (pas à chaque
   frame passée dehors).
   ===================================================================================== */
const ZoneGame = (() => {
  const RADIUS_CM = { easy: 4.0, medium: 2.0, hard: 1.0 };
  const POSITION_DIVIDER = 2; // même conversion que l'original : cm ≈ raw / (100 * 2)
  const PREPARE_SECONDS = 5;
  const SHRINK_START_RATIO = 0.7; // la zone commence à rétrécir aux 70% du temps écoulé
  const SHRINK_AMOUNT = 0.5; // réduction totale de 50% à la fin
  const COOLDOWN_MS = 1000; // après une sortie : 1s "figé en rouge", pas de nouvelle vie perdue

  let cfg = { difficulty: 'medium', duration: 60, lives: 3, zoneMode: 'fixed' }; // lives: 3|5|Infinity, zoneMode: 'fixed'|'shrink'
  let state = null;

  function toCm(rawX, rawY) {
    return { x: rawX / (100 * POSITION_DIVIDER), y: rawY / (100 * POSITION_DIVIDER) };
  }

  function reset() {
    state = {
      running: false,
      timeLeft: cfg.duration,
      livesLost: 0,
      cooldownUntil: 0,
      xCm: 0, yCm: 0,
      startedAt: 0,
    };
  }

  function radiusCm() {
    const full = RADIUS_CM[cfg.difficulty];
    if (cfg.zoneMode !== 'shrink') return full;
    const elapsed = cfg.duration - state.timeLeft;
    const shrinkStart = cfg.duration * SHRINK_START_RATIO;
    if (elapsed <= shrinkStart) return full;
    const p = Math.min(1, (elapsed - shrinkStart) / (cfg.duration - shrinkStart));
    return full - p * (full * SHRINK_AMOUNT);
  }
  function livesRemaining() {
    return cfg.lives === Infinity ? Infinity : Math.max(0, cfg.lives - state.livesLost);
  }

  function onSensorData(d) {
    if (!state || !state.running) return;
    const { x, y } = toCm(d.x, d.y);
    state.xCm = x; state.yCm = y;
    const squared = (x * x) + (y * y);
    const squaredRange = radiusCm() * radiusCm();
    const now = Date.now();
    if (squared > squaredRange && now > state.cooldownUntil) {
      state.cooldownUntil = now + COOLDOWN_MS;
      state.livesLost++;
      SoundFx.lifeLost();
      if (cfg.lives !== Infinity && livesRemaining() <= 0) {
        finish('lives');
        return;
      }
    }
    onTickCb && onTickCb(snapshot()); // rafraîchit l'affichage en temps réel, pas juste 1x/seconde
  }

  let tickTimer = null;
  let onTickCb = null, onFinishCb = null;

  function start(config, onTick, onFinish) {
    cfg = config;
    onTickCb = onTick; onFinishCb = onFinish;
    reset();
    state.running = true;
    state.startedAt = Date.now();
    PandaFitSensor.off('data', onSensorData);
    PandaFitSensor.on('data', onSensorData);
    tickTimer = setInterval(() => {
      state.timeLeft -= 1;
      onTickCb && onTickCb(snapshot());
      if (state.timeLeft <= 0) finish('time');
    }, 1000);
  }

  function finish(reason) {
    if (!state.running) return;
    state.running = false;
    clearInterval(tickTimer);
    PandaFitSensor.off('data', onSensorData);
    SoundFx.finish();
    onFinishCb && onFinishCb(snapshot(), reason);
  }

  function snapshot() {
    const squared = (state.xCm * state.xCm) + (state.yCm * state.yCm);
    const rawOutside = squared > radiusCm() * radiusCm();
    const forcedOutside = Date.now() < state.cooldownUntil;
    return {
      timeLeft: state.timeLeft,
      livesLost: state.livesLost,
      livesRemaining: livesRemaining(),
      xCm: state.xCm, yCm: state.yCm,
      radiusCm: radiusCm(),
      difficulty: cfg.difficulty,
      duration: cfg.duration,
      lives: cfg.lives,
      zoneMode: cfg.zoneMode,
      outside: rawOutside || forcedOutside,
    };
  }

  /** Score simple, à affiner plus tard avec l'indice PandaFit :
   *  temps effectivement joué x multiplicateur de difficulté, pénalisé par les vies perdues. */
  function computeScore(snap, elapsedSeconds) {
    const mult = { easy: 1, medium: 2, hard: 3 }[snap.difficulty] || 1;
    const raw = elapsedSeconds * 10 * mult - snap.livesLost * 40;
    return Math.max(0, Math.round(raw));
  }

  return { start, finish, snapshot, computeScore, radiusCm, PREPARE_SECONDS };
})();

/* =====================================================================================
   JEU : VERRE D'EAU — le panda serveur porte un plateau avec un verre rempli à ras bord.
   Reste stable (statique ou mouvement régulier) pour ne pas faire déborder l'eau.
   ===================================================================================== */
/* =====================================================================================
   JEU : ELECTRO — suis le fil du doigt sans le lâcher. Le fil tremble avec ton équilibre.
   Contre-la-montre : le plus rapide gagne. Une sortie = vie perdue + freeze 2s (le chrono
   continue), reprise exactement là où on en était.
   ===================================================================================== */
/* =====================================================================================
   JEU : TIR AU BUT — phase 1 course (20s, compte les "en haut" sur l'axe Y), phase transition
   (calcule le temps de tir), phase tir (le but entier bouge selon l'instabilité).
   ===================================================================================== */
const FootballGame = (() => {
  const RUN_SECONDS = 10;
  const TRANSITION_SECONDS = 3;
  const UP_THRESHOLD = 1.2; // cm, seuil pour compter un passage "en haut" (balancement avant/arrière)
  const SHOOT_TOLERANCE = 15; // % de tolérance de tir (unités identiques à target/goalShift)
  const MISS_PAUSE_MS = 500;
  const PREPARE_SECONDS = 3;

  let latest = { x: 0, y: 0 };
  function onSensorData(d) { latest = { x: d.x / 200, y: d.y / 200 }; }

  let s = null;
  let tickHandle = null;
  let onPhaseCb = null, onFinishCb = null;

  function newShootRound() {
    s.targetRelX = (Math.random() - 0.5) * 56; // -28..28 (%)
    s.targetRelY = (Math.random() - 0.5) * 30; // -15..15 (%)
    s.roundResult = null;
  }

  function reset() {
    s = {
      phase: 'run', runTimeLeft: RUN_SECONDS, upCount: 0, wasUp: false, pose: 'down',
      transitionTimeLeft: TRANSITION_SECONDS, shootSeconds: 0, shootTimeLeft: 0,
      goals: 0, misses: 0, targetRelX: 0, targetRelY: 0,
      goalShiftX: 0, goalShiftY: 0, goalShiftVX: 0, goalShiftVY: 0,
      roundResult: null, roundResultUntil: 0, frozen: false, lastTickAt: performance.now(),
    };
    newShootRound();
  }

  function start(onPhase, onFinish) {
    onPhaseCb = onPhase; onFinishCb = onFinish;
    reset();
    PandaFitSensor.off('data', onSensorData);
    PandaFitSensor.on('data', onSensorData);
    s.lastTickAt = performance.now();
    tickHandle = setInterval(tick, 60);
  }

  function tick() {
    if (!s) return;
    const now = performance.now();
    const dt = (now - s.lastTickAt) / 1000;
    s.lastTickAt = now;

    if (s.phase === 'run') {
      const isUp = latest.y > UP_THRESHOLD;
      const isDown = latest.y < -UP_THRESHOLD;
      if (isUp && !s.wasUp) { s.upCount++; s.pose = 'up'; s.wasUp = true; }
      else if (isDown && s.wasUp) { s.pose = 'down'; s.wasUp = false; }
      s.runTimeLeft -= dt;
      if (s.runTimeLeft <= 0) {
        s.phase = 'transition';
        s.shootSeconds = Math.max(3, Math.round(s.upCount / 5));
        s.transitionTimeLeft = TRANSITION_SECONDS;
      }
    } else if (s.phase === 'transition') {
      s.transitionTimeLeft -= dt;
      if (s.transitionTimeLeft <= 0) {
        s.phase = 'shoot';
        s.shootTimeLeft = s.shootSeconds;
      }
    } else if (s.phase === 'shoot') {
      const targetShiftX = latest.x * 9;
      const targetShiftY = latest.y * 9;
      s.goalShiftVX += (targetShiftX - s.goalShiftX) * 0.06 - s.goalShiftVX * 0.2;
      s.goalShiftX += s.goalShiftVX;
      s.goalShiftVY += (targetShiftY - s.goalShiftY) * 0.06 - s.goalShiftVY * 0.2;
      s.goalShiftY += s.goalShiftVY;

      if (!s.frozen) {
        s.shootTimeLeft -= dt;
        if (s.shootTimeLeft <= 0) { finish(); return; }
      } else if (now > s.roundResultUntil) {
        s.frozen = false;
        newShootRound();
      }
    }
    onPhaseCb && onPhaseCb(snapshot());
  }

  /** tapX/tapY en % relatifs au centre de la zone de but (-50..50 environ) */
  function attemptShot(tapX, tapY) {
    if (!s || s.phase !== 'shoot' || s.frozen) return;
    const targetX = s.targetRelX + s.goalShiftX;
    const targetY = s.targetRelY + s.goalShiftY;
    const dist = Math.hypot(tapX - targetX, tapY - targetY);
    const hit = dist <= SHOOT_TOLERANCE;
    if (hit) { s.goals++; SoundFx.ready(); } else { s.misses++; SoundFx.lifeLost(); }
    s.roundResult = hit ? 'hit' : 'miss';
    s.roundResultUntil = performance.now() + MISS_PAUSE_MS;
    s.frozen = true;
  }

  function finish() {
    if (!s) return;
    clearInterval(tickHandle);
    PandaFitSensor.off('data', onSensorData);
    SoundFx.finish();
    onFinishCb && onFinishCb(snapshot());
  }

  function snapshot() {
    return {
      phase: s.phase, runTimeLeft: Math.max(0, s.runTimeLeft), upCount: s.upCount, pose: s.pose,
      transitionTimeLeft: Math.max(0, s.transitionTimeLeft), shootSeconds: s.shootSeconds,
      shootTimeLeft: Math.max(0, s.shootTimeLeft), goals: s.goals, misses: s.misses,
      targetX: s.targetRelX + s.goalShiftX, targetY: s.targetRelY + s.goalShiftY,
      roundResult: s.roundResult, frozen: s.frozen,
    };
  }

  function computeScore(snap) { return snap.goals * 100 - snap.misses * 10; }

  return { start, attemptShot, computeScore, PREPARE_SECONDS };
})();

const ElectroGame = (() => {
  const SENS = { easy: 0.7, hard: 2.4 }; // influence du capteur sur le tremblement du fil
  const TOLERANCE = 55; // tolérance du doigt, en unités du viewBox SVG (bien plus généreuse)
  const N = 50;
  const FREEZE_MS = 2000;
  const PREPARE_SECONDS = 3;
  const Y_TOP = 40, Y_BOTTOM = 460;

  let cfg = { sensitivity: 'easy', lives: 3 };
  let state = null;
  let latest = { x: 0, y: 0 };
  function onSensorData(d) { latest = { x: d.x / 200, y: d.y / 200 }; }

  function generatePath() {
    const pts = [];
    // Une seule fréquence basse => courbes douces façon "S", pas de zigzag anguleux.
    const seedA = 0.12 + Math.random() * 0.1;
    const amp = 95 + Math.random() * 15;
    const phase = Math.random() * 6;
    for (let i = 0; i <= N; i++) {
      const y = Y_TOP + ((Y_BOTTOM - Y_TOP) * i) / N;
      const baseX = 150 + Math.sin(i * seedA + phase) * amp;
      pts.push({ y, baseX: Math.max(25, Math.min(275, baseX)) });
    }
    return pts;
  }

  function reset() {
    state = {
      running: false, pts: generatePath(), progressIdx: 0,
      wobbleX: 0, wobbleV: 0, livesLost: 0, frozen: false,
      elapsedMs: 0, startedAt: 0,
    };
  }
  function livesRemaining() { return cfg.lives === Infinity ? Infinity : Math.max(0, cfg.lives - state.livesLost); }

  let tickHandle = null, onTickCb = null, onFinishCb = null, onMissCb = null;

  function start(config, onTick, onFinish, onMiss) {
    cfg = config; onTickCb = onTick; onFinishCb = onFinish; onMissCb = onMiss;
    reset();
    state.running = true; state.startedAt = performance.now();
    PandaFitSensor.off('data', onSensorData);
    PandaFitSensor.on('data', onSensorData);
    tickHandle = setInterval(tick, 60);
  }

  function tick() {
    if (!state || !state.running) return;
    state.elapsedMs = performance.now() - state.startedAt;
    if (!state.frozen) {
      const target = latest.x * SENS[cfg.sensitivity] * 12;
      state.wobbleV += (target - state.wobbleX) * 0.08 - state.wobbleV * 0.25;
      state.wobbleX += state.wobbleV;
    }
    onTickCb && onTickCb(snapshot());
  }

  function expectedXAt(idx) { return state.pts[idx].baseX + state.wobbleX; }
  function idxFromY(y) {
    const ratio = (y - Y_TOP) / (Y_BOTTOM - Y_TOP);
    return Math.max(0, Math.min(N, Math.round(ratio * N)));
  }

  /** À appeler à chaque déplacement du doigt (coordonnées dans le viewBox SVG). */
  function handleTouch(x, y) {
    if (!state || !state.running || state.frozen) return;
    const idx = idxFromY(y);
    const expectedX = expectedXAt(idx);
    if (Math.abs(x - expectedX) > TOLERANCE) {
      miss(x, y);
      return;
    }
    if (idx > state.progressIdx) state.progressIdx = idx;
    if (state.progressIdx >= N) finish('complete');
  }

  function miss(x, y) {
    state.frozen = true;
    state.livesLost++;
    SoundFx.lifeLost();
    onMissCb && onMissCb(x, y);
    if (cfg.lives !== Infinity && livesRemaining() <= 0) {
      setTimeout(() => finish('lives'), FREEZE_MS);
      return;
    }
    setTimeout(() => { if (state) state.frozen = false; }, FREEZE_MS);
  }

  function finish(reason) {
    if (!state.running) return;
    state.running = false;
    clearInterval(tickHandle);
    PandaFitSensor.off('data', onSensorData);
    SoundFx.finish();
    onFinishCb && onFinishCb(snapshot(), reason);
  }

  function snapshot() {
    return {
      pts: state.pts, progressIdx: state.progressIdx, wobbleX: state.wobbleX,
      livesLost: state.livesLost, livesRemaining: livesRemaining(), frozen: state.frozen,
      elapsedMs: state.elapsedMs, sensitivity: cfg.sensitivity, lives: cfg.lives,
    };
  }

  /** Contre-la-montre : plus c'est rapide, plus le score est élevé. */
  function computeScore(snap) {
    const seconds = snap.elapsedMs / 1000;
    const mult = { easy: 1, hard: 2 }[snap.sensitivity] || 1;
    const raw = 1800 - seconds * 8 * mult - snap.livesLost * 60;
    return Math.max(0, Math.round(raw));
  }

  return { start, finish, snapshot, computeScore, handleTouch, PREPARE_SECONDS, N, Y_TOP, Y_BOTTOM };
})();

const WaterCupGame = (() => {
  const THRESH = { easy: 3.6, medium: 2.3, hard: 1.4 }; // "perturbation" tolérée avant débordement
  const PREPARE_SECONDS = 3;
  const SPILL_COOLDOWN_MS = 900;

  let cfg = { difficulty: 'medium', duration: 60, lives: 3 };
  let state = null;
  let latest = { x: 0, y: 0 };
  function onSensorData(d) { latest = { x: d.x / 200, y: d.y / 200 }; } // cm, cohérent avec les autres jeux

  function reset() {
    state = {
      running: false, timeLeft: cfg.duration, livesLost: 0,
      lastX: 0, lastY: 0, tilt: 0, tiltV: 0, wave: 0, waveV: 0,
      spillCooldownUntil: 0, justSpilled: false,
      startedAt: 0,
    };
  }

  function livesRemaining() { return cfg.lives === Infinity ? Infinity : Math.max(0, cfg.lives - state.livesLost); }

  let tickHandle = null, secTimer = null;
  let onTickCb = null, onFinishCb = null;

  function start(config, onTick, onFinish) {
    cfg = config; onTickCb = onTick; onFinishCb = onFinish;
    reset();
    state.running = true; state.startedAt = performance.now();
    PandaFitSensor.off('data', onSensorData);
    PandaFitSensor.on('data', onSensorData);
    secTimer = setInterval(() => { if (state.running) { state.timeLeft -= 1; if (state.timeLeft <= 0) finish('time'); } }, 1000);
    tickHandle = setInterval(tick, 60);
  }

  function tick() {
    if (!state || !state.running) return;
    const dx = latest.x - state.lastX, dy = latest.y - state.lastY;
    state.lastX = latest.x; state.lastY = latest.y;
    const speed = Math.min(Math.hypot(dx, dy) * 8, 6);
    state.tiltV += (dx * 0.5 - state.tilt * 0.12 - state.tiltV * 0.18);
    state.tilt += state.tiltV;
    state.waveV += (speed * 0.35 - state.wave * 0.14 - state.waveV * 0.22);
    state.wave += state.waveV;
    state.justSpilled = false;

    const disturbance = Math.abs(state.tilt) + Math.abs(state.wave);
    const now = performance.now();
    if (disturbance > THRESH[cfg.difficulty] && now > state.spillCooldownUntil) {
      state.livesLost++;
      state.spillCooldownUntil = now + SPILL_COOLDOWN_MS;
      state.justSpilled = true;
      SoundFx.lifeLost();
      if (cfg.lives !== Infinity && livesRemaining() <= 0) { finish('lives'); return; }
    }
    onTickCb && onTickCb(snapshot());
  }

  function finish(reason) {
    if (!state.running) return;
    state.running = false;
    clearInterval(tickHandle); clearInterval(secTimer);
    PandaFitSensor.off('data', onSensorData);
    SoundFx.finish();
    onFinishCb && onFinishCb(snapshot(), reason);
  }

  function snapshot() {
    return {
      timeLeft: state.timeLeft, livesLost: state.livesLost, livesRemaining: livesRemaining(),
      tilt: state.tilt, wave: state.wave, justSpilled: state.justSpilled,
      difficulty: cfg.difficulty, duration: cfg.duration, lives: cfg.lives,
    };
  }

  /** Même formule que les autres jeux, pour des scores comparables. */
  function computeScore(snap, elapsedSeconds) {
    const mult = { easy: 1, medium: 2, hard: 3 }[snap.difficulty] || 1;
    const raw = elapsedSeconds * 10 * mult - snap.livesLost * 40;
    return Math.max(0, Math.round(raw));
  }

  return { start, finish, snapshot, computeScore, PREPARE_SECONDS };
})();

/* =====================================================================================
   JEU : LE PANIER MALIN (habillage Migros Vaud — mascotte et couleurs originales,
   pas les assets officiels Migros)
   Le pied contrôle un panier horizontalement, il faut attraper les bons produits
   et éviter la malbouffe.
   ===================================================================================== */
const MigrosGame = (() => {
  const RADIUS_CM = { easy: 4.0, medium: 2.0, hard: 1.0 }; // taille de la zone à ne pas quitter (comme The Zone)
  const POSITION_DIVIDER = 2;
  const PREPARE_SECONDS = 3;
  const HEALTHY_EMOJIS = ['🍎', '🍌', '🍇', '🍓', '🥕', '🍊', '🍉'];
  const JUNK_EMOJIS = ['🍬', '🍭', '🍩', '🧁', '🍫', '🍟'];

  let cfg = { difficulty: 'medium', duration: 45, lives: 3 };
  let s = null;
  let latestX = 0, latestY = 0;
  function onSensorData(d) { latestX = d.x / (100 * POSITION_DIVIDER); latestY = d.y / (100 * POSITION_DIVIDER); } // cm, comme The Zone

  function radiusCm() { return RADIUS_CM[cfg.difficulty]; }
  function livesRemaining() { return cfg.lives === Infinity ? Infinity : Math.max(0, cfg.lives - s.livesLost); }

  function reset() {
    s = {
      items: [], goodCount: 0, junkCount: 0, livesLost: 0, timeLeft: cfg.duration,
      running: true, lastZoneState: 'none', xCm: 0, yCm: 0,
    };
  }

  function spawnItem() {
    const isJunk = Math.random() < 0.4;
    const emoji = isJunk
      ? JUNK_EMOJIS[Math.floor(Math.random() * JUNK_EMOJIS.length)]
      : HEALTHY_EMOJIS[Math.floor(Math.random() * HEALTHY_EMOJIS.length)];
    s.items.push({ id: Math.random().toString(36).slice(2), kind: isJunk ? 'junk' : 'healthy', emoji, x: 0.1 + Math.random() * 0.8, y: -0.06, speed: 0.09 + Math.random() * 0.05 });
  }

  let rafId = null, spawnTimer = null, tickTimer = null;
  let onFrameCb = null, onFinishCb = null, onCatchCb = null;

  function start(config, onFrame, onFinish, onCatch) {
    cfg = config; onFrameCb = onFrame; onFinishCb = onFinish; onCatchCb = onCatch;
    reset();
    PandaFitSensor.off('data', onSensorData);
    PandaFitSensor.on('data', onSensorData);
    spawnTimer = setInterval(spawnItem, 800);
    tickTimer = setInterval(() => { s.timeLeft -= 1; if (s.timeLeft <= 0) finish('time'); }, 1000);
    loop();
  }

  function loop() {
    if (!s.running) return;
    s.xCm = latestX; s.yCm = latestY;
    const squared = latestX * latestX + latestY * latestY;
    const squaredRange = radiusCm() * radiusCm();
    if (squared > squaredRange && s.lastZoneState !== 'outside') {
      s.lastZoneState = 'outside';
      s.livesLost++;
      SoundFx.lifeLost();
      if (cfg.lives !== Infinity && livesRemaining() <= 0) { finish('lives'); return; }
    } else if (squared <= squaredRange && s.lastZoneState !== 'inside') {
      s.lastZoneState = 'inside';
    }
    for (let i = s.items.length - 1; i >= 0; i--) {
      const it = s.items[i];
      it.y += it.speed * 0.02;
      if (it.y > 1.05) s.items.splice(i, 1);
    }
    onFrameCb && onFrameCb(snapshot());
    rafId = requestAnimationFrame(loop);
  }

  /** À appeler quand le joueur tape sur un item affiché à l'écran (par son id). */
  function tapItem(id) {
    if (!s || !s.running) return null;
    const idx = s.items.findIndex(it => it.id === id);
    if (idx === -1) return null;
    const it = s.items[idx];
    s.items.splice(idx, 1);
    if (it.kind === 'junk') { s.junkCount++; SoundFx.lifeLost(); }
    else { s.goodCount++; SoundFx.ready(); }
    onCatchCb && onCatchCb(it.kind, it.x, it.y);
    return it.kind;
  }

  function finish(reason) {
    if (!s.running) return;
    s.running = false;
    clearInterval(spawnTimer); clearInterval(tickTimer); cancelAnimationFrame(rafId);
    PandaFitSensor.off('data', onSensorData);
    SoundFx.finish();
    onFinishCb && onFinishCb(snapshot(), reason);
  }

  function snapshot() {
    return {
      items: s.items.slice(), goodCount: s.goodCount, junkCount: s.junkCount,
      livesLost: s.livesLost, livesRemaining: livesRemaining(), timeLeft: s.timeLeft,
      xCm: s.xCm, yCm: s.yCm, radiusCm: radiusCm(), difficulty: cfg.difficulty, lives: cfg.lives,
    };
  }

  function computeScore(snap) { return snap.goodCount - snap.junkCount; }

  return { start, finish, snapshot, tapItem, computeScore, radiusCm, PREPARE_SECONDS };
})();

/* =====================================================================================
   JEU : SLALOM RÉFLEXE (prévention blessures ski — inspiré des couleurs Swiss-Ski,
   sans personnage réel). Vraies portes de slalom alternées rouge/bleu qui défilent :
   il faut garder un rythme régulier gauche-droite, avec une amplitude qui varie.
   ===================================================================================== */
const SlalomGame = (() => {
  const PREPARE_SECONDS = 3;
  const TOTAL_DIST_M = 400;
  const RUNOUT_MS = 2500; // zone d'arrivée avant la vraie fin

  let s = null;
  let latestX = 0;
  let tickTimer = null;
  let onFrameCb = null, onFinishCb = null;

  function onSensorData(d) { latestX = d.x / 200; } // cm, même échelle que The Zone

  function reset() {
    s = {
      running: true, samples: [], distLeft: TOTAL_DIST_M, elapsedMs: 0,
      speedKmh: 10, traveled: 0, finished: false, runoutUntil: null, startedAt: 0,
      xCm: 0, prevX: 0, facingRight: false,
    };
  }

  function start(onFrame, onFinish) {
    onFrameCb = onFrame; onFinishCb = onFinish;
    reset();
    s.startedAt = performance.now();
    PandaFitSensor.off('data', onSensorData);
    PandaFitSensor.on('data', onSensorData);
    tickTimer = setInterval(tick, 60);
  }

  function tick() {
    if (!s || !s.running) return;
    s.elapsedMs = performance.now() - s.startedAt;
    s.samples.push(latestX);
    if (s.samples.length > 40) s.samples.shift();

    const dx = latestX - s.prevX;
    if (Math.abs(dx) > 0.03) s.facingRight = dx > 0; // orientation immédiate selon le sens réel du mouvement
    s.prevX = latestX;
    s.xCm = latestX;

    let amp = 0, crossings = 0;
    if (s.samples.length > 4) {
      const mean = s.samples.reduce((a, b) => a + b, 0) / s.samples.length;
      const mn = Math.min(...s.samples), mx = Math.max(...s.samples);
      amp = Math.min(1, (mx - mn) / 7); // 7cm d'amplitude pic-à-pic = plein score
      for (let i = 1; i < s.samples.length; i++) {
        if ((s.samples[i - 1] - mean) * (s.samples[i] - mean) < 0) crossings++;
      }
    }
    const regularity = Math.min(1, crossings / 4);
    const quality = amp * 0.6 + regularity * 0.4;
    s.speedKmh = Math.round(10 + quality * 60);

    if (!s.finished) {
      const distStep = (s.speedKmh / 3.6) * 0.06; // mètres parcourus sur ce tick de 60ms
      s.traveled += distStep;
      s.distLeft = Math.max(0, TOTAL_DIST_M - s.traveled);
      if (s.distLeft <= 0) {
        s.finished = true;
        s.runoutUntil = performance.now() + RUNOUT_MS;
        SoundFx.finish();
      }
    } else if (performance.now() > s.runoutUntil) {
      finish();
      return;
    }
    onFrameCb && onFrameCb(snapshot());
  }

  function finish() {
    if (!s.running) return;
    s.running = false;
    clearInterval(tickTimer);
    PandaFitSensor.off('data', onSensorData);
    onFinishCb && onFinishCb(snapshot());
  }

  function snapshot() {
    return {
      distLeft: s.distLeft, elapsedMs: s.elapsedMs, speedKmh: s.speedKmh,
      traveled: s.traveled, finished: s.finished, totalDist: TOTAL_DIST_M,
      xCm: s.xCm, facingRight: s.facingRight,
    };
  }

  /** Plus le temps total est court, meilleur le score. */
  function computeScore(snap) {
    const seconds = snap.elapsedMs / 1000;
    return Math.max(0, Math.round(2400 - seconds * 8));
  }

  return { start, finish, snapshot, computeScore, PREPARE_SECONDS };
})();

/* =====================================================================================
   TEST PANDAFIT INDEX — protocole standardisé, séparé des jeux.
   "Balance in motion" : l'équilibre n'est pas l'immobilité, c'est la qualité du
   mouvement. Deux épreuves à protocole fixe (mêmes conditions pour tout le monde,
   donc comparables dans le temps et entre personnes) :
     1. Équilibre statique (20s) — "signature" = distance au centre (moins on bouge, mieux c'est)
     2. Équilibre en mouvement (20s, axe Y) — régularité (critère n°1) x amplitude (critère n°2)
   Index final = 30% statique + 70% mouvement.
   ===================================================================================== */
const IndexTest = (() => {
  const STATIC_DURATION_S = 20;
  const STATIC_PHASE1_S = 10; // rayon fixe
  const STATIC_RADIUS_START_CM = 8;    // large et tolérant — le but est que tout le monde termine sans stress
  const STATIC_RADIUS_END_CM = 4;      // rétrécit, mais reste large
  const STATIC_LIVES = 5;
  const STATIC_MAX_SWAY_CM = 6; // sway au-delà duquel le score statique tombe à 0

  const MOVE_DURATION_S = 20;
  const MOVE_LINE_CM = 2; // lignes à franchir, à ±2cm du centre — atteignable naturellement
  const MOVE_MIN_PROMINENCE_CM = 1.2; // filtre anti-bruit pour la détection des pics
  const MOVE_MAX_AMPLITUDE_CM = 7; // amplitude de référence pour un score de 100
  const MOVE_MAX_CV = 0.6; // variation (régularité) au-delà de laquelle le score tombe à 0

  let latest = { x: 0, y: 0 };
  function onSensorData(d) { latest = { x: d.x / 200, y: d.y / 200 }; } // cm

  /* ---------- Test 1 : équilibre statique ---------- */
  let staticState = null;
  function radiusAt(elapsedS) {
    if (elapsedS <= STATIC_PHASE1_S) return STATIC_RADIUS_START_CM;
    const p = Math.min(1, (elapsedS - STATIC_PHASE1_S) / (STATIC_DURATION_S - STATIC_PHASE1_S));
    return STATIC_RADIUS_START_CM - p * (STATIC_RADIUS_START_CM - STATIC_RADIUS_END_CM);
  }
  function startStaticTest(onTick, onDone) {
    staticState = { points: [], livesLost: 0, lastPosition: 'none', startedAt: performance.now() };
    PandaFitSensor.off('data', onSensorData);
    PandaFitSensor.on('data', onSensorData);
    const handle = setInterval(() => {
      const elapsed = (performance.now() - staticState.startedAt) / 1000;
      staticState.points.push({ x: latest.x, y: latest.y });
      const r = radiusAt(elapsed);
      const squared = latest.x * latest.x + latest.y * latest.y;
      if (squared > r * r && staticState.lastPosition !== 'outside') {
        staticState.lastPosition = 'outside';
        staticState.livesLost++;
        SoundFx.lifeLost();
      } else if (squared <= r * r && staticState.lastPosition !== 'inside') {
        staticState.lastPosition = 'inside';
      }
      onTick && onTick({ elapsed, radius: r, x: latest.x, y: latest.y, livesLost: staticState.livesLost, lives: STATIC_LIVES });
      if (elapsed >= STATIC_DURATION_S || staticState.livesLost >= STATIC_LIVES) {
        clearInterval(handle);
        PandaFitSensor.off('data', onSensorData);
        SoundFx.finish();
        onDone && onDone(computeStaticScore(staticState.points), staticState.points, staticState.livesLost);
      }
    }, 60);
  }
  function computeStaticScore(points) {
    if (!points.length) return { score: 0, rmsCm: 0 };
    const meanSq = points.reduce((a, p) => a + (p.x * p.x + p.y * p.y), 0) / points.length;
    const rms = Math.sqrt(meanSq);
    const score = Math.max(0, Math.min(100, Math.round(100 * (1 - rms / STATIC_MAX_SWAY_CM))));
    return { score, rmsCm: Math.round(rms * 100) / 100 };
  }

  /* ---------- Test 2 : équilibre en mouvement (axe Y) ---------- */
  let moveState = null;
  function startMovementTest(onTick, onDone) {
    moveState = { samples: [], points: 0, lastLine: null, startedAt: performance.now() };
    PandaFitSensor.off('data', onSensorData);
    PandaFitSensor.on('data', onSensorData);
    const handle = setInterval(() => {
      const elapsed = (performance.now() - moveState.startedAt) / 1000;
      const t = performance.now();
      moveState.samples.push({ t, y: latest.y });
      if (latest.y > MOVE_LINE_CM && moveState.lastLine !== 'top') { moveState.lastLine = 'top'; moveState.points++; SoundFx.ready(); }
      else if (latest.y < -MOVE_LINE_CM && moveState.lastLine !== 'bottom') { moveState.lastLine = 'bottom'; moveState.points++; SoundFx.ready(); }
      onTick && onTick({ elapsed, y: latest.y, points: moveState.points });
      if (elapsed >= MOVE_DURATION_S) {
        clearInterval(handle);
        PandaFitSensor.off('data', onSensorData);
        SoundFx.finish();
        onDone && onDone(computeMovementScore(moveState.samples), moveState.samples, moveState.points);
      }
    }, 60);
  }
  /** Détection des pics/creux (algorithme "zigzag" classique, filtré par prominence). */
  function extractPeaks(samples, minProminenceCm) {
    if (samples.length < 3) return [];
    const peaks = [];
    let direction = 0, lastIdx = 0;
    for (let i = 1; i < samples.length; i++) {
      const diff = samples[i].y - samples[lastIdx].y;
      if (direction === 0) {
        if (Math.abs(diff) >= minProminenceCm) direction = diff > 0 ? 1 : -1;
        continue;
      }
      if (direction === 1) {
        if (samples[i].y > samples[lastIdx].y) lastIdx = i;
        else if (samples[lastIdx].y - samples[i].y >= minProminenceCm) { peaks.push(samples[lastIdx]); direction = -1; lastIdx = i; }
      } else {
        if (samples[i].y < samples[lastIdx].y) lastIdx = i;
        else if (samples[i].y - samples[lastIdx].y >= minProminenceCm) { peaks.push(samples[lastIdx]); direction = 1; lastIdx = i; }
      }
    }
    return peaks;
  }
  function coefVar(arr) {
    if (arr.length < 2) return 1; // pas assez de données = pas régulier par défaut
    const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
    if (mean === 0) return 1;
    const variance = arr.reduce((a, b) => a + (b - mean) * (b - mean), 0) / arr.length;
    return Math.sqrt(variance) / mean;
  }
  function computeMovementScore(samples) {
    const peaks = extractPeaks(samples, MOVE_MIN_PROMINENCE_CM);
    if (peaks.length < 3) return { score: 0, regularityScore: 0, amplitudeScore: 0, amplitudeCm: 0, cycles: peaks.length };
    const intervals = [], amplitudes = [];
    for (let i = 1; i < peaks.length; i++) {
      intervals.push(peaks[i].t - peaks[i - 1].t);
      amplitudes.push(Math.abs(peaks[i].y - peaks[i - 1].y));
    }
    const cvIntervals = coefVar(intervals);
    const cvAmplitudes = coefVar(amplitudes);
    const cvCombined = (cvIntervals + cvAmplitudes) / 2;
    const regularityScore = Math.max(0, Math.min(100, Math.round(100 * (1 - cvCombined / MOVE_MAX_CV))));
    const meanAmplitude = amplitudes.reduce((a, b) => a + b, 0) / amplitudes.length;
    const amplitudeScore = Math.max(0, Math.min(100, Math.round(100 * meanAmplitude / MOVE_MAX_AMPLITUDE_CM)));
    const score = Math.round((regularityScore / 100) * amplitudeScore);
    return { score, regularityScore, amplitudeScore, amplitudeCm: Math.round(meanAmplitude * 10) / 10, cycles: peaks.length };
  }

  function computeOverallIndex(staticScore, movementScore) {
    return Math.round(0.3 * staticScore + 0.7 * movementScore);
  }

  return { startStaticTest, startMovementTest, computeOverallIndex, STATIC_DURATION_S, MOVE_DURATION_S, STATIC_LIVES, MOVE_LINE_CM };
})();

/* =====================================================================================
   APPLICATION — routage simple + écrans
   ===================================================================================== */
const content = document.getElementById('content');

const ALWAYS_RH_LOCKED_ROUTES = ['calibrate'];
function isRouteLocked(route) {
  if (ALWAYS_RH_LOCKED_ROUTES.includes(route)) return true;
  if (route === 'games' && clientConfig?.lockGames) return true;
  return false;
}

function navigate(route) {
  if (isRouteLocked(route) && !rhUnlocked) {
    requestRHUnlock(route);
    return;
  }
  currentRoute = route;
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.nav === route));
  render();
}
document.querySelectorAll('.navbtn').forEach(b => b.addEventListener('click', () => navigate(b.dataset.nav)));

function applyNavLockVisuals() {
  document.querySelectorAll('.navbtn').forEach(b => {
    const route = b.dataset.nav;
    b.classList.toggle('locked', isRouteLocked(route) && !rhUnlocked);
  });
}

function requestRHUnlock(targetRoute) {
  content.innerHTML = screenRHPin(targetRoute);
  wireRHPin(targetRoute);
}
function screenRHPin(targetRoute, errorMsg) {
  return `
    <div class="connect-hero">
      <div class="icon"><i data-lucide="lock"></i></div>
      <h2>Accès réservé</h2>
      <p>Cette section est réservée au RH / responsable. Entre le code d'accès.</p>
      <input id="rhPinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4"
        placeholder="• • • •"
        style="width:100%;padding:14px;border-radius:12px;border:none;background:var(--panel-hi);color:var(--text);font-size:26px;text-align:center;letter-spacing:0.5em;margin-bottom:12px;box-sizing:border-box;">
      ${errorMsg ? `<p style="color:#ff8a97;font-size:13px;margin-bottom:12px;">${errorMsg}</p>` : ''}
      <button class="btn-ghost" id="btnRHCancel" style="width:100%;">Annuler</button>
    </div>
  `;
}
function wireRHPin(targetRoute) {
  document.getElementById('btnRHCancel')?.addEventListener('click', () => navigate('home'));
  const input = document.getElementById('rhPinInput');
  input?.focus();
  const validate = () => {
    const val = input.value.trim();
    if (clientConfig && val === clientConfig.rhPin) {
      rhUnlocked = true;
      applyNavLockVisuals();
      currentRoute = targetRoute;
      document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.nav === targetRoute));
      render();
    } else {
      content.innerHTML = screenRHPin(targetRoute, 'Code incorrect.');
      wireRHPin(targetRoute);
    }
  };
  input?.addEventListener('input', () => {
    if (clientConfig && input.value.length >= clientConfig.rhPin.length) validate();
  });
  input?.addEventListener('keydown', (e) => { if (e.key === 'Enter') validate(); });
}

function render() {
  const connected = PandaFitSensor.isConnected();
  if (!connected && (currentRoute === 'home' || currentRoute === 'games' || currentRoute === 'indextest')) {
    content.innerHTML = screenConnect();

    return;

  switch (currentRoute) {
    case 'home': content.innerHTML = screenHome(); wireHomeScreen(); break;
    case 'games': content.innerHTML = screenGames(); wireGamesScreen(); break;
    case 'indextest': launchIndexWithQuestionnaire(); break;
    case 'calibrate': content.innerHTML = screenCalibrateIntro(); wireCalibrateIntro(); break;
    case 'settings': content.innerHTML = screenSettings(); wireSettingsScreen(); break;
    default: content.innerHTML = screenHome(); wireHomeScreen();
  }
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.nav === currentRoute));
}
