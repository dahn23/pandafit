async function showQuestionnaireThenLaunch(questionnaireId, launchFn) {
  if (!questionnaireId) { pendingQuestionnaireAnswers = null; launchFn(); return; }
  const questions = await PandaFitBackend.fetchQuestionnaire(questionnaireId);
  if (!questions.length) { pendingQuestionnaireAnswers = null; launchFn(); return; }
  qFlowQuestions = questions;
  qFlowIndex = 0;
  qFlowAnswers = questions.map(() => null);
  qFlowLaunchFn = launchFn;
  renderQuestionnaireFlow();
}
function renderQuestionnaireFlow() {
  const q = qFlowQuestions[qFlowIndex];
  const isLast = qFlowIndex === qFlowQuestions.length - 1;
  const answered = qFlowAnswers[qFlowIndex] != null;
  content.innerHTML = `
    <button class="btn-ghost" id="btnQBackTop" style="margin-bottom:14px;">← Retour</button>
    <p class="page-sub">${t('q_question')} ${qFlowIndex + 1} / ${qFlowQuestions.length}</p>
    <div class="card">
      <h1 class="page-title" style="font-size:19px;margin-bottom:16px;">${pickLang(q, 'question_text')}</h1>
      <div id="qOptionsList">
        ${q.question_options.map(o => `
          <button class="btn-ghost qoption" data-option-id="${o.id}"
            style="width:100%;text-align:left;margin-bottom:10px;${qFlowAnswers[qFlowIndex] === o.id ? 'outline:2px solid var(--primary);' : ''}">
            ${pickLang(o, 'option_text')}
          </button>
        `).join('')}
      </div>
    </div>
    <div class="row" style="gap:8px;">
      ${qFlowIndex > 0 ? `<button class="btn-ghost" id="btnQPrev">${t('q_prev')}</button>` : ''}
      ${isLast
        ? `<button class="btn-primary" id="btnQValidate" ${answered ? '' : 'disabled'}>${t('q_validate')}</button>`
        : `<button class="btn-primary" id="btnQNext" ${answered ? '' : 'disabled'}>${t('q_next')}</button>`}
    </div>
  `;
  document.getElementById('btnQBackTop')?.addEventListener('click', () => {
    qFlowLaunchFn = null;
    navigate('home');
  });
  document.querySelectorAll('.qoption').forEach(btn => {
    btn.addEventListener('click', () => {
      qFlowAnswers[qFlowIndex] = btn.dataset.optionId;
      renderQuestionnaireFlow();
    });
  });
  document.getElementById('btnQPrev')?.addEventListener('click', () => { qFlowIndex--; renderQuestionnaireFlow(); });
  document.getElementById('btnQNext')?.addEventListener('click', () => { qFlowIndex++; renderQuestionnaireFlow(); });
  document.getElementById('btnQValidate')?.addEventListener('click', () => {
    pendingQuestionnaireAnswers = qFlowQuestions
      .map((qq, i) => ({ questionId: qq.id, optionId: qFlowAnswers[i] }))
      .filter(a => a.optionId);
    const fn = qFlowLaunchFn;
    qFlowLaunchFn = null;
    fn();
  });
}
function renderCarousel(key, containerId) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;
  const c = carousels[key];
  if (!c.items.length) { wrap.innerHTML = ''; return; }
  const item = c.items[c.index];
  const touchAreaId = containerId + 'TouchArea';
  const label = key === 'events' ? `<div class="carousel-label"><i data-lucide="calendar"></i> Événements</div>` : '';
  wrap.innerHTML = `
    ${label}
    <div class="highlights-wrap" id="${touchAreaId}">
      ${highlightCardHTML(item)}
      ${c.items.length > 1 ? `
        <div class="highlight-dots">
          ${c.items.map((_, i) => `<div class="d ${i === c.index ? 'active' : ''}"></div>`).join('')}
        </div>
      ` : ''}
    </div>
  `;
  const area = document.getElementById(touchAreaId);
  let touchStartX = null, wasSwipe = false;
  area.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; wasSwipe = false; }, { passive: true });
  area.addEventListener('touchmove', (e) => {
    if (touchStartX !== null && Math.abs(e.touches[0].clientX - touchStartX) > 15) wasSwipe = true;
  }, { passive: true });
  area.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const deltaX = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(deltaX) > 40) {
      wasSwipe = true;
      c.index = (c.index + (deltaX < 0 ? 1 : -1) + c.items.length) % c.items.length;
      renderCarousel(key, containerId);
      startCarouselTimer(key, containerId); // on relance le compte à rebours après une interaction manuelle
    }
    touchStartX = null;
  });
  area.addEventListener('click', () => {
    if (wasSwipe) { wasSwipe = false; return; }
    openHighlightDetail(c.items[c.index]);
  });
}
function renderHighlightsCarousel() {
  renderMainStack();
  renderCarousel('events', 'eventsWrap');
}
function startHighlightTimer() {
  startCarouselTimer('events', 'eventsWrap');

function formatCountdown(endDate) {
  const end = new Date(endDate + 'T23:59:59');
  let diff = Math.max(0, end.getTime() - Date.now());
  const days = Math.floor(diff / 86400000); diff -= days * 86400000;
  const hours = Math.floor(diff / 3600000); diff -= hours * 3600000;
  const mins = Math.floor(diff / 60000); diff -= mins * 60000;
  const secs = Math.floor(diff / 1000);
  if (days > 0) return `${days}j ${String(hours).padStart(2, '0')}h ${String(mins).padStart(2, '0')}min`;
  return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function heartsHTML(filled, total) {
  if (total === Infinity) return '<i data-lucide="infinity"></i>';
  let html = '';
  for (let i = 0; i < total; i++) {
    html += `<i data-lucide="heart" class="${i < filled ? 'heart-full' : 'heart-empty'}" ${i < filled ? 'style="fill:currentColor"' : ''}></i>`;
  }
  return html;
}
function heartsDisplay(remaining) {
  return heartsHTML(remaining, zoneSetupCfg.lives);
}
/** Ne redessine les cœurs que si le nombre affiché a réellement changé — évite le clignotement
 *  causé par la régénération des icônes plus vite que leur cycle d'actualisation (350ms). */
function setHeartsIfChanged(el, filled, total) {
  if (!el) return;
  const key = `${filled}/${total}`;
  if (el.dataset.heartsKey === key) return;
  el.dataset.heartsKey = key;
  el.innerHTML = heartsHTML(filled, total);
}

function screenZonePlaying() {
  return `
    <div class="panda-watcher" id="zonePandaWatcher">
      <img id="zonePandaCalm" src="${PANDA_FACE_CALM_B64}" class="panda-watcher-face active">
      <img id="zonePandaScared" src="${PANDA_FACE_SCARED_B64}" class="panda-watcher-face">
    </div>
    <div class="centered-page">
    <div class="zone-hud">
      <div class="hearts" id="zoneHearts"></div>
      <div class="timer" id="zoneTimer">--</div>
    </div>
    <div class="zone-canvas-wrap">
      <canvas id="zoneCanvas" width="300" height="300"></canvas>
    </div>
    <p class="page-sub" style="text-align:center;">Reste dans le cercle vert.</p>
  </div>
  `;

function renderZonePlaying(snap) {
  const heartsEl = document.getElementById('zoneHearts');
  const timerEl = document.getElementById('zoneTimer');
  setHeartsIfChanged(heartsEl, snap.livesRemaining, zoneSetupCfg.lives);
  if (timerEl) {
    const m = Math.floor(Math.max(0, snap.timeLeft) / 60), s = Math.max(0, snap.timeLeft) % 60;
    timerEl.textContent = `${m}:${String(s).padStart(2, '0')}`;
  }
  const canvas = document.getElementById('zoneCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2;
  const pxPerCm = 26;
  ctx.clearRect(0, 0, w, h);
  // zone circle
  const inside = !snap.outside;
  document.getElementById('zonePandaCalm')?.classList.toggle('active', inside);
  document.getElementById('zonePandaScared')?.classList.toggle('active', !inside);
  ctx.beginPath();
  ctx.arc(cx, cy, snap.radiusCm * pxPerCm, 0, Math.PI * 2);
  ctx.fillStyle = inside ? 'rgba(67,206,162,0.15)' : 'rgba(230,55,78,0.12)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = inside ? '#43cea2' : '#e6374e';
  ctx.stroke();
  // dot (pied)
  const px = cx + snap.xCm * pxPerCm;
  const py = cy - snap.yCm * pxPerCm;
  ctx.beginPath();
  ctx.arc(px, py, 10, 0, Math.PI * 2);
  ctx.fillStyle = inside ? '#43cea2' : '#e6374e';
  ctx.fill();
}

function migrosSpawnCatchPulse(kind, xNorm, yNorm) {

function renderMigrosPlaying(snap) {
  const heartsEl = document.getElementById('migrosHearts');

  setHeartsIfChanged(heartsEl, snap.livesRemaining, migrosCfg.lives);
  if (timerEl) timerEl.textContent = `${Math.max(0, snap.timeLeft)}s · 🍎${snap.goodCount} 🍬${snap.junkCount}`;

    `).join('');
  }

  const canvas = document.getElementById('migrosZoneCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2;
  const pxPerCm = 20;
  ctx.clearRect(0, 0, w, h);
  const inside = (snap.xCm * snap.xCm + snap.yCm * snap.yCm) <= (snap.radiusCm * snap.radiusCm);
  ctx.beginPath();
  ctx.arc(cx, cy, snap.radiusCm * pxPerCm, 0, Math.PI * 2);
  ctx.fillStyle = inside ? 'rgba(67,206,162,0.15)' : 'rgba(230,55,78,0.12)';
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = inside ? '#43cea2' : '#e6374e';
  ctx.stroke();
  const px = cx + snap.xCm * pxPerCm, py = cy - snap.yCm * pxPerCm;
  ctx.beginPath();
  ctx.arc(px, py, 9, 0, Math.PI * 2);
  ctx.fillStyle = inside ? '#43cea2' : '#e6374e';
  ctx.fill();
}

const SKI_SKIER_Y = 130, SKI_GATE_OFFSET = 55, SKI_GATE_VISUAL_OFFSET = 41, SKI_GATE_SPACING = 45, SKI_FINISH_BASE_Y = 900;
let skiSceneReady = false;
function wireSkiScene() {
  const treesEl = document.getElementById('skiTrees');
  const gatesEl = document.getElementById('skiGates');
  const finishEl = document.getElementById('skiFinish');
  treesEl.innerHTML = ''; gatesEl.innerHTML = ''; finishEl.innerHTML = '';
  gatesEl.style.opacity = 1;

  const TREE_RANGE = 8 * 35, TREE_MIN_Y = 22;
  for (let i = 0; i < 8; i++) {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', i % 2 === 0 ? 20 : 280);
    t.dataset.baseY = 220 - i * 35;
    t.setAttribute('y', t.dataset.baseY);
    t.setAttribute('font-size', '18');
    t.textContent = '🌲';
    treesEl.appendChild(t);
  }
  window._skiGateEls = [];
  const GATE_RANGE = 10 * SKI_GATE_SPACING;
  for (let i = 0; i < 10; i++) {
    const isLeft = i % 2 === 0;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    const color = isLeft ? '#e8112d' : '#0a3d91';
    const pole = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    pole.setAttribute('x1', 0); pole.setAttribute('x2', 0); pole.setAttribute('y1', 0); pole.setAttribute('y2', 24);
    pole.setAttribute('stroke', '#666'); pole.setAttribute('stroke-width', 2);
    const flag = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    flag.setAttribute('d', 'M0 0 L12 3 L0 7 Z'); flag.setAttribute('fill', color);
    g.appendChild(pole); g.appendChild(flag);
    const x = 150 + (isLeft ? -SKI_GATE_VISUAL_OFFSET : SKI_GATE_VISUAL_OFFSET);
    const baseY = 220 - i * SKI_GATE_SPACING;
    g.dataset.baseY = baseY;
    g.setAttribute('transform', `translate(${x},${baseY})`);
    gatesEl.appendChild(g);
    window._skiGateEls.push({ el: g, x });
  }
  const checkSize = 12;
  window._skiFinishEls = [];
  for (let col = 0; col < 26; col++) {
    for (let row = 0; row < 2; row++) {
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', col * checkSize); r.setAttribute('width', checkSize); r.setAttribute('height', checkSize);
      r.setAttribute('fill', (col + row) % 2 === 0 ? '#111' : '#fff');
      r.dataset.baseY = SKI_FINISH_BASE_Y + row * checkSize;
      r.setAttribute('y', r.dataset.baseY);
      finishEl.appendChild(r);
      window._skiFinishEls.push(r);
    }
  }
  window._skiTreeRange = TREE_RANGE; window._skiTreeMinY = TREE_MIN_Y; window._skiGateRange = GATE_RANGE;
  skiSceneReady = true;
}
/** Fait défiler un élément en boucle, sans jamais laisser sa position sortir par le haut. */
function skiWrapY(baseY, traveled, range, minY) {
  let y = (baseY - traveled - minY) % range;
  if (y < 0) y += range;
  return y + minY;
}
function skiTriangleWave(x) {
  const p = ((x % 1) + 1) % 1;
  return p < 0.5 ? (4 * p - 1) : (3 - 4 * p);
}
function renderSkiPlaying(snap) {
  const distEl = document.getElementById('skiDist');
  const timeEl = document.getElementById('skiTime');
  const cursorEl = document.getElementById('skiCursor');
  const speedEl = document.getElementById('skiSpeed');
  const skier = document.getElementById('skiSkier');
  const banner = document.getElementById('skiFinishBanner');
  const gatesEl = document.getElementById('skiGates');
  if (!skiSceneReady || !skier) return;

  if (distEl) distEl.textContent = snap.finished ? "zone d'arrivée" : `${Math.round(snap.distLeft)} m`;
  if (timeEl) {
    const secs = snap.elapsedMs / 1000;
    timeEl.textContent = `${Math.floor(secs / 60)}:${(secs % 60).toFixed(1).padStart(4, '0')}`;
  }
  if (speedEl) speedEl.textContent = snap.speedKmh;
  if (cursorEl) {
    const quality = (snap.speedKmh - 10) / 60;
    cursorEl.style.left = Math.max(2, Math.min(96, 50 + (quality - 0.5) * 90)) + '%';
  }
  if (banner) banner.style.opacity = snap.finished ? 1 : 0;
  if (gatesEl) gatesEl.style.opacity = 1;

  // Trajectoire automatique à travers les portes (pas la position réelle du capteur) —
  // seule la vitesse dépend du vrai mouvement. L'orientation bascule exactement quand
  // la trajectoire change de sens (donc juste après chaque porte), pas en cours de route.
  const quality = Math.max(0, Math.min(1, (snap.speedKmh - 10) / 60));
  const traveled = snap.traveled * 0.6; // échelle visuelle (m réels -> unités svg)
  const cyclePos = traveled / (SKI_GATE_SPACING * 2);
  const swing = skiTriangleWave(cyclePos - 0.15); // léger délai : la porte est déjà un peu "au-dessus" quand il tourne
  const swingAmp = 8 + quality * ((SKI_GATE_OFFSET + 25) - 8); // très étroit à l'arrêt, très large à pleine vitesse
  const skierX = !snap.finished ? 150 + swing * swingAmp : 150 + Math.sin(Date.now() * 0.005) * 4;
  const swingDelta = swing - (window._skiLastSwing ?? swing);
  window._skiLastSwing = swing;
  if (Math.abs(swingDelta) > 0.0001) window._skiFacingRight = swingDelta > 0;
  const facingRight = !!window._skiFacingRight;
  skier.setAttribute('transform', `translate(${skierX},${SKI_SKIER_Y}) scale(${facingRight ? 1 : -1},1)`);

  const progress = (snap.totalDist - snap.distLeft) / snap.totalDist;
  const travelNeeded = SKI_FINISH_BASE_Y - SKI_SKIER_Y;
  const finishFrontY = Math.max(SKI_SKIER_Y, SKI_FINISH_BASE_Y - progress * travelNeeded);

  // Sécurité : tout élément qui calculerait une position hors de la neige (0-200) est masqué,
  // plutôt que de compter uniquement sur le découpage du cadre SVG. Une porte disparaît
  // aussi dès que la ligne d'arrivée l'a rattrapée/dépassée (plutôt que toutes en même temps).
  (window._skiGateEls || []).forEach(({ el, x }) => {
    const baseY = parseFloat(el.dataset.baseY);
    const y = skiWrapY(baseY, traveled, window._skiGateRange, 10);
    el.setAttribute('transform', `translate(${x},${y})`);
    const inBounds = y >= 0 && y <= 176;
    const pastFinish = y >= finishFrontY;
    el.style.display = (inBounds && !pastFinish) ? '' : 'none';
  });
  document.getElementById('skiTrees')?.querySelectorAll('text').forEach((el) => {
    const baseY = parseFloat(el.dataset.baseY);
    const y = skiWrapY(baseY, traveled, window._skiTreeRange, window._skiTreeMinY);
    el.setAttribute('y', y);
    el.style.display = (y >= 0 && y <= 195) ? '' : 'none';
  });

  (window._skiFinishEls || []).forEach((el) => {
    const baseY = parseFloat(el.dataset.baseY);
    const y = Math.max(SKI_SKIER_Y, baseY - progress * travelNeeded);
    el.setAttribute('y', y);
  });
}

    </div>
  </div>
  `;

function eauSpawnDrop(x, y) {
  const svg = document.getElementById('eauScene');
  const drops = document.getElementById('eauDrops');
  if (!svg || !drops) return;
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 5); c.setAttribute('fill', '#2f80ed');
  drops.appendChild(c);
  let t = 0;
  const dx = (Math.random() - 0.5) * 50, dy = -25 - Math.random() * 18;
  const iv = setInterval(() => {
    t++;
    c.setAttribute('cx', x + dx * t / 20);
    c.setAttribute('cy', y + dy * t / 20 + t * t * 0.18);
    c.setAttribute('opacity', 1 - t / 20);
    if (t >= 20) { clearInterval(iv); c.remove(); }
  }, 16);
}

let eauScaredUntil = 0;
function renderEauPlaying(snap) {
  const heartsEl = document.getElementById('eauHearts');
  const timerEl = document.getElementById('eauTimer');
  setHeartsIfChanged(heartsEl, snap.livesRemaining, eauSetupCfg.lives);
  if (timerEl) {
    const m = Math.floor(Math.max(0, snap.timeLeft) / 60), s = Math.max(0, snap.timeLeft) % 60;
    timerEl.textContent = `${m}:${String(s).padStart(2, '0')}`;
  }
  const water = document.getElementById('eauWater');
  if (!water) return;
  const amp = Math.max(-12, Math.min(12, snap.wave));
  const t = Math.max(-9, Math.min(9, snap.tilt));
  const baseY = 158;
  const leftY = baseY + t + amp, rightY = baseY - t + amp;
  water.setAttribute('d', `M200 ${leftY.toFixed(1)} L250 ${rightY.toFixed(1)} L250 220 L200 220 Z`);

  if (snap.justSpilled) {
    eauSpawnDrop(225 + (Math.random() - 0.5) * 30, 155);
    eauScaredUntil = performance.now() + 500;
    document.getElementById('eauFaceCalm')?.setAttribute('opacity', 0);
    document.getElementById('eauFaceScared')?.setAttribute('opacity', 1);
  }
  if (performance.now() > eauScaredUntil) {
    document.getElementById('eauFaceCalm')?.setAttribute('opacity', 1);
    document.getElementById('eauFaceScared')?.setAttribute('opacity', 0);
  }
}

let electroSparkInterval = null;
function electroSpawnSpark(x, y) {
  const spark = document.getElementById('electroSpark');
  if (!spark) return;
  const hint = document.getElementById('electroHint');
  if (hint) hint.textContent = 'Figé ! Une vie perdue — reprends dès que ça repart.';

  function drawBurst() {
    let html = '';
    const nLines = 14;
    for (let i = 0; i < nLines; i++) {
      const ang = (Math.PI * 2 * i) / nLines + (Math.random() - 0.5) * 0.4;
      const len = 30 + Math.random() * 25;
      html += `<line x1="${x}" y1="${y}" x2="${x + Math.cos(ang) * len}" y2="${y + Math.sin(ang) * len}" stroke="#e0a83e" stroke-width="4" stroke-linecap="round"/>`;
    }
    spark.innerHTML = html;
  }

  clearInterval(electroSparkInterval);
  drawBurst();
  spark.setAttribute('opacity', 1);
  electroSparkInterval = setInterval(drawBurst, 130); // scintillement pendant tout le freeze

  setTimeout(() => {
    clearInterval(electroSparkInterval);
    spark.setAttribute('opacity', 0);
    if (hint) hint.textContent = 'Fais glisser le doigt le long du fil, du vert au orange.';
  }, 2000);
}

function wireElectroPlaying() {
  const svg = document.getElementById('electroScene');
  if (!svg) return;
  function toSvgCoords(clientX, clientY) {
    const r = svg.getBoundingClientRect();
    return { x: (clientX - r.left) / r.width * 300, y: (clientY - r.top) / r.height * 500 };
  }
  function move(clientX, clientY) {
    const { x, y } = toSvgCoords(clientX, clientY);
    ElectroGame.handleTouch(x, y);
  }
  svg.addEventListener('mousedown', (e) => move(e.clientX, e.clientY));
  svg.addEventListener('mousemove', (e) => { if (e.buttons === 1) move(e.clientX, e.clientY); });
  svg.addEventListener('touchstart', (e) => { move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  svg.addEventListener('touchmove', (e) => { move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
}

function renderElectroPlaying(snap) {
  const heartsEl = document.getElementById('electroHearts');
  const timerEl = document.getElementById('electroTimer');
  setHeartsIfChanged(heartsEl, snap.livesRemaining, electroSetupCfg.lives);
  if (timerEl) {
    const s = snap.elapsedMs / 1000;
    timerEl.textContent = `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
  }
  const dim = document.getElementById('electroDim');
  const done = document.getElementById('electroDone');
  const finger = document.getElementById('electroFinger');
  const startRing = document.getElementById('electroStartRing');
  const endRing = document.getElementById('electroEndRing');
  if (!dim || !snap.pts) return;
  const xAt = (i) => snap.pts[i].baseX + snap.wobbleX;
  let dFull = `M${xAt(0)} ${snap.pts[0].y}`;
  for (let i = 1; i < snap.pts.length; i++) dFull += ` L${xAt(i)} ${snap.pts[i].y}`;
  dim.setAttribute('d', dFull);
  let dDone = `M${xAt(0)} ${snap.pts[0].y}`;
  for (let i = 1; i <= snap.progressIdx; i++) dDone += ` L${xAt(i)} ${snap.pts[i].y}`;
  done.setAttribute('d', dDone);
  startRing.setAttribute('cx', xAt(0)); startRing.setAttribute('cy', snap.pts[0].y);
  endRing.setAttribute('cx', xAt(snap.pts.length - 1)); endRing.setAttribute('cy', snap.pts[snap.pts.length - 1].y);
  finger.setAttribute('cx', xAt(snap.progressIdx)); finger.setAttribute('cy', snap.pts[snap.progressIdx].y);
}

function renderFootballPlaying(snap) {
  const area = document.getElementById('footballPhaseArea');
  if (!area) return;

    footballLastPhase = snap.phase;
    if (snap.phase === 'run') area.innerHTML = footballRunHTML();

    else if (snap.phase === 'shoot') { area.innerHTML = footballShootHTML(); wireFootballShoot(); }
    if (window.lucide) lucide.createIcons();
  }

  const calmEl = document.getElementById('footballPandaCalm');
  const scaredEl = document.getElementById('footballPandaScared');

  if (snap.phase === 'run') {
    const timerEl = document.getElementById('fbRunTimer');
    const upEl = document.getElementById('fbUpCount');
    const runner = document.getElementById('fbRunner');
    const distantGoal = document.getElementById('fbDistantGoal');
    const marker = document.getElementById('fbVGaugeMarker');

    if (runner) runner.style.transform = snap.pose === 'up' ? 'translateY(-14px) rotate(-6deg)' : 'translateY(0) rotate(6deg)';
    if (distantGoal) {
      const scale = 0.5 + (1 - snap.runTimeLeft / 10) * 1.3;
      distantGoal.style.transform = `scale(${scale.toFixed(2)})`;
    }
    if (marker) marker.style.top = `${50 - Math.max(-40, Math.min(40, (snap.pose === 'up' ? 30 : -30)))}%`;
    calmEl?.classList.add('active'); scaredEl?.classList.remove('active');

    const target = document.getElementById('fbTarget');
    if (goalsEl) goalsEl.textContent = `${snap.goals} but${snap.goals > 1 ? 's' : ''}`;

      target.style.top = `${50 + snap.targetY}%`;
      target.className = 'football-target' + (snap.roundResult === 'hit' ? ' hit' : snap.roundResult === 'miss' ? ' miss' : '');
    }
    if (snap.roundResult === 'hit' && footballHappyUntil < performance.now()) footballHappyUntil = performance.now() + 500;
    if (snap.frozen && snap.roundResult === 'hit') { calmEl?.classList.add('active'); calmEl?.classList.add('happy-bounce'); scaredEl?.classList.remove('active'); }
    else if (snap.frozen && snap.roundResult === 'miss') { scaredEl?.classList.add('active'); calmEl?.classList.remove('active'); calmEl?.classList.remove('happy-bounce'); }
    else { calmEl?.classList.add('active'); calmEl?.classList.remove('happy-bounce'); scaredEl?.classList.remove('active'); }
  }

    <div class="card">
      <h2>${t('index_code_title')}</h2>
      <p class="page-sub" style="margin-bottom:10px;">${t('index_code_sub')}</p>
      <div class="row" style="gap:8px;">
        <input id="employeeCodeInput" placeholder="${t('index_code_placeholder')}" style="flex:1;padding:13px 14px;border-radius:12px;border:none;background:var(--panel-hi);color:var(--text);font-size:14px;text-transform:uppercase;">
        <button class="btn-ghost" id="btnCheckCode" style="width:auto;">${t('index_code_validate')}</button>
      </div>
      <p id="employeeCodeMsg" class="page-sub" style="margin:8px 0 0;"></p>
    </div>
    <button class="btn-primary" id="btnIndexStart" style="width:100%;">${t('index_start_btn')}</button>
  </div>
  `;
}
function wireIndexIntro() {
  document.getElementById('btnIndexStart')?.addEventListener('click', () => indexPrepareStatic());
  document.getElementById('btnIndexBackTop')?.addEventListener('click', () => navigate('home'));
  document.getElementById('btnCheckCode')?.addEventListener('click', async () => {
    const code = document.getElementById('employeeCodeInput').value.trim();
    const msg = document.getElementById('employeeCodeMsg');
    if (!code) return;
    msg.textContent = 'Recherche...';
    const emp = await PandaFitBackend.findEmployeeByCode(clientConfig, code);
    if (emp) {
      currentEmployee = emp;
      msg.textContent = `✓ Bienvenue${emp.first_name ? ' ' + emp.first_name : ''} ! Ce test s'ajoutera à ton historique.`;
      msg.style.color = 'var(--primary)';
    } else {
      msg.textContent = "Code introuvable — vérifie l'orthographe, ou continue sans.";
      msg.style.color = '#ff8a97';
    }
  });
}

function indexPrepareStatic() {
  let remaining = 3;
  content.innerHTML = screenGenericPrepare(remaining, 'circle-dot', "Test 1 : reste centré, ça démarre dans...");
  const timer = setInterval(() => {
    remaining--;
    const el = document.getElementById('genericPrepareNum');
    if (remaining <= 0) { clearInterval(timer); SoundFx.go(); runStaticTest(); }
    else if (el) el.textContent = remaining;
  }, 1000);
}
function screenIndexStaticPlaying() {
  return `
    <h1 class="page-title">Test 1/2 — Équilibre statique</h1>
    <div class="zone-hud">
      <div class="hearts" id="idxStaticHearts"></div>
      <div class="timer" id="idxStaticTimer">20s</div>
    </div>
    <div class="index-canvas-wrap"><canvas id="indexCanvas" width="300" height="300"></canvas></div>
    <p class="page-sub" style="text-align:center;">Reste bien centré, sans forcer.</p>
  `;
}
function runStaticTest() {
  content.innerHTML = screenIndexStaticPlaying();
  IndexTest.startStaticTest(
    (snap) => {
      const hearts = document.getElementById('idxStaticHearts');
      const timer = document.getElementById('idxStaticTimer');
      if (hearts) hearts.innerHTML = heartsHTML(Math.max(0, IndexTest.STATIC_LIVES - snap.livesLost), IndexTest.STATIC_LIVES);
      if (timer) timer.textContent = `${Math.max(0, Math.round(IndexTest.STATIC_DURATION_S - snap.elapsed))}s`;
      const canvas = document.getElementById('indexCanvas');
      if (canvas) {
        const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2, pxPerCm = 26;
        ctx.clearRect(0, 0, w, h);
        ctx.beginPath(); ctx.arc(cx, cy, snap.radius * pxPerCm, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(67,206,162,0.15)'; ctx.fill();
        ctx.strokeStyle = '#43cea2'; ctx.lineWidth = 2; ctx.stroke();
        ctx.beginPath(); ctx.arc(cx + snap.x * pxPerCm, cy - snap.y * pxPerCm, 9, 0, Math.PI * 2);
        ctx.fillStyle = '#c86dd7'; ctx.fill();
      }
    },
    (staticResult) => { indexStaticResult = staticResult; indexPrepareMovement(); }
  );
}
let indexStaticResult = null;

function indexPrepareMovement() {
  let remaining = 3;
  content.innerHTML = `
    <div class="connect-hero">
      <div class="icon"><i data-lucide="check-circle"></i></div>
      <h2>Test 1 terminé</h2>
      <p>Passons au test 2 : mouvement haut/bas, ça démarre dans...</p>
      <div style="font-size:64px;font-weight:800;" id="genericPrepareNum">${remaining}</div>
    </div>
  `;
  const timer = setInterval(() => {
    remaining--;
    const el = document.getElementById('genericPrepareNum');
    if (remaining <= 0) { clearInterval(timer); SoundFx.go(); runMovementTest(); }
    else if (el) el.textContent = remaining;
  }, 1000);
}
function screenIndexMovementPlaying() {
  return `
    <h1 class="page-title">Test 2/2 — Équilibre en mouvement</h1>
    <div class="zone-hud">
      <div class="timer" id="idxMovePoints">0 pts</div>
      <div class="timer" id="idxMoveTimer">20s</div>
    </div>
    <div class="index-canvas-wrap"><canvas id="indexCanvas" width="300" height="300"></canvas></div>
    <p class="page-sub" style="text-align:center;">Franchis les deux lignes en haut/bas, garde un rythme régulier.</p>
  `;
}
function runMovementTest() {
  content.innerHTML = screenIndexMovementPlaying();
  IndexTest.startMovementTest(
    (snap) => {
      const pts = document.getElementById('idxMovePoints');
      const timer = document.getElementById('idxMoveTimer');
      if (pts) pts.textContent = `${snap.points} pts`;
      if (timer) timer.textContent = `${Math.max(0, Math.round(IndexTest.MOVE_DURATION_S - snap.elapsed))}s`;
      const canvas = document.getElementById('indexCanvas');
      if (canvas) {
        const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2, pxPerCm = 22;
        ctx.clearRect(0, 0, w, h);
        const lineY1 = cy - IndexTest.MOVE_LINE_CM * pxPerCm, lineY2 = cy + IndexTest.MOVE_LINE_CM * pxPerCm;
        ctx.strokeStyle = '#0a3d91'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(0, lineY1); ctx.lineTo(w, lineY1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, lineY2); ctx.lineTo(w, lineY2); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy - snap.y * pxPerCm, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#c86dd7'; ctx.fill();
      }
    },
    (movementResult) => {
      const overall = IndexTest.computeOverallIndex(indexStaticResult.score, movementResult.score);
      finishIndexTest(overall, indexStaticResult, movementResult);
    }
  );
}
async function finishIndexTest(overall, staticResult, movementResult) {
  if (!currentEmployee) {
    currentEmployee = await PandaFitBackend.createEmployee(clientConfig);
  }
  PandaFitBackend.recordSession(clientConfig, 'indextest', overall, {
    staticScore: staticResult.score, movementScore: movementResult.score,
    rmsCm: staticResult.rmsCm, amplitudeCm: movementResult.amplitudeCm,
    regularityScore: movementResult.regularityScore, cycles: movementResult.cycles,
  }, currentEmployee?.id).then(submitPendingAnswersIfAny);
  content.innerHTML = screenIndexResult(overall, staticResult, movementResult);
  wireIndexResult();
}
function screenIndexResult(overall, staticResult, movementResult) {
  return `
    <div class="centered-page">
    <h1 class="page-title">${t('index_result_title')}</h1>
    <div class="index-score-big"><div class="num">${overall}</div><div class="lbl">/ 100</div></div>
    <div class="index-breakdown">
      <div><div class="n">${staticResult.score}</div><div class="l">Équilibre statique</div></div>
      <div><div class="n">${movementResult.score}</div><div class="l">Mouvement</div></div>
    </div>
    <div class="card" style="margin-top:16px;">
      <h2>Détails</h2>
      <div class="result-stat"><span>Oscillation moyenne (statique)</span><span>${staticResult.rmsCm} cm</span></div>
      <div class="result-stat"><span>Régularité du mouvement</span><span>${movementResult.regularityScore}/100</span></div>
      <div class="result-stat"><span>Amplitude du mouvement</span><span>${movementResult.amplitudeCm} cm</span></div>
    </div>
    ${currentEmployee ? `
      <div class="card" style="margin-top:16px;text-align:center;">
        <h2>Garde ton PandaFit Index</h2>
        <p class="page-sub">Scanne ce code avec l'appareil photo de <b>ton téléphone</b> pour voir ton historique et le retrouver la prochaine fois.</p>
        <canvas id="employeeQrCanvas" style="margin:0 auto;display:block;"></canvas>
        <p id="employeeQrFallback" class="page-sub" style="display:none;word-break:break-all;"></p>
        <p class="page-sub" style="margin-top:10px;">Ton code personnel : <b>${currentEmployee.claim_token}</b></p>
      </div>
    ` : ''}
    <div class="row" style="margin-top:14px;">
      <button class="btn-primary" id="btnIndexReplay">${t('index_replay')}</button>
      <button class="btn-ghost" id="btnIndexHome">${t('back_home')}</button>
    </div>
  </div>
  `;
}
function wireIndexResult() {
  document.getElementById('btnIndexReplay')?.addEventListener('click', () => launchIndexWithQuestionnaire());
  document.getElementById('btnIndexHome')?.addEventListener('click', () => { currentEmployee = null; navigate('home'); });
  const canvas = document.getElementById('employeeQrCanvas');
  if (canvas && currentEmployee) {
    const url = `${location.origin}/mon-index.html?token=${currentEmployee.claim_token}`;
    if (window.QRCode) {
      QRCode.toCanvas(canvas, url, { width: 180, margin: 1, color: { dark: '#1c162e', light: '#ffffff' } }, (err) => {
        if (err) {
          canvas.style.display = 'none';
          const fb = document.getElementById('employeeQrFallback');
          if (fb) { fb.style.display = 'block'; fb.innerHTML = `Le QR n'a pas pu se charger — ouvre ce lien depuis ton téléphone : <br><b>${url}</b>`; }
        }
      });
    } else {
      canvas.style.display = 'none';
      const fb = document.getElementById('employeeQrFallback');
      if (fb) { fb.style.display = 'block'; fb.innerHTML = `Le QR n'a pas pu se charger — ouvre ce lien depuis ton téléphone : <br><b>${url}</b>`; }
    }
  }
}

/* ---------- Écran : configuration de la tablette (une seule fois) ---------- */
function screenDeviceSetup(errorMsg) {
  return `
    <div class="connect-hero">
      <div class="icon"><i data-lucide="key"></i></div>
      <h2>Configuration de la tablette</h2>
      <p>Cette tablette n'est pas encore reliée à un client PandaFit. Entre la clé fournie par le superadmin (une seule fois).</p>
      <input id="deviceKeyInput" placeholder="ex: DEV-TEST-0001" style="width:100%;padding:14px;border-radius:12px;border:none;background:var(--panel-hi);color:var(--text);font-size:15px;margin-bottom:12px;box-sizing:border-box;">
      ${errorMsg ? `<p style="color:#ff8a97;font-size:13px;margin-bottom:12px;">${errorMsg}</p>` : ''}
      <button class="btn-primary" id="btnSaveDeviceKey" style="width:100%">Valider</button>
    </div>
  `;
}
function wireDeviceSetup() {
  document.getElementById('btnSaveDeviceKey')?.addEventListener('click', async () => {
    const val = document.getElementById('deviceKeyInput').value.trim();
    if (!val) return;
    try {
      clientConfig = await PandaFitBackend.fetchClientConfig(val);
      PandaFitBackend.setDeviceKey(val);
      log(`Tablette reliée au client "${clientConfig.clientName}".`);
      gamesCatalog = await PandaFitBackend.fetchGamesCatalog(); await refreshHighlights(); applyNavLockVisuals();
      render();
    } catch (e) {
      content.innerHTML = screenDeviceSetup(e.message);
      wireDeviceSetup();
    }
  });
}

/* ---------- Démarrage ---------- */
async function boot() {
  applyStaticI18n();
  log('Application PandaFit prête.');
document.getElementById('btnFullscreen')?.addEventListener('click', () => {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  }
});
  const savedKey = PandaFitBackend.getDeviceKey();
  if (!savedKey) {
    content.innerHTML = screenDeviceSetup();
    wireDeviceSetup();
    return;
  }
  try {
    clientConfig = await PandaFitBackend.fetchClientConfig(savedKey);
    log(`Tablette reliée au client "${clientConfig.clientName}".`);
    gamesCatalog = await PandaFitBackend.fetchGamesCatalog(); await refreshHighlights(); applyNavLockVisuals();
    // Reconnexion auto testée et non concluante sur ce matériel (le capteur nécessite un vrai scan actif,
    // que seul le sélecteur manuel déclenche) — désactivée pour ne pas perdre de temps à chaque démarrage.
    // La fonction PandaFitSensor.tryAutoReconnect() reste disponible si Chrome s'améliore un jour sur ce point.
    render();
  } catch (e) {
    log('Erreur de configuration : ' + e.message);
    content.innerHTML = screenDeviceSetup(e.message);
    wireDeviceSetup();
  }
}
boot();

</script>
</body>
</html>
