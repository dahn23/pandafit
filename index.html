const SKI_SKIER_Y = 130, SKI_GATE_OFFSET = 55, SKI_GATE_SPACING = 45, SKI_FINISH_BASE_Y = 900;
let skiSceneReady = false;
function wireSkiScene() {
  const treesEl = document.getElementById('skiTrees');
  const gatesEl = document.getElementById('skiGates');
  const finishEl = document.getElementById('skiFinish');
  treesEl.innerHTML = ''; gatesEl.innerHTML = ''; finishEl.innerHTML = '';
  gatesEl.style.opacity = 1;

  const TREE_RANGE = 8 * 35, TREE_MIN_Y = 22;
  for (let i = 0; i < 8; i++) {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', i % 2 === 0 ? 20 : 280);
    t.dataset.baseY = 220 - i * 35;
    t.setAttribute('y', t.dataset.baseY);
    t.setAttribute('font-size', '18');
    t.textContent = '🌲';
    treesEl.appendChild(t);
  }
  window._skiGateEls = [];
  const GATE_RANGE = 10 * SKI_GATE_SPACING;
  for (let i = 0; i < 10; i++) {
    const isLeft = i % 2 === 0;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    const color = isLeft ? '#e8112d' : '#0a3d91';
    const pole = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    pole.setAttribute('x1', 0); pole.setAttribute('x2', 0); pole.setAttribute('y1', 0); pole.setAttribute('y2', 24);
    pole.setAttribute('stroke', '#666'); pole.setAttribute('stroke-width', 2);
    const flag = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    flag.setAttribute('d', 'M0 0 L12 3 L0 7 Z'); flag.setAttribute('fill', color);
    g.appendChild(pole); g.appendChild(flag);
    const x = 150 + (isLeft ? -SKI_GATE_OFFSET : SKI_GATE_OFFSET);
    const baseY = 220 - i * SKI_GATE_SPACING;
    g.dataset.baseY = baseY;
    g.setAttribute('transform', `translate(${x},${baseY})`);
    gatesEl.appendChild(g);
    window._skiGateEls.push({ el: g, x });
  }
  const checkSize = 12;
  window._skiFinishEls = [];
  for (let col = 0; col < 26; col++) {
    for (let row = 0; row < 2; row++) {
      const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', col * checkSize); r.setAttribute('width', checkSize); r.setAttribute('height', checkSize);
      r.setAttribute('fill', (col + row) % 2 === 0 ? '#111' : '#fff');
      r.dataset.baseY = SKI_FINISH_BASE_Y + row * checkSize;
      r.setAttribute('y', r.dataset.baseY);
      finishEl.appendChild(r);
      window._skiFinishEls.push(r);
    }
  }
  window._skiTreeRange = TREE_RANGE; window._skiTreeMinY = TREE_MIN_Y; window._skiGateRange = GATE_RANGE;
  skiSceneReady = true;
}
/** Fait défiler un élément en boucle, sans jamais laisser sa position sortir par le haut. */
function skiWrapY(baseY, traveled, range, minY) {
  let y = (baseY - traveled - minY) % range;
  if (y < 0) y += range;
  return y + minY;
}
function skiTriangleWave(x) {
  const p = ((x % 1) + 1) % 1;
  return p < 0.5 ? (4 * p - 1) : (3 - 4 * p);
}
function renderSkiPlaying(snap) {
  const distEl = document.getElementById('skiDist');
  const timeEl = document.getElementById('skiTime');
  const cursorEl = document.getElementById('skiCursor');
  const speedEl = document.getElementById('skiSpeed');
  const skier = document.getElementById('skiSkier');
  const banner = document.getElementById('skiFinishBanner');
  const gatesEl = document.getElementById('skiGates');
  if (!skiSceneReady || !skier) return;

  if (distEl) distEl.textContent = snap.finished ? "zone d'arrivée" : `${Math.round(snap.distLeft)} m`;
  if (timeEl) {
    const secs = snap.elapsedMs / 1000;
    timeEl.textContent = `${Math.floor(secs / 60)}:${(secs % 60).toFixed(1).padStart(4, '0')}`;
  }
  if (speedEl) speedEl.textContent = snap.speedKmh;
  if (cursorEl) {
    const quality = (snap.speedKmh - 10) / 60;
    cursorEl.style.left = Math.max(2, Math.min(96, 50 + (quality - 0.5) * 90)) + '%';
  }
  if (banner) banner.style.opacity = snap.finished ? 1 : 0;
  if (gatesEl) gatesEl.style.opacity = snap.finished ? 0 : 1; // plus aucune porte dans la zone d'arrivée

  // Trajectoire automatique à travers les portes (pas la position réelle du capteur) —
  // seule la vitesse dépend du vrai mouvement. L'orientation bascule exactement quand
  // la trajectoire change de sens (donc juste après chaque porte), pas en cours de route.
  const traveled = snap.traveled * 0.6; // échelle visuelle (m réels -> unités svg)
  const cyclePos = traveled / (SKI_GATE_SPACING * 2);
  const swing = skiTriangleWave(cyclePos + 0.25);
  const swingAmp = SKI_GATE_OFFSET + 12;
  const skierX = !snap.finished ? 150 + swing * swingAmp : 150 + Math.sin(Date.now() * 0.005) * 4;
  const swingDelta = swing - (window._skiLastSwing ?? swing);
  window._skiLastSwing = swing;
  if (Math.abs(swingDelta) > 0.0001) window._skiFacingRight = swingDelta > 0;
  const facingRight = !!window._skiFacingRight;
  skier.setAttribute('transform', `translate(${skierX},${SKI_SKIER_Y}) scale(${facingRight ? -1 : 1},1)`);

  if (!snap.finished) {
    (window._skiGateEls || []).forEach(({ el, x }) => {
      const baseY = parseFloat(el.dataset.baseY);
      const y = skiWrapY(baseY, traveled, window._skiGateRange, 10);
      el.setAttribute('transform', `translate(${x},${y})`);
    });
  }
  document.getElementById('skiTrees')?.querySelectorAll('text').forEach((el) => {
    const baseY = parseFloat(el.dataset.baseY);
    const y = skiWrapY(baseY, traveled, window._skiTreeRange, window._skiTreeMinY);
    el.setAttribute('y', y);
  });

  const progress = (snap.totalDist - snap.distLeft) / snap.totalDist;
  const travelNeeded = SKI_FINISH_BASE_Y - SKI_SKIER_Y;
  (window._skiFinishEls || []).forEach((el) => {
    const baseY = parseFloat(el.dataset.baseY);
    const y = Math.max(SKI_SKIER_Y, baseY - progress * travelNeeded);
    el.setAttribute('y', y);
  });
}

  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 5); c.setAttribute('fill', '#2f80ed');
  drops.appendChild(c);
  let t = 0;
  const dx = (Math.random() - 0.5) * 50, dy = -25 - Math.random() * 18;
  const iv = setInterval(() => {
    t++;
    c.setAttribute('cx', x + dx * t / 20);
    c.setAttribute('cy', y + dy * t / 20 + t * t * 0.18);
    c.setAttribute('opacity', 1 - t / 20);
    if (t >= 20) { clearInterval(iv); c.remove(); }
  }, 16);
}

  const leftY = baseY + t + amp, rightY = baseY - t + amp;
  water.setAttribute('d', `M200 ${leftY.toFixed(1)} L250 ${rightY.toFixed(1)} L250 220 L200 220 Z`);

  if (snap.justSpilled) {
    eauSpawnDrop(225 + (Math.random() - 0.5) * 30, 155);

let electroSparkInterval = null;
function electroSpawnSpark(x, y) {
  const spark = document.getElementById('electroSpark');
  if (!spark) return;
  const hint = document.getElementById('electroHint');
  if (hint) hint.textContent = 'Figé ! Une vie perdue — reprends dès que ça repart.';

  function drawBurst() {
    let html = '';
    const nLines = 14;
    for (let i = 0; i < nLines; i++) {
      const ang = (Math.PI * 2 * i) / nLines + (Math.random() - 0.5) * 0.4;
      const len = 30 + Math.random() * 25;
      html += `<line x1="${x}" y1="${y}" x2="${x + Math.cos(ang) * len}" y2="${y + Math.sin(ang) * len}" stroke="#e0a83e" stroke-width="4" stroke-linecap="round"/>`;
    }
    spark.innerHTML = html;
  }

  clearInterval(electroSparkInterval);
  drawBurst();
  spark.setAttribute('opacity', 1);
  electroSparkInterval = setInterval(drawBurst, 130); // scintillement pendant tout le freeze

  setTimeout(() => {
    clearInterval(electroSparkInterval);
    spark.setAttribute('opacity', 0);
    if (hint) hint.textContent = 'Fais glisser le doigt le long du fil, du vert au orange.';
  }, 2000);
}

function wireElectroPlaying() {
  const svg = document.getElementById('electroScene');
  if (!svg) return;
  function toSvgCoords(clientX, clientY) {
    const r = svg.getBoundingClientRect();
    return { x: (clientX - r.left) / r.width * 300, y: (clientY - r.top) / r.height * 500 };
  }
  function move(clientX, clientY) {
    const { x, y } = toSvgCoords(clientX, clientY);
    ElectroGame.handleTouch(x, y);
  }
  svg.addEventListener('mousedown', (e) => move(e.clientX, e.clientY));
  svg.addEventListener('mousemove', (e) => { if (e.buttons === 1) move(e.clientX, e.clientY); });
  svg.addEventListener('touchstart', (e) => { move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  svg.addEventListener('touchmove', (e) => { move(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
}

function renderElectroPlaying(snap) {
  const heartsEl = document.getElementById('electroHearts');
  const timerEl = document.getElementById('electroTimer');
  setHeartsIfChanged(heartsEl, snap.livesRemaining, electroSetupCfg.lives);
  if (timerEl) {
    const s = snap.elapsedMs / 1000;
    timerEl.textContent = `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
  }
  const dim = document.getElementById('electroDim');
  const done = document.getElementById('electroDone');
  const finger = document.getElementById('electroFinger');
  const startRing = document.getElementById('electroStartRing');
  const endRing = document.getElementById('electroEndRing');
  if (!dim || !snap.pts) return;
  const xAt = (i) => snap.pts[i].baseX + snap.wobbleX;
  let dFull = `M${xAt(0)} ${snap.pts[0].y}`;
  for (let i = 1; i < snap.pts.length; i++) dFull += ` L${xAt(i)} ${snap.pts[i].y}`;
  dim.setAttribute('d', dFull);
  let dDone = `M${xAt(0)} ${snap.pts[0].y}`;
  for (let i = 1; i <= snap.progressIdx; i++) dDone += ` L${xAt(i)} ${snap.pts[i].y}`;
  done.setAttribute('d', dDone);
  startRing.setAttribute('cx', xAt(0)); startRing.setAttribute('cy', snap.pts[0].y);
  endRing.setAttribute('cx', xAt(snap.pts.length - 1)); endRing.setAttribute('cy', snap.pts[snap.pts.length - 1].y);
  finger.setAttribute('cx', xAt(snap.progressIdx)); finger.setAttribute('cy', snap.pts[snap.progressIdx].y);
}

  }
}

/* ---------- Écran : configuration de la tablette (une seule fois) ---------- */
function screenDeviceSetup(errorMsg) {
  return `
    <div class="connect-hero">
      <div class="icon"><i data-lucide="key"></i></div>
      <h2>Configuration de la tablette</h2>
      <p>Cette tablette n'est pas encore reliée à un client PandaFit. Entre la clé fournie par le superadmin (une seule fois).</p>
      <input id="deviceKeyInput" placeholder="ex: DEV-TEST-0001" style="width:100%;padding:14px;border-radius:12px;border:none;background:var(--panel-hi);color:var(--text);font-size:15px;margin-bottom:12px;box-sizing:border-box;">
      ${errorMsg ? `<p style="color:#ff8a97;font-size:13px;margin-bottom:12px;">${errorMsg}</p>` : ''}
      <button class="btn-primary" id="btnSaveDeviceKey" style="width:100%">Valider</button>
    </div>
  `;
}
function wireDeviceSetup() {
  document.getElementById('btnSaveDeviceKey')?.addEventListener('click', async () => {
    const val = document.getElementById('deviceKeyInput').value.trim();
    if (!val) return;
    try {
      clientConfig = await PandaFitBackend.fetchClientConfig(val);
      PandaFitBackend.setDeviceKey(val);
      log(`Tablette reliée au client "${clientConfig.clientName}".`);
      gamesCatalog = await PandaFitBackend.fetchGamesCatalog(); await refreshHighlights(); applyNavLockVisuals();
      render();
    } catch (e) {
      content.innerHTML = screenDeviceSetup(e.message);
      wireDeviceSetup();
    }
  });
}

/* ---------- Démarrage ---------- */
async function boot() {
  applyStaticI18n();
  log('Application PandaFit prête.');
document.getElementById('btnFullscreen')?.addEventListener('click', () => {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen)?.call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  }
});
  const savedKey = PandaFitBackend.getDeviceKey();
  if (!savedKey) {
    content.innerHTML = screenDeviceSetup();
    wireDeviceSetup();
    return;
  }
  try {
    clientConfig = await PandaFitBackend.fetchClientConfig(savedKey);
    log(`Tablette reliée au client "${clientConfig.clientName}".`);
    gamesCatalog = await PandaFitBackend.fetchGamesCatalog(); await refreshHighlights(); applyNavLockVisuals();
    // Reconnexion auto testée et non concluante sur ce matériel (le capteur nécessite un vrai scan actif,
    // que seul le sélecteur manuel déclenche) — désactivée pour ne pas perdre de temps à chaque démarrage.
    // La fonction PandaFitSensor.tryAutoReconnect() reste disponible si Chrome s'améliore un jour sur ce point.
    render();
  } catch (e) {
    log('Erreur de configuration : ' + e.message);
    content.innerHTML = screenDeviceSetup(e.message);
    wireDeviceSetup();
  }
}
boot();

</script>
