<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>PandaFit — Espace coach</title>
<link rel="icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #1c162e; --panel: #241d38; --panel-hi: #2c2444;
    --primary: #43cea2; --primary-dark: #185a9d;
    --accent: #c86dd7; --destructive: #e6374e; --warn: #f4b740;
    --text: #f4f2fa; --text-dim: #9992ad;
    --border: #35294f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 18px 16px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; }
  .brand img { width: 32px; height: 32px; border-radius: 8px; }
  .brand small { display: block; font-weight: 600; font-size: 11.5px; color: var(--text-dim); }
  h2 { font-size: 18px; margin: 18px 0 10px; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .mission { cursor: pointer; display: block; width: 100%; text-align: left; color: inherit; }
  .mission .when { font-size: 12.5px; color: var(--primary); font-weight: 700; text-transform: capitalize; }
  .mission .who { font-size: 16px; font-weight: 800; margin: 4px 0 2px; }
  .mission .what { font-size: 13px; color: var(--text-dim); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--panel-hi); color: var(--text-dim); margin-left: 6px; vertical-align: middle; }
  .badge.live { background: rgba(67,206,162,.18); color: var(--primary); }
  .badge.done { background: rgba(200,109,215,.16); color: var(--accent); }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--text-dim); flex: 0 0 38%; }
  .row .v { text-align: right; font-weight: 600; word-break: break-word; }
  .row .v a { color: var(--primary); text-decoration: none; }
  .code { font-size: 30px; font-weight: 800; letter-spacing: .08em; text-align: center; padding: 14px; border-radius: 12px; background: #17132a; border: 1px dashed var(--primary); color: var(--primary); }
  .hint { font-size: 12.5px; color: var(--text-dim); margin: 8px 0 0; line-height: 1.45; }
  .pre { white-space: pre-line; font-size: 14px; line-height: 1.5; }
  input, textarea, select { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--border); background: #17132a; color: var(--text); font-size: 15px; font-family: inherit; margin-bottom: 10px; }
  textarea { resize: vertical; min-height: 70px; }
  label.lbl { display: block; font-size: 12px; color: var(--text-dim); margin: 4px 0 4px; }
  button { font-family: inherit; border: none; cursor: pointer; border-radius: 10px; font-weight: 700; font-size: 15px; padding: 13px 18px; }
  .btn-primary { background: var(--primary); color: #0d2a22; width: 100%; }
  .btn-ghost { background: var(--panel-hi); color: var(--text); }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn-row > * { flex: 1; }
  .back { background: none; color: var(--text-dim); padding: 6px 0; font-size: 14px; }
  .mood { display: flex; gap: 6px; margin-bottom: 10px; }
  .mood button { flex: 1; background: var(--panel-hi); color: var(--text); font-size: 18px; padding: 10px 0; }
  .mood button.on { background: var(--primary); color: #0d2a22; }
  .toggle { display: flex; align-items: center; gap: 10px; font-size: 14px; margin: 4px 0 10px; }
  .toggle input { width: 22px; height: 22px; margin: 0; }
  .empty { color: var(--text-dim); font-size: 14px; text-align: center; padding: 18px 0; }
  .notice { background: rgba(244,183,64,.12); border: 1px solid rgba(244,183,64,.35); color: #ffd98a; border-radius: 12px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 12px; }
  .ok { background: rgba(67,206,162,.12); border: 1px solid rgba(67,206,162,.35); color: #9ff0d3; border-radius: 12px; padding: 12px 14px; font-size: 13.5px; margin-bottom: 12px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head b { text-transform: capitalize; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal .dow { font-size: 11px; color: var(--text-dim); text-align: center; font-weight: 700; }
  .cal button { padding: 0; aspect-ratio: 1; font-size: 14px; background: var(--panel-hi); color: var(--text); border-radius: 9px; }
  .cal button.on { background: var(--primary); color: #0d2a22; }
  .cal button.past { opacity: .35; }
  .cal button.mission-day { box-shadow: inset 0 0 0 2px var(--accent); }
  .total { display: flex; justify-content: space-between; font-weight: 800; font-size: 15px; padding-top: 10px; margin-top: 4px; border-top: 2px solid var(--text); }
  .langs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .langs label { display: flex; align-items: center; gap: 6px; background: var(--panel-hi); padding: 9px 12px; border-radius: 9px; font-size: 14px; }
  .langs input { width: 18px; height: 18px; margin: 0; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: #17132a; border-top: 1px solid var(--border); display: flex; padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { flex: 1; background: none; color: var(--text-dim); font-size: 12px; font-weight: 700; padding: 12px 0 14px; border-radius: 0; }
  nav.tabs button .ico { display: block; font-size: 19px; margin-bottom: 2px; }
  nav.tabs button.on { color: var(--primary); }
  .login { max-width: 420px; margin: 12vh auto 0; }
  /* Triathlon */
  .phases { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 4px 0 12px; }
  .phases button { background: var(--panel-hi); color: var(--text-dim); font-size: 12.5px; padding: 11px 4px; line-height: 1.25; }
  .phases button b { display: block; font-size: 15px; color: var(--text); }
  .phases button.on { background: var(--primary); color: #0d2a22; }
  .phases button.on b { color: #0d2a22; }
  .team-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .team-row .dot { flex: 0 0 14px; height: 14px; border-radius: 50%; }
  .team-row input { margin: 0; padding: 10px 12px; }
  table.tri { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 4px; }
  table.tri th { color: var(--text-dim); font-size: 11px; font-weight: 700; text-align: center; padding: 6px 2px; }
  table.tri td { padding: 8px 2px; border-top: 1px solid var(--border); text-align: center; }
  table.tri td:first-child, table.tri th:first-child { text-align: left; }
  table.tri td.tot { font-weight: 800; color: var(--primary); font-size: 15px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs" style="display:none"></nav>

<script>
const SUPABASE_URL = 'https://kabjpqvbukhhqvdjnkzr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_QgLSQJyPJ09Uj3vCKCUykA_ca1LTm5E';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');
const tabsEl = document.getElementById('tabs');

const OFFER_LABELS = {
  demo_vip: 'Démo VIP',
  decouverte: "Journée de l'équilibre – Découverte",
  team_building: "Journée de l'équilibre – Team building",
  mois_equilibre: "Mois de l'équilibre",
  campagne_annuelle: 'Campagne annuelle',
  abonnement: 'Abonnement (borne en libre-service)',
};
// Déroulé de référence par offre (cadre des offres) — rappel pour le coach
const OFFER_RUNBOOK = {
  demo_vip: "1 h pour quelques décideurs : accueil, démo, chacun passe son Index, échange sur leurs enjeux. Tenue VIP.",
  decouverte: "Arrivée 30 min avant : installer 2 pandas, entrer le code du projet sur les tablettes, puis démarrer la séance.\nPar groupe de ~20 toutes les 30 min : intro de 5-6 min (chutes, Suva, démo), puis 20 min de tests (2 pandas × 10).\nEn fin de matinée : clôturer la séance et remplir le compte-rendu.",
  team_building: "Arrivée 45 min avant avec le 2ᵉ coach : 3 pandas, projection du classement.\nAccueil et speech (15 min), Triathlon de l'équilibre (précision, mouvement, cerveau), finale et podium.\nRangement 30 min après, puis clôture et compte-rendu.",
  mois_equilibre: "Visite de lancement ou de clôture : Index de chacun avec le coach, installation ou reprise du panda à demeure, consignes de sécurité affichées.",
  campagne_annuelle: "Visite trimestrielle : Index de chacun, lancement des défis de la saison, vérification du panda à demeure.",
};
const AMBIANCE_LABELS = { securite: 'Sécurité / sobre', festive: 'Fun / festive' };
const LANG_LABELS = { fr: 'Français', de: 'Deutsch', it: 'Italiano', en: 'English' };
const STATUS_LABELS = { preparee: 'Préparée', en_cours: 'En cours', cloturee: 'Terminée' };

let me = null;
let missions = [];
let tab = 'missions';
let openMissionId = null;
let calMonth = startOfMonth(new Date());
let calDays = new Set();
let flash = null;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function ymd(d) { const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
function fmtDay(iso) { return new Date(iso).toLocaleDateString('fr-CH', { weekday: 'long', day: 'numeric', month: 'long' }); }
function fmtTime(iso) { return iso ? new Date(iso).toLocaleTimeString('fr-CH', { hour: '2-digit', minute: '2-digit' }) : '—'; }
function chf(n) { return Number(n || 0).toLocaleString('fr-CH').replace(/ |\s/g, "'") + ' CHF'; }
function isPast(m) { return new Date(m.ends_at) < new Date(Date.now() - 12 * 3600 * 1000) || m.status === 'cloturee'; }

/* ---------------- Connexion par lien magique ---------------- */
function renderLogin(msg, ok) {
  tabsEl.style.display = 'none';
  app.innerHTML = `
    <div class="login">
      <div class="brand" style="margin-bottom:18px;"><img src="/icon-192.png" alt=""><div>PandaFit<small>Espace coach</small></div></div>
      ${msg ? `<div class="${ok ? 'ok' : 'notice'}">${esc(msg)}</div>` : ''}
      <div class="card">
        <h3>Connexion</h3>
        <p class="hint" style="margin:0 0 12px;">Entre l'adresse e-mail que PandaFit a enregistrée pour toi. Tu reçois un lien de connexion, sans mot de passe.</p>
        <input id="email" type="email" autocomplete="email" placeholder="ton.email@exemple.ch">
        <button class="btn-primary" id="btnSend">Recevoir mon lien de connexion</button>
      </div>
    </div>`;
  document.getElementById('btnSend').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    if (!email) return;
    const btn = document.getElementById('btnSend');
    btn.disabled = true; btn.textContent = 'Envoi…';
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + '/coach/' } });
    if (error) renderLogin('Envoi impossible : ' + error.message);
    else renderLogin(`Lien envoyé à ${email}. Ouvre l'e-mail sur ce téléphone et touche le lien.`, true);
  });
}

let booting = false;
async function boot() {
  if (booting) return;
  booting = true;
  try { await bootInner(); } finally { booting = false; }
}
async function bootInner() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { renderLogin(); return; }
  const { data: role } = await sb.rpc('claim_invite');
  if (role !== 'coach') {
    await sb.auth.signOut();
    renderLogin(role ? "Ce compte n'est pas un compte coach : utilise la console admin (console.pandafit.ch)." : "Cette adresse n'a pas d'accès coach. Demande à PandaFit de t'inscrire.");
    return;
  }
  await loadAll();
  render();
}
sb.auth.onAuthStateChange((event) => { if (event === 'SIGNED_IN' && !me) boot(); });

async function loadAll() {
  const [{ data: profile }, { data: list }] = await Promise.all([sb.rpc('coach_me'), sb.rpc('coach_missions')]);
  me = profile;
  missions = list || [];
}

/* ---------------- Rendu ---------------- */
function render() {
  tabsEl.style.display = 'flex';
  const items = [['missions', '📋', 'Missions'], ['dispos', '📅', 'Dispos'], ['releve', '🧾', 'Relevé'], ['profil', '👤', 'Profil']];
  tabsEl.innerHTML = items.map(([k, ico, l]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}"><span class="ico">${ico}</span>${l}</button>`).join('');
  tabsEl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { tab = b.dataset.tab; openMissionId = null; flash = null; render(); window.scrollTo(0, 0); }));
  const head = `<div class="top"><div class="brand"><img src="/icon-192.png" alt=""><div>PandaFit<small>Espace coach · ${esc(me?.name || me?.email || '')}</small></div></div></div>`;
  const flashHtml = flash ? `<div class="ok">${esc(flash)}</div>` : '';
  if (tab === 'missions') app.innerHTML = head + flashHtml + (openMissionId ? missionDetailHTML() : missionsListHTML());
  if (tab === 'dispos') { app.innerHTML = head + flashHtml + `<div id="calBox"><p class="empty">Chargement…</p></div>`; renderCalendar(); }
  if (tab === 'releve') app.innerHTML = head + releveHTML();
  if (tab === 'profil') app.innerHTML = head + flashHtml + profilHTML();
  wire();
}

function missionCard(m) {
  const badge = m.status === 'en_cours' ? '<span class="badge live">En cours</span>' : m.status === 'cloturee' ? '<span class="badge done">Clôturée</span>' : '';
  return `
    <button class="card mission" data-open="${m.id}">
      <div class="when">${esc(fmtDay(m.starts_at))} · ${fmtTime(m.starts_at)}–${fmtTime(m.ends_at)}${badge}</div>
      <div class="who">${esc(m.client)}</div>
      <div class="what">${esc(OFFER_LABELS[m.offer] || m.offer)}${m.address ? ' · ' + esc(m.address) : ''}</div>
    </button>`;
}
function missionsListHTML() {
  const upcoming = missions.filter(m => !isPast(m));
  const past = missions.filter(m => isPast(m)).reverse();
  return `
    <h2>À venir</h2>
    ${upcoming.length ? upcoming.map(missionCard).join('') : '<p class="empty">Aucune mission prévue pour l\'instant.</p>'}
    ${past.length ? `<h2>Passées</h2>${past.slice(0, 20).map(missionCard).join('')}` : ''}`;
}

function missionDetailHTML() {
  const m = missions.find(x => x.id === openMissionId);
  if (!m) return '<p class="empty">Mission introuvable.</p>';
  const mapUrl = m.address ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(m.address) : null;
  const sameDay = ymd(new Date(m.starts_at)) <= ymd(new Date());
  const contact = m.contact_phone
    ? `${esc(m.contact_name || '')}<br><a href="tel:${esc(m.contact_phone.replace(/\s/g, ''))}">${esc(m.contact_phone)}</a>`
    : (m.contact_name ? esc(m.contact_name) + '<br><span class="hint">numéro masqué 7 jours après la séance</span>' : '—');
  return `
    <button class="back" data-back>← Mes missions</button>
    <div class="card">
      <div class="when" style="color:var(--primary);font-weight:700;font-size:13px;text-transform:capitalize;">${esc(fmtDay(m.starts_at))}</div>
      <h2 style="margin:4px 0 2px;">${esc(m.client)}</h2>
      <div class="hint" style="margin:0;">${esc(OFFER_LABELS[m.offer] || m.offer)}${m.title ? ' · ' + esc(m.title) : ''} · <b>${esc(STATUS_LABELS[m.status] || m.status)}</b></div>
    </div>
    <div class="card">
      <h3>Code du projet (tablettes)</h3>
      <div class="code">${esc(m.code || '—')}</div>
      ${m.pin ? `<div class="row"><span class="k">Code PIN des Réglages</span><span class="v"><b>${esc(m.pin)}</b></span></div>` : ''}
      <p class="hint">Allume la tablette : au parc, elle demande le code du projet. Entre-le sur chaque tablette (tu peux le faire la veille) ; le poste de chaque tablette est proposé tout seul.</p>
      ${m.code ? `<p class="hint">Classement à projeter sur l'écran : <a style="color:var(--primary);" href="https://app.pandafit.ch/projection.html?code=${encodeURIComponent(m.code)}" target="_blank" rel="noopener">app.pandafit.ch/projection.html?code=${esc(m.code)}</a></p>` : ''}
    </div>
    ${m.project_id ? `<div class="card" id="projBox"><h3>Séance et tablettes</h3><p class="empty">Chargement…</p></div>` : ''}
    <div class="card">
      <div class="row"><span class="k">Arrivée</span><span class="v">${fmtTime(m.arrival_at)}</span></div>
      <div class="row"><span class="k">Séance</span><span class="v">${fmtTime(m.starts_at)} – ${fmtTime(m.ends_at)}</span></div>
      <div class="row"><span class="k">Lieu</span><span class="v">${m.address ? `<a href="${mapUrl}" target="_blank" rel="noopener">${esc(m.address)}</a>` : '—'}</span></div>
      <div class="row"><span class="k">Contact sur place</span><span class="v">${contact}</span></div>
      <div class="row"><span class="k">Participants attendus</span><span class="v">${m.expected_participants || '—'}</span></div>
      <div class="row"><span class="k">Ambiance</span><span class="v">${esc(AMBIANCE_LABELS[m.ambiance] || m.ambiance)}</span></div>
      <div class="row"><span class="k">Langue</span><span class="v">${esc(LANG_LABELS[m.language] || m.language)}</span></div>
      ${m.games?.length ? `<div class="row"><span class="k">Jeux</span><span class="v">${esc(m.games.join(', '))}</span></div>` : ''}
      <div class="row"><span class="k">Coéquipier</span><span class="v">${m.teammates?.length ? esc(m.teammates.join(', ')) : 'Seul'}</span></div>
      <div class="row"><span class="k">Honoraires</span><span class="v">${chf(m.fee)}</span></div>
    </div>
    ${m.materials ? `<div class="card"><h3>Matériel à prendre</h3><div class="pre">${esc(m.materials)}</div></div>` : ''}
    ${m.notes ? `<div class="card"><h3>Infos du commercial</h3><div class="pre">${esc(m.notes)}</div></div>` : ''}
    <div class="card"><h3>Déroulé</h3><div class="pre">${esc(OFFER_RUNBOOK[m.offer] || '')}</div></div>
    ${m.offer === 'team_building' && m.status !== 'cloturee' ? `<div class="card" id="triBox"><h3>Triathlon de l'équilibre</h3><p class="empty">Chargement…</p></div>` : ''}
    ${!m.project_id && m.status === 'preparee' && sameDay ? `<button class="btn-primary" data-start="${m.id}">Démarrer la séance</button>` : ''}
    ${m.status !== 'cloturee' || !m.report_done ? reportFormHTML(m) : '<div class="ok">Séance clôturée, compte-rendu envoyé. Merci !</div>'}
  `;
}

function reportFormHTML(m) {
  if (!['en_cours', 'cloturee'].includes(m.status) && new Date(m.starts_at) > new Date()) return '';
  return `
    <div class="card" style="margin-top:12px;">
      <h3>Clôturer et envoyer le compte-rendu</h3>
      <label class="lbl">Nombre de participants</label>
      <input id="rParticipants" type="number" inputmode="numeric" min="0" placeholder="ex. 85">
      <label class="lbl">Ambiance</label>
      <div class="mood" id="rMood">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-mood="${n}">${['😕', '😐', '🙂', '😀', '🤩'][n - 1]}</button>`).join('')}</div>
      <div class="toggle"><input type="checkbox" id="rLead"><label for="rLead">Piste commerciale chaude (envie d'un Mois, d'une Campagne…)</label></div>
      <textarea id="rLeadComment" placeholder="Qui, quoi ? (facultatif)"></textarea>
      <label class="lbl">Problème de matériel</label>
      <input id="rMaterial" placeholder="Rien à signaler">
      <label class="lbl">Commentaire</label>
      <textarea id="rComment" placeholder="Ce qui a marché, ce qui est à améliorer (facultatif)"></textarea>
      <button class="btn-primary" data-close="${m.id}">Clôturer la séance</button>
    </div>`;
}

function releveHTML() {
  const done = missions.filter(m => isPast(m));
  if (!done.length) return '<h2>Relevé</h2><p class="empty">Pas encore de mission réalisée.</p>';
  const byMonth = {};
  done.forEach(m => { const k = m.starts_at.slice(0, 7); (byMonth[k] = byMonth[k] || []).push(m); });
  return '<h2>Relevé de mes missions</h2><p class="hint" style="margin-top:-4px;">Pour ta facture mensuelle à PandaFit SA.</p>' +
    Object.keys(byMonth).sort().reverse().map(k => {
      const list = byMonth[k].sort((a, b) => a.starts_at.localeCompare(b.starts_at));
      const label = new Date(k + '-01T12:00:00').toLocaleDateString('fr-CH', { month: 'long', year: 'numeric' });
      return `<div class="card"><h3 style="text-transform:capitalize;">${esc(label)}</h3>
        ${list.map(m => `<div class="row"><span class="k">${new Date(m.starts_at).toLocaleDateString('fr-CH')} · ${esc(m.client)}<br><span class="hint">${esc(OFFER_LABELS[m.offer] || m.offer)}</span></span><span class="v">${chf(m.fee)}<br><span class="hint">${m.paid_at ? 'payé le ' + new Date(m.paid_at).toLocaleDateString('fr-CH') : 'à payer'}</span></span></div>`).join('')}
        <div class="total"><span>Total</span><span>${chf(list.reduce((s, m) => s + Number(m.fee || 0), 0))}</span></div></div>`;
    }).join('');
}

/* ---------------- Disponibilités ---------------- */
async function renderCalendar() {
  const from = calMonth, to = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0);
  const { data } = await sb.rpc('coach_availability_get', { p_from: ymd(from), p_to: ymd(to) });
  calDays = new Set((data || []).map(String));
  drawCalendar();
}
function drawCalendar() {
  const box = document.getElementById('calBox');
  if (!box) return;
  const y = calMonth.getFullYear(), mo = calMonth.getMonth();
  const first = new Date(y, mo, 1), nDays = new Date(y, mo + 1, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  const today = ymd(new Date());
  const missionDays = new Set(missions.map(m => ymd(new Date(m.starts_at))));
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<span></span>';
  for (let d = 1; d <= nDays; d++) {
    const k = ymd(new Date(y, mo, d));
    cells += `<button data-day="${k}" class="${calDays.has(k) ? 'on' : ''} ${k < today ? 'past' : ''} ${missionDays.has(k) ? 'mission-day' : ''}" ${k < today ? 'disabled' : ''}>${d}</button>`;
  }
  box.innerHTML = `
    <h2>Mes disponibilités</h2>
    <p class="hint" style="margin-top:-4px;">Touche les jours où tu peux intervenir. Le contour violet = une mission déjà prévue.</p>
    <div class="card">
      <div class="cal-head"><button class="btn-ghost" data-cal="-1">‹</button><b>${first.toLocaleDateString('fr-CH', { month: 'long', year: 'numeric' })}</b><button class="btn-ghost" data-cal="1">›</button></div>
      <div class="cal">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<span class="dow">${x}</span>`).join('')}${cells}</div>
      <button class="btn-primary" id="btnSaveCal" style="margin-top:14px;">Enregistrer ce mois</button>
    </div>`;
  box.querySelectorAll('[data-day]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.day; calDays.has(k) ? calDays.delete(k) : calDays.add(k); b.classList.toggle('on');
  }));
  box.querySelectorAll('[data-cal]').forEach(b => b.addEventListener('click', () => {
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + Number(b.dataset.cal), 1); renderCalendar();
  }));
  document.getElementById('btnSaveCal').addEventListener('click', async () => {
    const to = new Date(y, mo + 1, 0);
    const { error } = await sb.rpc('coach_availability_set', { p_from: ymd(first), p_to: ymd(to), p_days: [...calDays] });
    flash = error ? null : 'Disponibilités enregistrées.';
    if (error) alert('Erreur : ' + error.message);
    render();
  });
}

/* ---------------- Triathlon de l'équilibre (Team building) ---------------- */
const GAME_NAMES = { base: 'Electro', skiprev: 'Slalom', tempo: 'MindFit', thezone: 'The Zone', distance: 'Tir au but', migros: 'Marché Express', cross: 'Zen' };
const TEAM_COLORS = [['Rouge', '#e5484d'], ['Bleue', '#3b82f6'], ['Verte', '#22c55e'], ['Jaune', '#eab308'], ['Orange', '#f97316'], ['Violette', '#8b5cf6'], ['Rose', '#ec4899'], ['Turquoise', '#14b8a6'], ['Marine', '#1e40af'], ['Grise', '#6b7280']];
const PHASES = [['qualif', '1', 'Index'], ['triathlon', '2', 'Triathlon'], ['finale', '3', 'Finale'], ['podium', '4', 'Podium']];
let tri = null, triEventId = null, triTimer = null;
function colorIdx(c) { const i = TEAM_COLORS.findIndex(([, x]) => x === c); return i < 0 ? 99 : i; } // ordre stable des équipes à l'édition

async function loadTriathlon(eventId) {
  triEventId = eventId;
  const { data, error } = await sb.rpc('event_triathlon_get', { p_event: eventId });
  if (error) { const b = document.getElementById('triBox'); if (b) b.innerHTML = `<h3>Triathlon de l'équilibre</h3><p class="notice">${esc(error.message)}</p>`; return; }
  tri = data;
  drawTriathlon();
}
function drawTriathlon() {
  const box = document.getElementById('triBox');
  const m = missions.find(x => x.id === triEventId);
  if (!box || !tri || !m) return;
  const games = tri.games || [];
  const teams = tri.teams || [];
  const suggested = Math.min(10, Math.max(2, Math.round((m.expected_participants || 30) / 5)));
  box.innerHTML = `
    <h3>Triathlon de l'équilibre</h3>
    <p class="hint" style="margin:0 0 10px;">Tu pilotes ici la phase affichée sur les tablettes et sur le grand écran.</p>
    <div class="phases">${PHASES.map(([k, n, l]) => `<button data-phase="${k}" class="${tri.phase === k ? 'on' : ''}"><b>${n}</b>${l}</button>`).join('')}</div>
    ${tri.phase === 'finale' || tri.phase === 'triathlon' ? `
      <label class="lbl">Jeu de la finale</label>
      <select id="triFinale">${games.map(g => `<option value="${g}" ${tri.finale_game === g ? 'selected' : ''}>${esc(GAME_NAMES[g] || g)}</option>`).join('')}</select>` : ''}
    <h3 style="margin-top:6px;">Équipes</h3>
    ${teams.length ? `
      ${teams.slice().sort((a, b) => colorIdx(a.color) - colorIdx(b.color)).map(t => `<div class="team-row"><span class="dot" style="background:${esc(t.color)}"></span><input data-team-name="${t.id}" data-color="${esc(t.color)}" value="${esc(t.name)}"></div>`).join('')}
      <div class="btn-row"><button class="btn-ghost" id="triSaveTeams">Enregistrer les noms</button><button class="btn-ghost" id="triAddTeam">+ Une équipe</button></div>
    ` : `
      <label class="lbl">Nombre d'équipes (5 personnes par équipe, idéalement)</label>
      <input id="triNbTeams" type="number" inputmode="numeric" min="2" max="10" value="${suggested}">
      <button class="btn-primary" id="triCreateTeams">Créer les équipes</button>
    `}
    <p class="hint">Postes des tablettes (carte « Séance et tablettes » ci-dessus) : 1 tablette <b>PandaFit Index</b> + 1 par station (${games.map(g => esc(GAME_NAMES[g] || g)).join(' / ')}). Chaque équipe répartit ses joueurs 2-2-1 sur les 3 jeux.</p>
    ${teams.length ? `
      <h3 style="margin-top:14px;">Classement <span class="hint" style="font-weight:500;">(points par jeu, mis à jour toutes les 10 s)</span></h3>
      <table class="tri"><thead><tr><th>Équipe</th>${games.map(g => `<th>${esc(GAME_NAMES[g] || g)}</th>`).join('')}<th>Finale</th><th>Total</th></tr></thead>
      <tbody>${teams.map(t => `<tr><td><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${esc(t.color)};margin-right:6px;"></span>${esc(t.name)}</td>
        ${games.map(g => { const x = t.games?.[g]; return `<td>${x ? `${x.points}<div class="hint" style="margin:0;font-size:10.5px;">${x.n} j.</div>` : '–'}</td>`; }).join('')}
        <td>${t.finale ? t.finale.points : '–'}</td><td class="tot">${t.total}</td></tr>`).join('')}</tbody></table>
      <p class="hint">Points par jeu : 1ʳᵉ équipe = ${teams.length} pts, 2ᵉ = ${teams.length - 1}… (moyenne des joueurs de l'équipe sur ce jeu). La finale compte double.</p>
    ` : ''}`;
  box.querySelectorAll('[data-phase]').forEach(b => b.addEventListener('click', async () => {
    const p = b.dataset.phase;
    if (p === tri.phase) return;
    if (p !== 'qualif' && !teams.length) { alert("Crée d'abord les équipes."); return; }
    const labels = { qualif: "revenir à l'Index (qualification)", triathlon: 'lancer le Triathlon', finale: 'lancer la finale', podium: 'afficher le podium' };
    if (!confirm(`Confirmer : ${labels[p]} ? Les tablettes et le grand écran changent dans les 10 secondes.`)) return;
    const fin = document.getElementById('triFinale')?.value || tri.finale_game || null;
    const { data, error } = await sb.rpc('event_set_phase', { p_event: triEventId, p_phase: p, p_finale_game: fin });
    if (error) return alert('Erreur : ' + error.message);
    tri = data; drawTriathlon();
  }));
  document.getElementById('triFinale')?.addEventListener('change', async (e) => {
    const { data, error } = await sb.rpc('event_set_phase', { p_event: triEventId, p_phase: tri.phase, p_finale_game: e.target.value });
    if (error) return alert('Erreur : ' + error.message);
    tri = data; drawTriathlon();
  });
  document.getElementById('triCreateTeams')?.addEventListener('click', async () => {
    const n = Math.min(10, Math.max(2, Number(document.getElementById('triNbTeams').value) || suggested));
    await saveTeams(TEAM_COLORS.slice(0, n).map(([name, color]) => ({ name: 'Équipe ' + name, color })));
  });
  const currentTeams = () => [...box.querySelectorAll('[data-team-name]')].map(i => ({ id: i.dataset.teamName, name: i.value, color: i.dataset.color }));
  document.getElementById('triSaveTeams')?.addEventListener('click', () => saveTeams(currentTeams(), 'Noms enregistrés.'));
  document.getElementById('triAddTeam')?.addEventListener('click', () => {
    const list = currentTeams();
    if (list.length >= 10) return alert('10 équipes au maximum.');
    const free = TEAM_COLORS.find(([, c]) => !list.some(t => t.color === c)) || TEAM_COLORS[list.length % TEAM_COLORS.length];
    saveTeams([...list, { name: 'Équipe ' + free[0], color: free[1] }]);
  });
}
async function saveTeams(list, msg) {
  const { data, error } = await sb.rpc('event_set_teams', { p_event: triEventId, p_teams: list });
  if (error) return alert('Erreur : ' + error.message);
  tri = data; drawTriathlon();
  if (msg) { const b = document.getElementById('triSaveTeams'); if (b) { b.textContent = '✓ ' + msg; setTimeout(() => { if (b.isConnected) b.textContent = 'Enregistrer les noms'; }, 2000); } }
}
function startTriathlonPolling(eventId) {
  clearInterval(triTimer);
  loadTriathlon(eventId);
  triTimer = setInterval(() => {
    // pas de rafraîchissement pendant que le coach tape un nom d'équipe
    if (!document.getElementById('triBox')) { clearInterval(triTimer); return; }
    if (document.activeElement?.matches?.('#triBox input, #triBox select')) return;
    loadTriathlon(eventId);
  }, 10000);
}

/* ---------------- Projet : séances (démarrer / terminer) + tablettes et leur poste ---------------- */
let proj = null, projTimer = null;
const POSTE_LABELS = { index: 'PandaFit Index', jeux: 'Jeux libres', base: 'Station Electro', skiprev: 'Station Slalom', tempo: 'Station MindFit', thezone: 'Station The Zone', distance: 'Station Tir au but' };
async function loadProject(projectId) {
  const { data, error } = await sb.rpc('coach_project', { p_project: projectId });
  if (error) { const b = document.getElementById('projBox'); if (b) b.innerHTML = `<h3>Séance et tablettes</h3><p class="empty">${esc(error.message)}</p>`; return; }
  proj = data; drawProject();
}
function drawProject() {
  const box = document.getElementById('projBox');
  if (!box || !proj) return;
  const live = proj.events.find(e => e.status === 'en_cours');
  const next = proj.events.find(e => e.status === 'preparee');
  const stepName = e => e.campaign_step === 't0' ? 'Lancement' : e.campaign_step === 't1' ? 'Clôture' : (e.title || OFFER_LABELS[e.offer] || 'Séance');
  const postes = ['index', 'jeux', ...(proj.offer === 'team_building' ? (proj.triathlon_games || ['base', 'skiprev', 'tempo']) : [])];
  box.innerHTML = `
    <h3>Séance et tablettes</h3>
    ${!proj.open ? '<p class="hint">Projet terminé : les tablettes sont retournées au parc.</p>' : ''}
    ${proj.events.map(e => `<div class="row"><span class="k">${esc(new Date(e.starts_at).toLocaleDateString('fr-CH'))} · ${esc(stepName(e))}${e.id === openMissionId ? ' <span class="hint">(cette mission)</span>' : ''}</span>
      <span class="v">${e.status === 'en_cours' ? '<span class="badge live">En cours</span>' : esc(STATUS_LABELS[e.status] || e.status)}</span></div>`).join('')}
    ${live ? liveProgressHTML(live, stepName) : ''}
    ${live && live.mine ? `<button class="${liveAllDone() ? 'btn-primary' : 'btn-ghost'}" data-pend="${live.id}" style="width:100%;margin-top:10px;">■ Terminer la séance (${esc(stepName(live))})</button>` : ''}
    ${!live ? afterStepHTML(next, stepName) : ''}
    ${!live && next && next.mine && proj.open ? `<button class="btn-primary" data-pstart="${next.id}" style="margin-top:10px;">▶ Démarrer la séance (${esc(stepName(next))})</button>
      <p class="hint">Les dates sont indicatives : tu démarres quand tu es prêt. Toutes les tablettes du projet passent en mode séance en quelques secondes.</p>` : ''}
    <h3 style="margin-top:16px;">Tablettes du projet</h3>
    ${proj.devices.length ? proj.devices.map(d => `<div class="row"><span class="k">${esc(d.name)}<br><span class="hint">${d.online ? '<span style="color:#2ec27e;">● en ligne</span>' : 'hors ligne'}</span></span>
      <span class="v"><select data-poste="${d.id}" style="max-width:190px;">${postes.map(p => `<option value="${p}" ${d.poste === p ? 'selected' : ''}>${esc(POSTE_LABELS[p] || p)}</option>`).join('')}</select>
      <br><button class="btn-ghost" data-premove="${d.id}" style="margin-top:4px;padding:4px 10px;font-size:12px;">Retirer</button></span></div>`).join('')
      : '<p class="hint">Aucune tablette pour l\'instant : entre le code du projet sur chaque tablette.</p>'}`;
  box.querySelector('[data-pstart]')?.addEventListener('click', async (ev) => {
    if (!confirm('Démarrer la séance ? Toutes les tablettes du projet passent en mode séance.')) return;
    const { error } = await sb.rpc('coach_start', { p_event: ev.currentTarget.dataset.pstart });
    if (error) return alert('Erreur : ' + error.message);
    await loadAll(); flash = 'Séance démarrée. Bonne animation !'; render();
  });
  box.querySelector('[data-pend]')?.addEventListener('click', async (ev) => {
    if (!confirm('Terminer la séance ? Les tablettes quittent le mode séance. (Tu pourras envoyer le compte-rendu ensuite.)')) return;
    const { error } = await sb.rpc('coach_end', { p_event: ev.currentTarget.dataset.pend });
    if (error) return alert('Erreur : ' + error.message);
    await loadAll(); flash = 'Séance terminée. Pense au compte-rendu.'; render();
  });
  box.querySelectorAll('[data-poste]').forEach(s => s.addEventListener('change', async () => {
    const { error } = await sb.rpc('coach_set_poste', { p_device: s.dataset.poste, p_poste: s.value });
    if (error) alert('Erreur : ' + error.message);
  }));
  box.querySelectorAll('[data-premove]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Retirer cette tablette du projet ? Elle retourne au parc PandaFit.')) return;
    const { error } = await sb.rpc('coach_remove_device', { p_device: b.dataset.premove });
    if (error) return alert('Erreur : ' + error.message);
    loadProject(proj.id);
  }));
}
/* En direct : où en est la séance, qui est le prochain groupe, quelle est l'étape suivante */
const LIBRE_OFFERS = ['mois_equilibre', 'campagne_annuelle', 'abonnement'];
function liveAllDone() {
  const st = proj?.live_stats;
  return !!(st && st.registered && st.index_done >= st.registered);
}
function liveProgressHTML(live, stepName) {
  const st = proj.live_stats;
  if (!st) return '';
  const target = st.registered || st.expected || 0;
  const pct = target ? Math.min(100, Math.round(st.index_done / target * 100)) : 0;
  const ago = st.last_play_at ? Math.round((Date.now() - new Date(st.last_play_at).getTime()) / 60000) : null;
  const now = Date.now();
  const slots = st.slots || [];
  const cur = slots.find(s => new Date(s.starts_at) <= now && new Date(s.ends_at) > now);
  const nxt = slots.find(s => new Date(s.starts_at) > now);
  const names = s => s.names.length ? esc(s.names.join(', ')) + (s.registered > s.names.length ? ` <span class="hint">+ ${s.registered - s.names.length} sans nom</span>` : '') : `<span class="hint">${s.registered} inscrit${s.registered > 1 ? 's' : ''} sans nom</span>`;
  const remaining = Math.max(0, (st.registered || 0) - st.index_done);
  const nextEv = proj.events.find(e => e.status === 'preparee' && e.id !== live.id);
  let step;
  if (proj.offer === 'team_building') step = "Pilote les phases du Triathlon plus bas (essais → triathlon → finale → podium), puis termine la séance.";
  else if (!st.registered) step = 'Quand tout le monde est passé, termine la séance.';
  else if (remaining) step = `Encore environ <b>${remaining}</b> inscrit${remaining > 1 ? 's' : ''} à passer. S'il n'y a plus personne, tu peux terminer maintenant, même si d'autres étaient inscrits.`;
  else step = '<b>Tous les inscrits sont passés</b> : tu peux terminer la séance.';
  const after = nextEv
    ? `Ensuite : ${esc(stepName(nextEv))} (prévue le ${new Date(nextEv.starts_at).toLocaleDateString('fr-CH')}), que tu démarreras sur place.${LIBRE_OFFERS.includes(proj.offer) ? ' Entre-temps, le panda reste en libre-service.' : ''}`
    : `Ensuite : fin du projet, les tablettes retournent au parc. Il ne te restera que le compte-rendu.`;
  return `
    <div style="background:var(--panel-hi);border-radius:12px;padding:12px 14px;margin-top:10px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;">
        <b style="font-size:13px;">En direct</b>
        <span class="hint" style="margin:0;">${ago == null ? 'aucun passage encore' : ago < 1 ? "dernier passage à l'instant" : `dernier passage il y a ${ago < 60 ? ago + ' min' : Math.round(ago / 60) + ' h'}`}</span>
      </div>
      <div style="font-size:30px;font-weight:800;margin:6px 0 2px;">${st.index_done}<span style="font-size:15px;font-weight:600;color:var(--text-dim);"> Index passé${st.index_done > 1 ? 's' : ''}${target ? ` / ${target} ${st.registered ? 'inscrits' : 'attendus'}` : ''}</span></div>
      ${target ? `<div style="height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;"><div style="height:100%;width:${pct}%;background:var(--primary);"></div></div>` : ''}
      <div class="hint" style="margin:4px 0 0;">${st.plays} partie${st.plays > 1 ? 's' : ''} jouée${st.plays > 1 ? 's' : ''} au total${st.registered && st.expected ? ` · ${st.expected} attendus` : ''}</div>
      ${cur ? `<div style="margin-top:10px;font-size:13px;"><b>Groupe en cours ${fmtTime(cur.starts_at)}</b> · ${cur.registered} inscrit${cur.registered > 1 ? 's' : ''}<br>${names(cur)}</div>` : ''}
      ${nxt ? `<div style="margin-top:8px;font-size:13px;"><b>Prochain groupe ${fmtTime(nxt.starts_at)}</b> · ${nxt.registered} inscrit${nxt.registered > 1 ? 's' : ''}<br>${names(nxt)}</div>` : slots.length ? '<div class="hint" style="margin-top:8px;">Plus de groupe prévu après celui-ci.</div>' : ''}
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);font-size:13px;">
        <b>Étape suivante</b><br>${step}<br><span class="hint">${after}</span>
      </div>
    </div>`;
}
function afterStepHTML(next, stepName) {
  const m = missions.find(x => x.id === openMissionId);
  if (m && m.status === 'cloturee' && !m.report_done) return '<div class="ok" style="margin-top:10px;">Séance terminée. <b>Étape suivante :</b> remplis le compte-rendu plus bas.</div>';
  if (next && !next.mine) return `<p class="hint" style="margin-top:10px;">Prochaine séance : ${esc(stepName(next))} le ${new Date(next.starts_at).toLocaleDateString('fr-CH')} (un autre coach).</p>`;
  return '';
}
function startProjectPolling(projectId) {
  clearInterval(projTimer);
  loadProject(projectId);
  projTimer = setInterval(() => {
    if (!document.getElementById('projBox')) { clearInterval(projTimer); return; }
    if (document.activeElement?.matches?.('#projBox select')) return; // le coach est en train de choisir un poste
    loadProject(projectId);
  }, 10000);
}

/* ---------------- Actions ---------------- */
function wire() {
  if (document.getElementById('triBox') && openMissionId) startTriathlonPolling(openMissionId); else clearInterval(triTimer);
  const om = openMissionId && missions.find(x => x.id === openMissionId);
  if (document.getElementById('projBox') && om?.project_id) startProjectPolling(om.project_id); else clearInterval(projTimer);
  app.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => { openMissionId = b.dataset.open; flash = null; render(); window.scrollTo(0, 0); }));
  app.querySelector('[data-back]')?.addEventListener('click', () => { openMissionId = null; render(); });
  app.querySelector('[data-start]')?.addEventListener('click', async (e) => {
    const { error } = await sb.rpc('coach_start', { p_event: e.currentTarget.dataset.start });
    if (error) { alert('Erreur : ' + error.message); return; }
    await loadAll(); flash = 'Séance démarrée. Bonne animation !'; render();
  });
  let mood = null;
  app.querySelectorAll('#rMood [data-mood]').forEach(b => b.addEventListener('click', () => {
    mood = Number(b.dataset.mood);
    app.querySelectorAll('#rMood button').forEach(x => x.classList.toggle('on', Number(x.dataset.mood) === mood));
  }));
  app.querySelector('[data-close]')?.addEventListener('click', async (e) => {
    if (!confirm('Clôturer la séance et envoyer le compte-rendu ?')) return;
    const report = {
      participants: document.getElementById('rParticipants').value,
      mood: mood ? String(mood) : '',
      hot_lead: document.getElementById('rLead').checked,
      lead_comment: document.getElementById('rLeadComment').value.trim() || null,
      material_issue: document.getElementById('rMaterial').value.trim() || null,
      comment: document.getElementById('rComment').value.trim() || null,
    };
    const { error } = await sb.rpc('coach_close', { p_event: e.currentTarget.dataset.close, p_report: report });
    if (error) { alert('Erreur : ' + error.message); return; }
    await loadAll(); flash = 'Compte-rendu envoyé. Merci !'; render();
  });
  document.getElementById('btnSaveProfile')?.addEventListener('click', async () => {
    const langs = [...app.querySelectorAll('.pLang:checked')].map(c => c.value);
    const { error } = await sb.rpc('coach_update_profile', {
      p_name: document.getElementById('pName').value, p_phone: document.getElementById('pPhone').value, p_languages: langs.length ? langs : ['fr'],
    });
    if (error) { alert('Erreur : ' + error.message); return; }
    await loadAll(); flash = 'Profil enregistré.'; render();
  });
  document.getElementById('btnLogout')?.addEventListener('click', async () => { await sb.auth.signOut(); me = null; renderLogin('Tu es déconnecté.', true); });
}

boot();
</script>
</body>
</html>
