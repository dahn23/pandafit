/* ---------------- Statistiques globales (tous clients, sans détail questionnaire) ---------------- */
let globalStatsFilters = { start: null, end: null };

async function renderGlobalStatsView() {
  if (!globalStatsFilters.start) Object.assign(globalStatsFilters, defaultStatsRange());
  const main = document.getElementById('main');
  main.innerHTML = '<p class="empty">Chargement...</p>';

  const { data: sessionsData } = await sb.from('sessions').select('*')
    .gte('played_at', globalStatsFilters.start)
    .lte('played_at', globalStatsFilters.end + 'T23:59:59');
  const sessions = sessionsData || [];
  const dayList = enumerateDays(globalStatsFilters.start, globalStatsFilters.end);
  const stats = computeScopeStats(sessions, dayList);

  // Résumé par client
  const byClient = {};
  sessions.forEach(s => {
    if (!byClient[s.client_id]) byClient[s.client_id] = { count: 0, indexScores: [] };
    byClient[s.client_id].count++;
    if (s.game_id === 'indextest') byClient[s.client_id].indexScores.push(s.score);
  });
  const clientRows = Object.entries(byClient).map(([clientId, v]) => ({
    name: clients.find(c => c.id === clientId)?.name || 'Client inconnu',
    count: v.count,
    avgIndex: v.indexScores.length ? Math.round(v.indexScores.reduce((a, b) => a + b, 0) / v.indexScores.length) : null,
  })).sort((a, b) => b.count - a.count);

  const gameLabels = Object.keys(stats.countByGame).map(id => games.find(g => g.id === id)?.name || id);

  main.innerHTML = `
    <div class="section-title" style="display:flex;align-items:center;gap:10px;"><i data-lucide="bar-chart-3"></i> Statistiques globales</div>
    <div class="section-sub">Tous clients confondus. Le détail par questionnaire reste disponible client par client (trop hétérogène pour une vue globale).</div>
    <div class="card">
      <h3>Période</h3>
      <div class="form-grid" style="grid-template-columns:1fr 1fr;">
        <div><div style="font-size:11.5px;color:var(--text-dim);margin-bottom:4px;">Du</div><input id="gsStart" type="date" value="${globalStatsFilters.start}"></div>
        <div><div style="font-size:11.5px;color:var(--text-dim);margin-bottom:4px;">Au</div><input id="gsEnd" type="date" value="${globalStatsFilters.end}"></div>
      </div>
    </div>
    <div class="stat-grid" style="grid-template-columns:repeat(4,1fr);">
      <div class="stat-box"><div class="n">${stats.total}</div><div class="l">Parties jouées (tous clients)</div></div>
      <div class="stat-box"><div class="n">${clientRows.length}</div><div class="l">Clients actifs sur la période</div></div>
      <div class="stat-box"><div class="n">${stats.earlyAvg ?? '—'} → ${stats.lateAvg ?? '—'}</div><div class="l">Index moy. début → fin</div></div>
      <div class="stat-box"><div class="n" style="color:${stats.delta > 0 ? '#43cea2' : stats.delta < 0 ? '#e6374e' : 'var(--text)'};">${stats.delta != null ? (stats.delta > 0 ? '+' : '') + stats.delta : '—'}</div><div class="l">Évolution Index</div></div>
    </div>
    <div class="card">
      <h3>Parties par jour</h3>
      <div class="chart-wrap"><canvas id="gsChartByDay"></canvas></div>
    </div>
    <div class="card">
      <h3>PandaFit Index moyen par jour</h3>
      <div class="chart-wrap"><canvas id="gsChartIndex"></canvas></div>
    </div>
    <div class="card">
      <h3>Répartition par jeu</h3>
      <div class="chart-wrap"><canvas id="gsChartByGame"></canvas></div>
    </div>
    <div class="card">
      <h3>Activité par client</h3>
      ${clientRows.length ? `
        <table>
          <tr><th>Client</th><th>Parties jouées</th><th>Index moyen</th></tr>
          ${clientRows.map(r => `<tr><td><b>${r.name}</b></td><td>${r.count}</td><td>${r.avgIndex ?? '—'}</td></tr>`).join('')}
        </table>
      ` : '<p class="empty">Aucune activité sur cette période.</p>'}
    </div>
  `;

  document.getElementById('gsStart').addEventListener('change', (e) => { globalStatsFilters.start = e.target.value; renderGlobalStatsView(); });
  document.getElementById('gsEnd').addEventListener('change', (e) => { globalStatsFilters.end = e.target.value; renderGlobalStatsView(); });

  if (charts.gsByDay) charts.gsByDay.destroy();
  if (charts.gsIndex) charts.gsIndex.destroy();
  if (charts.gsByGame) charts.gsByGame.destroy();

  charts.gsByDay = new Chart(document.getElementById('gsChartByDay'), {
    type: 'bar',
    data: { labels: dayList.map(d => d.slice(5)), datasets: [{ data: stats.countsByDay, backgroundColor: '#43cea2', borderRadius: 4 }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { color: '#9992ad' } }, x: { ticks: { color: '#9992ad', maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } } } }
  });
  charts.gsIndex = new Chart(document.getElementById('gsChartIndex'), {
    type: 'line',
    data: { labels: dayList.map(d => d.slice(5)), datasets: [{ data: stats.avgIndexByDay, spanGaps: true, borderColor: '#c86dd7', backgroundColor: 'rgba(200,109,215,0.15)', fill: true, tension: 0.3 }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100, ticks: { color: '#9992ad' } }, x: { ticks: { color: '#9992ad', maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } } } }
  });
  charts.gsByGame = new Chart(document.getElementById('gsChartByGame'), {
    type: 'doughnut',
    data: { labels: gameLabels, datasets: [{ data: Object.values(stats.countByGame), backgroundColor: ['#43cea2', '#185a9d', '#c86dd7', '#e6374e', '#e0a83e', '#3023ae'] }] },
    options: { plugins: { legend: { position: 'right', labels: { color: '#f4f2fa' } } } }
  });
}

/* ---------------- Gestion des accès (multi-admin) ---------------- */
let adminUsersList = [];
let editingAdminId = null;

const PERMISSION_DEFS = [
  { key: 'menu_crm', label: 'Accès au menu CRM' },
  { key: 'menu_globalstats', label: 'Accès aux Statistiques globales' },
  { key: 'menu_calendar', label: 'Accès au Calendrier' },
  { key: 'create_challenges', label: 'Créer des Challenges (inter-clients)' },
  { key: 'manage_content', label: 'Gérer le Contenu global (jeux + Index)' },
];

async function loadAdminUsers() {
  const { data } = await sb.from('admin_users').select('*, admin_client_access(client_id)').order('created_at');
  adminUsersList = data || [];
}

async function renderAccessView() {
  if (!currentAdmin?.is_superadmin) {
    document.getElementById('main').innerHTML = '<div class="card"><p class="empty">Réservé au superadmin.</p></div>';
    return;
  }
  await loadAdminUsers();
  const main = document.getElementById('main');

  if (editingAdminId) { renderAdminEditor(); return; }

  main.innerHTML = `
    <div class="section-title" style="display:flex;align-items:center;gap:10px;"><i data-lucide="shield"></i> Gestion des accès</div>
    <div class="section-sub">Crée des comptes admin et choisis à quoi ils ont accès. Le mot de passe est géré par l'admin lui-même (email de réinitialisation) — je ne peux jamais le voir ni le définir directement.</div>
    <div class="card">
      <h3>Nouvel admin</h3>
      <div class="form-grid" style="grid-template-columns:1fr 1fr;">
        <input id="newAdminEmail" type="email" placeholder="Email">
        <input id="newAdminName" placeholder="Nom (optionnel)">
        <input id="newAdminPassword" type="password" placeholder="Mot de passe initial">
      </div>
      <p style="font-size:12px;color:var(--text-dim);margin:8px 0;">L'admin pourra le changer via "Mot de passe oublié" sur l'écran de connexion.</p>
      <button class="btn-primary" id="btnCreateAdmin" style="width:auto;">Créer le compte</button>
    </div>
    <div class="card">
      <h3>Comptes existants</h3>
      <table>
        <tr><th>Email</th><th>Nom</th><th>Rôle</th><th>Clients</th><th></th></tr>
        ${adminUsersList.map(a => `
          <tr>
            <td>${a.email}</td>
            <td>${a.display_name || '—'}</td>
            <td>${a.is_superadmin ? '<span class="badge">Superadmin</span>' : 'Admin'}</td>
            <td>${a.is_superadmin ? 'Tous' : (a.admin_client_access?.length || 0)}</td>
            <td>
              ${!a.is_superadmin ? `<button class="btn-ghost" data-edit-admin="${a.id}">Modifier</button>
              <button class="btn-destructive" data-del-admin="${a.id}">Supprimer</button>` : ''}
            </td>
          </tr>
        `).join('')}
      </table>
    </div>
  `;

  document.getElementById('btnCreateAdmin').addEventListener('click', async () => {
    const email = document.getElementById('newAdminEmail').value.trim();
    const password = document.getElementById('newAdminPassword').value;
    const display_name = document.getElementById('newAdminName').value.trim() || null;
    if (!email || password.length < 6) { alert('Email + mot de passe (6 caractères min.) requis.'); return; }
    // Client secondaire jetable pour ne pas affecter la session superadmin en cours
    const tempClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
    const { data: signUpData, error: signUpError } = await tempClient.auth.signUp({ email, password });
    if (signUpError) { alert('Erreur : ' + signUpError.message); return; }
    const { error: insertError } = await sb.from('admin_users').insert({
      user_id: signUpData.user.id, email, display_name, is_superadmin: false, permissions: {},
    });
    if (insertError) { alert('Erreur : ' + insertError.message); return; }
    alert("Compte créé. Selon les réglages du projet, un email de confirmation a peut-être été envoyé — l'admin devra peut-être cliquer dessus avant de pouvoir se connecter.");
    renderAccessView();
  });

  main.querySelectorAll('[data-edit-admin]').forEach(btn => {
    btn.addEventListener('click', () => { editingAdminId = btn.dataset.editAdmin; renderAccessView(); });
  });
  main.querySelectorAll('[data-del-admin]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm("Supprimer cet accès ? (le compte de connexion lui-même n'est pas supprimé, seul son accès à la console l'est)")) return;
      await sb.from('admin_users').delete().eq('id', btn.dataset.delAdmin);
      renderAccessView();
    });
  });
}

function renderAdminEditor() {
  const main = document.getElementById('main');
  const admin = adminUsersList.find(a => a.id === editingAdminId);
  if (!admin) { editingAdminId = null; renderAccessView(); return; }
  const assignedClientIds = (admin.admin_client_access || []).map(a => a.client_id);

  main.innerHTML = `
    <button class="btn-ghost" id="btnBackAccess" style="margin-bottom:14px;">← Retour aux accès</button>
    <div class="card">
      <h3>${admin.email}</h3>
      <input id="editAdminName" placeholder="Nom" value="${admin.display_name || ''}" style="margin-bottom:10px;">
      <button class="btn-ghost" id="btnSendReset" style="width:auto;">Envoyer un email de réinitialisation du mot de passe</button>
    </div>
    <div class="card">
      <h3>Permissions</h3>
      <table>
        ${PERMISSION_DEFS.map(p => `
          <tr>
            <td style="width:36px;"><input type="checkbox" class="perm-check" id="perm-${p.key}" data-perm="${p.key}" ${admin.permissions?.[p.key] ? 'checked' : ''}></td>
            <td><label for="perm-${p.key}" style="cursor:pointer;">${p.label}</label></td>
          </tr>
        `).join('')}
      </table>
    </div>
    <div class="card">
      <h3>Clients assignés</h3>
      <p style="font-size:12px;color:var(--text-dim);margin-bottom:10px;">L'admin aura toutes les options (comme toi) sur les clients cochés ici.</p>
      ${clients.map((c, i) => `
        <span class="client-check-row">
          <input type="checkbox" class="client-check" id="client-check-${i}" value="${c.id}" ${assignedClientIds.includes(c.id) ? 'checked' : ''}>
          <label for="client-check-${i}">${c.name}</label>
        </span>
      `).join('')}
    </div>
    <button class="btn-primary" id="btnSaveAdmin" style="width:auto;">Enregistrer</button>
  `;

  document.getElementById('btnBackAccess').addEventListener('click', () => { editingAdminId = null; renderAccessView(); });
  document.getElementById('btnSendReset').addEventListener('click', async () => {
    const { error } = await sb.auth.resetPasswordForEmail(admin.email, { redirectTo: location.origin + location.pathname });
    alert(error ? 'Erreur : ' + error.message : `Email de réinitialisation envoyé à ${admin.email}.`);
  });
  document.getElementById('btnSaveAdmin').addEventListener('click', async () => {
    const display_name = document.getElementById('editAdminName').value.trim() || null;
    const permissions = {};
    main.querySelectorAll('.perm-check').forEach(cb => { permissions[cb.dataset.perm] = cb.checked; });
    const selectedClientIds = [...main.querySelectorAll('.client-check:checked')].map(cb => cb.value);

    await sb.from('admin_users').update({ display_name, permissions }).eq('id', admin.id);
    await sb.from('admin_client_access').delete().eq('admin_user_id', admin.id);
    if (selectedClientIds.length) {
      await sb.from('admin_client_access').insert(selectedClientIds.map(cid => ({ admin_user_id: admin.id, client_id: cid })));
    }
    editingAdminId = null;
    renderAccessView();
  });
}

/* ---------------- Calendrier (simple) ---------------- */
let calEvents = [];
let editingCalEventId = null;

async function loadCalEvents() {
  const { data } = await sb.from('calendar_events').select('*, admin_users(email, display_name, is_superadmin)').order('start_at');
  calEvents = data || [];
}

function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-CH') + ' ' + d.toLocaleTimeString('fr-CH', { hour: '2-digit', minute: '2-digit' });
}
function toLocalInputValue(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

async function renderCalendarView() {
  await loadCalEvents();
  const { data: adminsForSelect } = await sb.from('admin_users').select('id, email, display_name, is_superadmin').order('email');
  const main = document.getElementById('main');
  const editing = calEvents.find(e => e.id === editingCalEventId);
  const now = new Date();
  const upcoming = calEvents.filter(e => new Date(e.end_at) >= now);
  const past = calEvents.filter(e => new Date(e.end_at) < now);

  function assignedLabel(e) {
    if (e.admin_users) return e.admin_users.display_name || e.admin_users.email + (e.admin_users.is_superadmin ? ' (Superadmin)' : '');
    if (e.assigned_free_text) return e.assigned_free_text;
    return 'Personne';
  }

  function eventRowHTML(e) {
    return `
      <div class="event-item">
        <div class="title-row">
          <b>${e.title}</b>
          <span style="display:flex;gap:6px;">
            <button class="btn-ghost" data-edit-event="${e.id}">Modifier</button>
            <button class="btn-destructive" data-del-event="${e.id}">Supprimer</button>
          </span>
        </div>
        <div class="dates">${fmtDateTime(e.start_at)} → ${fmtDateTime(e.end_at)} · <span class="badge">${assignedLabel(e)}</span></div>
        ${e.description ? `<p style="font-size:12.5px;color:var(--text-dim);margin:6px 0 0;">${e.description}</p>` : ''}
      </div>
    `;
  }

  main.innerHTML = `
    <div class="section-title" style="display:flex;align-items:center;gap:10px;"><i data-lucide="calendar-days"></i> Calendrier</div>
    <div class="section-sub">Événements internes PandaFit — rendez-vous, tâches, échéances.</div>
    <div class="card">
      <h3>${editing ? 'Modifier l\'événement' : 'Nouvel événement'}</h3>
      <input id="ceTitle" placeholder="Titre" value="${editing?.title || ''}" style="margin-bottom:10px;">
      <div class="form-grid" style="grid-template-columns:1fr 1fr;">
        <div>
          <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:4px;">Début</div>
          <input id="ceStart" type="datetime-local" value="${editing ? toLocalInputValue(editing.start_at) : ''}">
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:4px;">Fin</div>
          <input id="ceEnd" type="datetime-local" value="${editing ? toLocalInputValue(editing.end_at) : ''}">
        </div>
      </div>
      <textarea id="ceDesc" placeholder="Description (optionnel)" rows="3" style="width:100%;margin-top:10px;padding:13px 14px;border-radius:10px;border:1px solid var(--border);background:#17132a;color:var(--text);font-family:inherit;resize:vertical;">${editing?.description || ''}</textarea>
      <div style="margin-top:10px;">
        <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:4px;">Attribué à</div>
        <select id="ceAssignType" style="width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--border);background:#17132a;color:var(--text);margin-bottom:8px;">
          <option value="none" ${!editing?.assigned_admin_id && !editing?.assigned_free_text ? 'selected' : ''}>Personne</option>
          <option value="admin" ${editing?.assigned_admin_id ? 'selected' : ''}>Un admin/superadmin</option>
          <option value="free" ${editing?.assigned_free_text ? 'selected' : ''}>Autre (nom libre)</option>
        </select>
        <select id="ceAdminSelect" style="width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--border);background:#17132a;color:var(--text);display:${editing?.assigned_admin_id ? 'block' : 'none'};margin-bottom:8px;">
          ${adminsForSelect.map(a => `<option value="${a.id}" ${editing?.assigned_admin_id === a.id ? 'selected' : ''}>${a.display_name || a.email}${a.is_superadmin ? ' (Superadmin)' : ''}</option>`).join('')}
        </select>
        <input id="ceFreeText" placeholder="Nom libre" value="${editing?.assigned_free_text || ''}" style="display:${editing?.assigned_free_text ? 'block' : 'none'};">
      </div>
      <div class="row" style="gap:8px;margin-top:10px;">
        <button class="btn-primary" id="btnSaveEvent" style="width:auto;">${editing ? 'Enregistrer' : 'Créer'}</button>
        ${editing ? `<button class="btn-ghost" id="btnCancelEvent" style="width:auto;">Annuler</button>` : ''}
      </div>
    </div>

    <div class="menu-section-title">À venir (${upcoming.length})</div>
    ${upcoming.length ? upcoming.map(eventRowHTML).join('') : '<div class="card"><p class="empty">Aucun événement à venir.</p></div>'}

    ${past.length ? `
      <div class="menu-section-title" style="margin-top:22px;">Passés (${past.length})</div>
      ${past.map(eventRowHTML).join('')}
    ` : ''}
  `;

  document.getElementById('ceAssignType').addEventListener('change', (e) => {
    document.getElementById('ceAdminSelect').style.display = e.target.value === 'admin' ? 'block' : 'none';
    document.getElementById('ceFreeText').style.display = e.target.value === 'free' ? 'block' : 'none';
  });
  document.getElementById('btnCancelEvent')?.addEventListener('click', () => { editingCalEventId = null; renderCalendarView(); });
  document.getElementById('btnSaveEvent').addEventListener('click', async () => {
    const title = document.getElementById('ceTitle').value.trim();
    const start_at = document.getElementById('ceStart').value;
    const end_at = document.getElementById('ceEnd').value;
    if (!title || !start_at || !end_at) return;
    const assignType = document.getElementById('ceAssignType').value;
    const payload = {
      title,
      description: document.getElementById('ceDesc').value.trim() || null,
      start_at: new Date(start_at).toISOString(),
      end_at: new Date(end_at).toISOString(),
      assigned_admin_id: assignType === 'admin' ? document.getElementById('ceAdminSelect').value : null,
      assigned_free_text: assignType === 'free' ? (document.getElementById('ceFreeText').value.trim() || null) : null,
    };
    const { error } = editingCalEventId
      ? await sb.from('calendar_events').update(payload).eq('id', editingCalEventId)
      : await sb.from('calendar_events').insert(payload);
    if (error) { alert('Erreur : ' + error.message); return; }
    editingCalEventId = null;
    renderCalendarView();
  });
  main.querySelectorAll('[data-edit-event]').forEach(btn => {
    btn.addEventListener('click', () => { editingCalEventId = btn.dataset.editEvent; renderCalendarView(); });
  });
  main.querySelectorAll('[data-del-event]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Supprimer cet événement ?')) return;
      await sb.from('calendar_events').delete().eq('id', btn.dataset.delEvent);
      renderCalendarView();
    });
  });
}

init();
</script>
</body>
</html>
