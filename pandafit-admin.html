<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PandaFit — Console superadmin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --bg: #1c162e; --panel: #241d38; --panel-hi: #2c2444;
    --primary: #43cea2; --primary-dark: #185a9d;
    --accent: #c86dd7; --destructive: #e6374e;
    --text: #f4f2fa; --text-dim: #9992ad;
    --border: #35294f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; }
  #app { min-height: 100vh; }

  /* Login */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--panel); border-radius: 20px; padding: 36px; width: 100%; max-width: 380px; }
  .login-card h1 { font-size: 22px; margin: 0 0 6px; }
  .login-card p { color: var(--text-dim); font-size: 13.5px; margin: 0 0 22px; }
  input {
    width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: #17132a; color: var(--text); font-size: 14.5px; margin-bottom: 10px; font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--primary); }
  input[type="checkbox"] { width: auto; padding: 0; margin: 0; background: none; border: none; accent-color: var(--primary); }
  button { font-family: inherit; border: none; cursor: pointer; border-radius: 10px; font-weight: 700; font-size: 14px; padding: 12px 18px; }
  .btn-primary { background: linear-gradient(120deg, var(--primary), var(--primary-dark)); color: #0c2018; width: 100%; }
  .btn-ghost { background: var(--panel-hi); color: var(--text); }
  .btn-destructive { background: rgba(230,55,78,0.15); color: #ff8a97; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-msg { color: #ff8a97; font-size: 13px; margin: -4px 0 12px; }

  /* Shell */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; }
  .brand .mark {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(120deg, var(--primary), var(--primary-dark));
    display: flex; align-items: center; justify-content: center; font-size: 13px; color: #0c2018;
  }
  .top-nav {
    display: flex; gap: 4px; padding: 0 24px; border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.15); overflow-x: auto;
  }
  .top-nav-tab {
    display: flex; align-items: center; gap: 7px; padding: 13px 16px; font-size: 13.5px;
    font-weight: 600; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .top-nav-tab.active { color: var(--text); border-color: var(--primary); }
  .top-nav-tab:hover { color: var(--text); }
  .layout { display: flex; min-height: calc(100vh - 61px - 47px); }
  .sidebar { width: 280px; border-right: 1px solid var(--border); padding: 18px; flex-shrink: 0; }
  .sidebar h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin: 4px 0 10px; }
  .client-item {
    padding: 12px 14px; border-radius: 10px; cursor: pointer; margin-bottom: 4px;
    font-size: 14px; display: flex; justify-content: space-between; align-items: center;
  }
  .client-item:hover { background: var(--panel); }
  .client-item.active { background: var(--panel-hi); font-weight: 700; }
  .client-item .count { font-size: 11px; color: var(--text-dim); }
  .main { flex: 1; padding: 24px 28px; overflow-x: auto; }
  .section-title { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
  .section-sub { color: var(--text-dim); font-size: 13.5px; margin: 0 0 20px; }
  .card { background: var(--panel); border-radius: 16px; padding: 20px; margin-bottom: 18px; }
  .card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 0 0 14px; }
  .inline-form { display: flex; gap: 8px; margin-bottom: 4px; }
  .inline-form input { margin-bottom: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--text-dim); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 10px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  .key-chip { font-family: ui-monospace, Menlo, monospace; background: var(--panel-hi); padding: 3px 8px; border-radius: 6px; font-size: 12.5px; }
  .toggle { position: relative; width: 42px; height: 24px; display: inline-block; }
  .toggle input { display: none; }
  .toggle .track { position: absolute; inset: 0; background: var(--border); border-radius: 100px; transition: background 0.15s; cursor: pointer; }
  .toggle input:checked + .track { background: var(--primary); }
  .toggle .thumb { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 0.15s; pointer-events: none; }
  .toggle input:checked ~ .thumb { transform: translateX(18px); }
  .perm-row { display: flex !important; flex-direction: row !important; align-items: center; gap: 8px; margin-bottom: 10px; text-align: left; }
  .perm-row label { font-size: 13.5px; cursor: pointer; text-align: left; margin: 0; }
  .client-check-row { display: inline-flex !important; align-items: center; gap: 6px; margin: 0 14px 8px 0; font-size: 13.5px; text-align: left; }
  .empty { color: var(--text-dim); font-size: 13.5px; padding: 20px 0; text-align: center; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--panel-hi); color: var(--text-dim); }
  .badge-brouillon { background: rgba(24,90,157,0.25); color: #6cb6f5; }
  .badge-envoyee { background: rgba(224,168,62,0.25); color: #f0c26e; }
  .badge-payee { background: rgba(67,206,162,0.22); color: #43cea2; }
  .tabs { display: flex; gap: 4px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .tab { padding: 10px 16px; font-size: 13.5px; color: var(--text-dim); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--text); border-color: var(--primary); font-weight: 700; }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  .stat-box { background: var(--panel); border-radius: 16px; padding: 18px; }
  .stat-box .n { font-size: 28px; font-weight: 800; }
  .stat-box .l { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .chart-wrap { position: relative; height: 260px; }
  .event-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .event-item:last-child { border-bottom: none; }
  .event-item .title-row { display: flex; justify-content: space-between; align-items: center; }
  .event-item .dates { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .event-item .desc { font-size: 13px; color: var(--text-dim); margin-top: 6px; }
  .form-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  [data-lucide] { display: inline-block; vertical-align: -0.15em; width: 1em; height: 1em; }

  /* --- Menu tablette (vignettes + glisser-déposer) --- */
  .menu-stack { display: flex; flex-direction: column; gap: 10px; }
  .menu-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .thumb-card {
    position: relative; border-radius: 14px; overflow: hidden; cursor: grab;
    background-size: cover; background-position: center;
    display: flex; align-items: flex-end; padding: 12px 14px; color: #fff;
    min-height: 74px; flex-shrink: 0;
  }
  .menu-stack .thumb-card { width: 100%; }
  .menu-row .thumb-card { width: 190px; height: 100px; }
  .thumb-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(0,0,0,0.6) 100%); }
  .thumb-card .tc-content { position: relative; z-index: 1; }
  .thumb-card .tc-badge {
    position: absolute; top: 8px; left: 10px; font-size: 9.5px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.05em; padding: 3px 8px; border-radius: 100px; background: rgba(255,255,255,0.22); z-index: 1;
    display: flex; align-items: center; gap: 4px;
  }
  .thumb-card .tc-title { font-weight: 800; font-size: 13.5px; }
  .thumb-card .tc-drag {
    position: absolute; top: 8px; right: 10px; z-index: 1; opacity: 0.8; cursor: grab;
  }
  .thumb-card .tc-actions {
    position: absolute; bottom: 8px; right: 8px; z-index: 2; display: flex; gap: 6px;
  }
  .tc-action-btn {
    width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    color: #fff; border: none;
  }
  .tc-action-btn:hover { background: rgba(0,0,0,0.65); }
  .thumb-card.dragging { opacity: 0.4; }
  .menu-section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); margin: 4px 0 10px; }
</style>
</head>

const I18N_LANGS = [['fr', 'Français'], ['en', 'English'], ['de', 'Deutsch'], ['it', 'Italiano']];
/** Génère 4 champs (FR/EN/DE/IT). uid = identifiant unique pour cette instance du champ (ex: id de la question),
 *  dbField = nom de la colonne FR (sans suffixe) dans la base. */
function i18nFieldGroup(uid, dbField, label, obj, multiline) {
  return `
    <div style="margin-bottom:10px;">
      <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:4px;">${label}</div>
      ${I18N_LANGS.map(([code, langLabel]) => {
        const val = code === 'fr' ? (obj?.[dbField] || '') : (obj?.[dbField + '_' + code] || '');
        const id = `i18n_${uid}_${code}`;
        return multiline
          ? `<textarea id="${id}" placeholder="${langLabel}" rows="2" style="width:100%;margin-bottom:6px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:#17132a;color:var(--text);font-family:inherit;resize:vertical;">${val}</textarea>`
          : `<input id="${id}" placeholder="${langLabel}" value="${val}" style="margin-bottom:6px;">`;
      }).join('')}
    </div>
  `;
}
/** Relit un groupe i18n. Renvoie { dbField, dbField_en, dbField_de, dbField_it } */
function readI18nField(uid, dbField) {
  const out = {};
  I18N_LANGS.forEach(([code]) => {
    const el = document.getElementById(`i18n_${uid}_${code}`);
    const v = el ? el.value.trim() || null : null;
    out[code === 'fr' ? dbField : dbField + '_' + code] = v;
  });
  return out;
}

const app = document.getElementById('app');
let session = null;
let clients = [];
let selectedClientId = null;
let devices = [];
let games = [];
let clientGames = [];
let sessions = [];
let allSessions = [];
let events = [];
let defis = [];
let challenges = [];
let clientAds = [];
let activeTab = 'details';
let viewMode = 'client'; // 'client' | 'challenges' | 'content'
let topView = 'clients'; // 'clients' | 'crm' | 'globalstats' | 'access' | 'calendar'
let charts = {};

function genDeviceKey() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return `DEV-${s}`;
}

/* ---------------- Auth ---------------- */
async function init() {
  const { data } = await sb.auth.getSession();
  session = data.session;
  if (session) await loadCurrentAdmin();
  sb.auth.onAuthStateChange((_event, s) => { session = s; render(); });
  render();
}

function renderLogin(errorMsg) {
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <h1>PandaFit</h1>
        <p>Console superadmin — accès réservé.</p>
        <input id="loginEmail" type="email" placeholder="Email">
        <input id="loginPassword" type="password" placeholder="Mot de passe">
        ${errorMsg ? `<div class="error-msg">${errorMsg}</div>` : ''}
        <button class="btn-primary" id="btnLogin">Se connecter</button>
        <a class="linklike" id="btnForgotPassword" style="display:block;text-align:center;margin-top:12px;font-size:13px;">Mot de passe oublié ?</a>
      </div>
    </div>
  `;
  document.getElementById('btnLogin').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { renderLogin(error.message); return; }
    clients = [];
    selectedClientId = null;
    await loadCurrentAdmin();
    await loadClients();
    render();
  });
  document.getElementById('btnForgotPassword').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) { alert('Entre ton email dans le champ ci-dessus puis reclique sur ce lien.'); return; }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    alert(error ? 'Erreur : ' + error.message : `Un email de réinitialisation a été envoyé à ${email}.`);
  });
}

/* ---------------- Compte admin courant (bootstrap + permissions) ---------------- */
let currentAdmin = null;

async function loadCurrentAdmin() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { currentAdmin = null; return; }
  let { data: rows } = await sb.from('admin_users').select('*').eq('user_id', user.id);
  if (!rows || !rows.length) {
    // Premier compte à se connecter jamais = superadmin par défaut (bootstrap)
    const { data: existingAny } = await sb.from('admin_users').select('id').limit(1);
    const isFirstEver = !existingAny || !existingAny.length;
    const { data: created } = await sb.from('admin_users')
      .insert({ user_id: user.id, email: user.email, is_superadmin: isFirstEver })
      .select();
    rows = created;
  }
  currentAdmin = rows?.[0] || null;
  if (currentAdmin && !currentAdmin.is_superadmin) {
    const { data: access } = await sb.from('admin_client_access').select('client_id').eq('admin_user_id', currentAdmin.id);
    currentAdmin.allowedClientIds = (access || []).map(a => a.client_id);
  }
}
function adminCan(permKey) {
  if (!currentAdmin) return false;
  if (currentAdmin.is_superadmin) return true;
  return !!(currentAdmin.permissions && currentAdmin.permissions[permKey]);
}

/* ---------------- Data loading ---------------- */
async function loadClients() {
  const { data } = await sb.from('clients').select('*, devices(count)').order('name');
  let all = data || [];
  if (currentAdmin && !currentAdmin.is_superadmin) {
    all = all.filter(c => (currentAdmin.allowedClientIds || []).includes(c.id));
  }
  clients = all;
  if (!selectedClientId && clients.length) selectedClientId = clients[0].id;
}
async function loadClientDetail(clientId) {
  const [devicesRes, gamesRes, clientGamesRes, sessionsRes, allSessionsRes, eventsRes, defisRes, adsRes] = await Promise.all([
    sb.from('devices').select('*').eq('client_id', clientId).order('created_at'),
    sb.from('games').select('*').order('name'),
    sb.from('client_games').select('*').eq('client_id', clientId),
    sb.from('sessions').select('*').eq('client_id', clientId).order('played_at', { ascending: false }).limit(50),
    sb.from('sessions').select('*').eq('client_id', clientId).order('played_at', { ascending: true }).limit(2000),
    sb.from('events').select('*').eq('client_id', clientId).order('start_date', { ascending: false }),
    sb.from('defis').select('*').eq('client_id', clientId).order('start_date', { ascending: false }),
    sb.from('client_ads').select('*').eq('client_id', clientId).order('created_at', { ascending: false }),
  ]);
  devices = devicesRes.data || [];
  games = gamesRes.data || [];
  clientGames = clientGamesRes.data || [];
  sessions = sessionsRes.data || [];
  allSessions = allSessionsRes.data || [];
  events = eventsRes.data || [];
  defis = defisRes.data || [];
  clientAds = adsRes.data || [];
}
async function loadChallenges() {
  const { data } = await sb.from('challenges')
    .select('*, challenge_participants(client_id, clients(id, name))')
    .order('start_date', { ascending: false });
  challenges = data || [];
}
async function uploadBanner(file) {
  const path = `${crypto.randomUUID()}-${file.name}`;
  const { error } = await sb.storage.from('banners').upload(path, file);
  if (error) throw error;
  const { data } = sb.storage.from('banners').getPublicUrl(path);
  return data.publicUrl;
}

/* ---------------- Render shell ---------------- */
async function render() {
  if (!session) { renderLogin(); return; }
  if (!clients.length) await loadClients();
  if (topView === 'clients') {
    if (viewMode === 'client' && selectedClientId) await loadClientDetail(selectedClientId);
    if (viewMode === 'challenges') await loadChallenges();
  }

  const allTopTabs = [
    { key: 'clients', label: 'Clients', icon: 'users', always: true },
    { key: 'crm', label: 'CRM', icon: 'briefcase', perm: 'menu_crm' },
    { key: 'globalstats', label: 'Statistiques', icon: 'bar-chart-3', perm: 'menu_globalstats' },
    { key: 'access', label: 'Accès', icon: 'shield', superadminOnly: true },
    { key: 'calendar', label: 'Calendrier', icon: 'calendar-days', perm: 'menu_calendar' },
  ];
  const topTabs = allTopTabs.filter(t => t.always || (t.superadminOnly ? currentAdmin?.is_superadmin : adminCan(t.perm)));
  if (topTabs.every(t => t.key !== topView)) topView = 'clients';

/* ---------------- Statistiques ---------------- */
let statsFilters = { start: null, end: null, deviceId: '' };
function defaultStatsRange() {
  const end = new Date();
  const start = new Date(); start.setDate(start.getDate() - 29);
  return { start: start.toISOString().slice(0, 10), end: end.toISOString().slice(0, 10) };
}
function enumerateDays(start, end) {
  const days = [];
  let d = new Date(start + 'T00:00:00');
  const last = new Date(end + 'T00:00:00');
  while (d <= last) { days.push(d.toISOString().slice(0, 10)); d.setDate(d.getDate() + 1); }
  return days;
}

/* ---------------- Rapport complet (PDF via impression navigateur) ---------------- */
function computeScopeStats(sessionsSubset, dayList) {
  const countsByDay = dayList.map(d => sessionsSubset.filter(s => s.played_at.slice(0, 10) === d).length);
  const indexSessions = sessionsSubset.filter(s => s.game_id === 'indextest');
  const avgIndexByDay = dayList.map(d => {
    const rows = indexSessions.filter(s => s.played_at.slice(0, 10) === d);
    return rows.length ? Math.round(rows.reduce((a, s) => a + s.score, 0) / rows.length) : null;
  });
  const chunk = Math.max(1, Math.round(dayList.length * 0.15));
  const earlyDays = new Set(dayList.slice(0, chunk));
  const lateDays = new Set(dayList.slice(-chunk));
  const earlyRows = indexSessions.filter(s => earlyDays.has(s.played_at.slice(0, 10)));
  const lateRows = indexSessions.filter(s => lateDays.has(s.played_at.slice(0, 10)));
  const earlyAvg = earlyRows.length ? Math.round(earlyRows.reduce((a, s) => a + s.score, 0) / earlyRows.length) : null;
  const lateAvg = lateRows.length ? Math.round(lateRows.reduce((a, s) => a + s.score, 0) / lateRows.length) : null;
  const delta = (earlyAvg != null && lateAvg != null) ? lateAvg - earlyAvg : null;
  const countByGame = {};
  sessionsSubset.forEach(s => { countByGame[s.game_id] = (countByGame[s.game_id] || 0) + 1; });
  return { countsByDay, avgIndexByDay, earlyAvg, lateAvg, delta, countByGame, total: sessionsSubset.length };
}

function computeQuestionnaireSummary(sessionsSubset, responses) {
  const idsInScope = new Set(sessionsSubset.map(s => s.id));
  const sessionMap = {}; sessionsSubset.forEach(s => { sessionMap[s.id] = s; });
  const scoped = responses.filter(r => idsInScope.has(r.session_id));
  const byQuestionnaire = {};
  scoped.forEach(r => {
    const q = r.questions; if (!q) return;
    const qnId = q.questionnaire_id;
    if (!byQuestionnaire[qnId]) byQuestionnaire[qnId] = { title: q.questionnaires?.title || '(sans titre)', sessions: new Set(), questions: {} };
    byQuestionnaire[qnId].sessions.add(r.session_id);
    if (!byQuestionnaire[qnId].questions[q.id]) byQuestionnaire[qnId].questions[q.id] = { text: q.question_text, options: {} };
    const opts = byQuestionnaire[qnId].questions[q.id].options;
    const optId = r.option_id;
    if (!opts[optId]) opts[optId] = { label: r.question_options?.option_text || '—', count: 0, indexScores: [] };
    opts[optId].count++;
    const s = sessionMap[r.session_id];
    if (s && s.game_id === 'indextest') opts[optId].indexScores.push(s.score);
  });
  return byQuestionnaire;
}

function scopeSectionHTML(title, stats, byQuestionnaire, dayList) {
  const gameLabels = Object.keys(stats.countByGame).map(id => games.find(g => g.id === id)?.name || id);
  const canvasSuffix = title.replace(/[^a-zA-Z0-9]/g, '');
  const qnHTML = Object.keys(byQuestionnaire).length ? Object.values(byQuestionnaire).map(qn => `
    <h4 style="margin:14px 0 6px;">${qn.title} — ${qn.sessions.size} rempli(s)</h4>
    ${Object.values(qn.questions).map(q => {
      const total = Object.values(q.options).reduce((a, b) => a + b.count, 0);
      return `
        <div style="margin-bottom:10px;">
          <div style="font-weight:700;font-size:12.5px;">${q.text}</div>
          ${Object.values(q.options).sort((a, b) => b.count - a.count).map(o => {
            const pct = Math.round((o.count / total) * 100);
            const avgIdx = o.indexScores.length ? Math.round(o.indexScores.reduce((a, b) => a + b, 0) / o.indexScores.length) : null;
            return `<div style="font-size:11.5px;margin:3px 0;">• ${o.label} : ${o.count} (${pct}%)${avgIdx != null ? ` — Index moyen : ${avgIdx}` : ''}</div>`;
          }).join('')}
        </div>
      `;
    }).join('')}
  `).join('') : '<p style="font-size:12px;color:#888;">Aucune réponse sur cette période pour ce périmètre.</p>';

  return `
    <div class="report-section">
      <h2>${title}</h2>
      <div class="report-stats-row">
        <div class="report-stat-box"><div class="n">${stats.total}</div><div class="l">Parties jouées</div></div>
        <div class="report-stat-box"><div class="n">${stats.earlyAvg ?? '—'}</div><div class="l">Index moy. début période</div></div>
        <div class="report-stat-box"><div class="n">${stats.lateAvg ?? '—'}</div><div class="l">Index moy. fin période</div></div>
        <div class="report-stat-box"><div class="n">${stats.delta != null ? (stats.delta > 0 ? '+' : '') + stats.delta : '—'}</div><div class="l">Évolution</div></div>
      </div>
      <div class="report-chart"><canvas id="chartDay${canvasSuffix}"></canvas></div>
      <div class="report-chart"><canvas id="chartIdx${canvasSuffix}"></canvas></div>
      <div class="report-chart" style="max-width:320px;margin:0 auto 20px;"><canvas id="chartGame${canvasSuffix}"></canvas></div>
      <h3>Questionnaires</h3>
      ${qnHTML}
    </div>
  `;
}

    setTimeout(() => {

        new reportWindow.Chart(reportWindow.document.getElementById('chartDay' + s.key), {
          type: 'bar',

        });
        new reportWindow.Chart(reportWindow.document.getElementById('chartIdx' + s.key), {
          type: 'line',
          data: { labels: s.dayList.map(d => d.slice(5)), datasets: [{ data: s.stats.avgIndexByDay, spanGaps: true, borderColor: '#c86dd7', fill: false }] },
          options: { responsive: false, animation: false, scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false }, title: { display: true, text: 'PandaFit Index moyen par jour' } } }
        });
        new reportWindow.Chart(reportWindow.document.getElementById('chartGame' + s.key), {
          type: 'doughnut',
          data: { labels: gameLabels, datasets: [{ data: Object.values(s.stats.countByGame), backgroundColor: ['#43cea2', '#185a9d', '#c86dd7', '#e6374e', '#e0a83e', '#3023ae'] }] },
          options: { responsive: false, plugins: { title: { display: true, text: 'Répartition par jeu' } } }

}

async function renderStatsTab() {
  const el = document.getElementById('tabContent');
  if (!statsFilters.start) Object.assign(statsFilters, defaultStatsRange());
  el.innerHTML = '<p class="empty">Chargement...</p>';

  let query = sb.from('sessions').select('*').eq('client_id', selectedClientId)
    .gte('played_at', statsFilters.start)
    .lte('played_at', statsFilters.end + 'T23:59:59');
  if (statsFilters.deviceId) query = query.eq('device_id', statsFilters.deviceId);
  const { data: sessionsData } = await query;
  const filteredSessions = sessionsData || [];
  const sessionMap = {}; filteredSessions.forEach(s => { sessionMap[s.id] = s; });

  const dayList = enumerateDays(statsFilters.start, statsFilters.end);

  // ---- Section 1 : nombre de jeux/Index par jour ----
  const countsByDay = dayList.map(d => filteredSessions.filter(s => s.played_at.slice(0, 10) === d).length);

  // ---- Section 2 : PandaFit Index moyen par jour + delta début/fin ----
  const indexSessions = filteredSessions.filter(s => s.game_id === 'indextest');
  const avgIndexByDay = dayList.map(d => {
    const rows = indexSessions.filter(s => s.played_at.slice(0, 10) === d);
    return rows.length ? Math.round(rows.reduce((a, s) => a + s.score, 0) / rows.length) : null;
  });
  const chunk = Math.max(1, Math.round(dayList.length * 0.15));
  const earlyDays = new Set(dayList.slice(0, chunk));
  const lateDays = new Set(dayList.slice(-chunk));
  const earlyRows = indexSessions.filter(s => earlyDays.has(s.played_at.slice(0, 10)));
  const lateRows = indexSessions.filter(s => lateDays.has(s.played_at.slice(0, 10)));
  const earlyAvg = earlyRows.length ? Math.round(earlyRows.reduce((a, s) => a + s.score, 0) / earlyRows.length) : null;
  const lateAvg = lateRows.length ? Math.round(lateRows.reduce((a, s) => a + s.score, 0) / lateRows.length) : null;
  const delta = (earlyAvg != null && lateAvg != null) ? lateAvg - earlyAvg : null;

  // ---- Section 3 : répartition par jeu ----
  const countByGame = {};
  filteredSessions.forEach(s => { countByGame[s.game_id] = (countByGame[s.game_id] || 0) + 1; });

  // ---- Section 4 : questionnaires ----
  const sessionIds = filteredSessions.map(s => s.id);
  let responses = [];
  if (sessionIds.length) {
    const { data } = await sb.from('question_responses')
      .select('session_id, option_id, questions(id,question_text,questionnaire_id,questionnaires(title)), question_options(id,option_text)')
      .in('session_id', sessionIds);
    responses = data || [];
  }
  const byQuestionnaire = {};
  responses.forEach(r => {
    const q = r.questions; if (!q) return;
    const qnId = q.questionnaire_id;
    if (!byQuestionnaire[qnId]) byQuestionnaire[qnId] = { title: q.questionnaires?.title || '(sans titre)', sessions: new Set(), questions: {} };
    byQuestionnaire[qnId].sessions.add(r.session_id);
    if (!byQuestionnaire[qnId].questions[q.id]) byQuestionnaire[qnId].questions[q.id] = { text: q.question_text, options: {} };
    const optId = r.option_id;
    const opts = byQuestionnaire[qnId].questions[q.id].options;
    if (!opts[optId]) opts[optId] = { label: r.question_options?.option_text || '—', count: 0, sessionIds: [] };
    opts[optId].count++;
    opts[optId].sessionIds.push(r.session_id);
  });

  // ---- Rendu ----
  const deviceOptions = devices.map(d => `<option value="${d.id}" ${statsFilters.deviceId === d.id ? 'selected' : ''}>${d.name}</option>`).join('');

  el.innerHTML = `
    <div class="card">
      <h3>Filtres (cumulables)</h3>
      <div class="form-grid" style="grid-template-columns:1fr 1fr 1fr;">
        <div>
          <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:4px;">Du</div>
          <input id="statsStart" type="date" value="${statsFilters.start}">
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:4px;">Au</div>
          <input id="statsEnd" type="date" value="${statsFilters.end}">
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--text-dim);margin-bottom:4px;">Tablette</div>
          <select id="statsDevice" style="width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--border);background:#17132a;color:var(--text);">
            <option value="">Toutes les tablettes</option>
            ${deviceOptions}
          </select>
        </div>
      </div>
      <button class="btn-ghost" id="btnFullReport" style="width:auto;margin-top:14px;">📄 Générer le rapport complet (PDF)</button>
    </div>

    <div class="card">
      <h3>Nombre de jeux / PandaFit Index par jour</h3>
      <div class="chart-wrap"><canvas id="chartByDay"></canvas></div>
    </div>

    <div class="card">
      <h3>PandaFit Index moyen par jour</h3>
      <div class="chart-wrap"><canvas id="chartIndexAvg"></canvas></div>
      <div class="stat-grid" style="grid-template-columns:1fr 1fr 1fr;margin-top:14px;margin-bottom:0;">
        <div class="stat-box"><div class="n">${earlyAvg ?? '—'}</div><div class="l">Moyenne 15% début</div></div>
        <div class="stat-box"><div class="n">${lateAvg ?? '—'}</div><div class="l">Moyenne 15% fin</div></div>
        <div class="stat-box"><div class="n" style="color:${delta > 0 ? '#43cea2' : delta < 0 ? '#e6374e' : 'var(--text)'};">${delta != null ? (delta > 0 ? '+' : '') + delta : '—'}</div><div class="l">Évolution</div></div>
      </div>
    </div>

    <div class="card">
      <h3>Répartition par jeu</h3>
      <div class="chart-wrap"><canvas id="chartByGame"></canvas></div>
    </div>

    <div class="menu-section-title" style="margin-top:22px;">Résumé des questionnaires</div>
    ${Object.keys(byQuestionnaire).length ? Object.values(byQuestionnaire).map((qn, qni) => `
      <div class="card">
        <h3>${qn.title}</h3>
        <p style="font-size:12.5px;color:var(--text-dim);margin:-6px 0 14px;">${qn.sessions.size} questionnaire${qn.sessions.size > 1 ? 's' : ''} rempli${qn.sessions.size > 1 ? 's' : ''} (au moins une réponse)</p>
        ${Object.values(qn.questions).map((q, i) => {
          const total = Object.values(q.options).reduce((a, b) => a + b.count, 0);
          return `
            <div style="margin-bottom:16px;">
              <div style="font-weight:700;font-size:13.5px;margin-bottom:8px;">${q.text}</div>
              ${Object.entries(q.options).sort((a, b) => b[1].count - a[1].count).map(([optId, o]) => {
                const pct = Math.round((o.count / total) * 100);
                return `
                  <div class="qn-option-row" data-option-id="${optId}" data-session-ids="${o.sessionIds.join(',')}" style="cursor:pointer;margin-bottom:8px;">
                    <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;">
                      <span>${o.label}</span><span style="color:var(--text-dim);">${o.count} (${pct}%)</span>
                    </div>
                    <div style="background:var(--panel-hi);border-radius:100px;height:8px;overflow:hidden;">
                      <div style="width:${pct}%;height:100%;background:linear-gradient(90deg,#43cea2,#185a9d);"></div>
                    </div>
                    <div class="qn-option-result" style="font-size:11.5px;color:var(--accent);margin-top:4px;display:none;"></div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        }).join('')}
      </div>
    `).join('') : '<div class="card"><p class="empty">Aucune réponse enregistrée sur cette période/tablette.</p></div>'}
  `;

  document.getElementById('statsStart').addEventListener('change', (e) => { statsFilters.start = e.target.value; renderStatsTab(); });
  document.getElementById('statsEnd').addEventListener('change', (e) => { statsFilters.end = e.target.value; renderStatsTab(); });
  document.getElementById('statsDevice').addEventListener('change', (e) => { statsFilters.deviceId = e.target.value; renderStatsTab(); });
  document.getElementById('btnFullReport').addEventListener('click', () => generateFullReport());

  el.querySelectorAll('.qn-option-row').forEach(row => {
    row.addEventListener('click', async () => {
      const resultEl = row.querySelector('.qn-option-result');
      const sids = row.dataset.sessionIds.split(',').filter(Boolean);
      if (resultEl.style.display === 'block') { resultEl.style.display = 'none'; return; }
      resultEl.style.display = 'block';
      resultEl.textContent = 'Calcul...';

      // Cas 1 : le questionnaire était posé juste avant l'Index lui-même —
      // la réponse et le score viennent de la même partie, pas besoin d'identifier qui que ce soit.
      const directIndexScores = sids
        .map(sid => sessionMap[sid])
        .filter(s => s && s.game_id === 'indextest')
        .map(s => s.score);

      if (directIndexScores.length) {
        const avg = Math.round(directIndexScores.reduce((a, s) => a + s, 0) / directIndexScores.length);
        resultEl.textContent = `PandaFit Index moyen pour cette réponse : ${avg} (basé sur ${directIndexScores.length} test${directIndexScores.length > 1 ? 's' : ''} joué${directIndexScores.length > 1 ? 's' : ''} juste après)`;
        return;
      }

      // Cas 2 : le questionnaire était posé avant un autre jeu — il faut alors
      // une personne identifiée (QR scanné) pour retrouver SON PandaFit Index, joué à un autre moment.
      const employeeIds = [...new Set(sids.map(sid => sessionMap[sid]?.employee_id).filter(Boolean))];
      if (!employeeIds.length) { resultEl.textContent = "Index moyen : pas assez de personnes identifiées (QR non scanné) — ce questionnaire n'est pas posé avant l'Index, donc il faut une identification pour relier les deux."; return; }
      const { data } = await sb.from('sessions').select('score')
        .eq('game_id', 'indextest').in('employee_id', employeeIds)
        .gte('played_at', statsFilters.start).lte('played_at', statsFilters.end + 'T23:59:59');
      const rows = data || [];
      if (!rows.length) { resultEl.textContent = "Index moyen : aucune donnée PandaFit Index pour ce groupe sur la période."; return; }
      const avg = Math.round(rows.reduce((a, r) => a + r.score, 0) / rows.length);
      resultEl.textContent = `PandaFit Index moyen pour cette réponse : ${avg} (basé sur ${rows.length} test${rows.length > 1 ? 's' : ''}, ${employeeIds.length} personne${employeeIds.length > 1 ? 's' : ''} identifiée${employeeIds.length > 1 ? 's' : ''})`;
    });
  });

  if (charts.byDay) charts.byDay.destroy();
  if (charts.byGame) charts.byGame.destroy();
  if (charts.indexAvg) charts.indexAvg.destroy();

  charts.byDay = new Chart(document.getElementById('chartByDay'), {
    type: 'bar',
    data: { labels: dayList.map(d => d.slice(5)), datasets: [{ data: countsByDay, backgroundColor: '#43cea2', borderRadius: 4 }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { color: '#9992ad' } }, x: { ticks: { color: '#9992ad', maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } } } }
  });

  charts.indexAvg = new Chart(document.getElementById('chartIndexAvg'), {
    type: 'line',
    data: { labels: dayList.map(d => d.slice(5)), datasets: [{ data: avgIndexByDay, spanGaps: true, borderColor: '#c86dd7', backgroundColor: 'rgba(200,109,215,0.15)', fill: true, tension: 0.3 }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100, ticks: { color: '#9992ad' } }, x: { ticks: { color: '#9992ad', maxRotation: 0, autoSkip: true, maxTicksLimit: 10 } } } }
  });

  const gameLabels = Object.keys(countByGame).map(id => games.find(g => g.id === id)?.name || id);
  charts.byGame = new Chart(document.getElementById('chartByGame'), {
    type: 'doughnut',
    data: { labels: gameLabels, datasets: [{ data: Object.values(countByGame), backgroundColor: ['#43cea2', '#185a9d', '#c86dd7', '#e6374e', '#e0a83e', '#3023ae'] }] },
    options: { plugins: { legend: { position: 'right', labels: { color: '#f4f2fa' } } } }
  });
}

/* ---------------- Défis (internes à un client) ---------------- */
function computeDefiStandings(defi) {
  const relevant = allSessions.filter(s =>
    s.game_id === defi.game_id &&
    s.played_at.slice(0, 10) >= defi.start_date &&
    s.played_at.slice(0, 10) <= defi.end_date
  );
  if (defi.mode === 'tablet_vs_tablet') {
    const byDevice = {};
    relevant.forEach(s => { byDevice[s.device_id] = (byDevice[s.device_id] || 0) + (s.score || 0); });
    return Object.entries(byDevice)
      .map(([deviceId, total]) => ({ name: devices.find(d => d.id === deviceId)?.name || 'Tablette inconnue', total }))
      .sort((a, b) => b.total - a.total);
  }
  const total = relevant.reduce((a, s) => a + (s.score || 0), 0);
  return [{ name: 'Total entreprise', total }];
}

/* ---------------- Challenges (inter-clients, vue globale) ---------------- */
async function fetchChallengeTotals(challenge) {
  const participantIds = (challenge.challenge_participants || []).map(p => p.client_id);
  if (!participantIds.length) return [];
  const { data } = await sb.from('sessions')
    .select('client_id, score, played_at')
    .in('client_id', participantIds)
    .eq('game_id', challenge.game_id)
    .gte('played_at', challenge.start_date)
    .lte('played_at', challenge.end_date + 'T23:59:59');
  const totals = {};
  (data || []).forEach(s => { totals[s.client_id] = (totals[s.client_id] || 0) + (s.score || 0); });
  return participantIds
    .map(cid => ({ name: challenge.challenge_participants.find(p => p.client_id === cid)?.clients?.name || '—', total: totals[cid] || 0 }))
    .sort((a, b) => b.total - a.total);
}

const GAME_THEME_ADMIN = {
  migros: 'linear-gradient(135deg,#ff7a00,#e05a00)',
  skiprev: 'linear-gradient(135deg,#e8112d,#0a3d91)',
  thezone: 'linear-gradient(135deg,#43cea2,#185a9d)',
  distance: 'linear-gradient(135deg,#43cea2,#185a9d)',
  base: 'linear-gradient(135deg,#43cea2,#185a9d)',
  cross: 'linear-gradient(135deg,#43cea2,#185a9d)',
};
const GAME_ICON_ADMIN = {
  distance: 'footprints', base: 'zap', thezone: 'circle-dot',
  cross: 'crosshair', migros: 'shopping-cart', skiprev: 'mountain-snow',
};

async function loadActiveTabletMenuItems(clientId) {
  const today = new Date().toISOString().slice(0, 10);
  const [defisRes, chPartRes, eventsRes] = await Promise.all([
    sb.from('defis').select('*').eq('client_id', clientId).lte('start_date', today).gte('end_date', today).order('sort_order'),
    sb.from('challenge_participants').select('challenge_id').eq('client_id', clientId),
    sb.from('events').select('*').eq('client_id', clientId).lte('start_date', today).gte('end_date', today).order('sort_order'),
  ]);
  const activeDefis = defisRes.data || [];
  const challengeIds = (chPartRes.data || []).map(p => p.challenge_id);
  let activeChallenges = [];
  if (challengeIds.length) {
    const { data } = await sb.from('challenges')
      .select('*, challenge_participants(client_id, clients(name))')
      .in('id', challengeIds).lte('start_date', today).gte('end_date', today).order('sort_order');
    activeChallenges = data || [];
  }
  return { activeDefis, activeChallenges, activeEvents: eventsRes.data || [] };
}

function thumbCardHTML(item) {
  const dimmed = item.visible === false ? 'opacity:0.45;' : '';
  const actions = `
    <div class="tc-actions">
      <button class="tc-action-btn" data-toggle-visible="${item.type}:${item.id}" title="${item.visible === false ? 'Réafficher' : 'Masquer'}">
        <i data-lucide="${item.visible === false ? 'eye-off' : 'eye'}"></i>
      </button>
      <label class="tc-action-btn" title="Changer la photo">
        <i data-lucide="image-plus"></i>
        <input type="file" accept="image/*" style="display:none;" data-upload-photo="${item.type}:${item.id}">
      </label>
    </div>
  `;

  if (item.type === 'index') {
    return `
      <div class="thumb-card" style="${item.data?.image_url ? `background-image:url('${item.data.image_url}');` : 'background:linear-gradient(135deg,#c86dd7,#3023ae);'}${dimmed}">
        <div class="tc-badge"><i data-lucide="activity"></i> Index</div>
        <i data-lucide="grip-vertical" class="tc-drag"></i>
        ${actions}
        <div class="tc-content"><div class="tc-title">PandaFit Index</div></div>
      </div>`;
  }
  if (item.type === 'game') {
    const bg = item.data.image_url ? `background-image:url('${item.data.image_url}');` : `background:${GAME_THEME_ADMIN[item.data.id] || GAME_THEME_ADMIN.thezone};`;
    return `
      <div class="thumb-card" style="${bg}${dimmed}">
        <div class="tc-badge"><i data-lucide="${GAME_ICON_ADMIN[item.data.id] || 'gamepad-2'}"></i> Jeu</div>
        <i data-lucide="grip-vertical" class="tc-drag"></i>
        ${actions}
        <div class="tc-content"><div class="tc-title">${item.data.name}</div></div>
      </div>`;
  }
  if (item.type === 'defi' || item.type === 'challenge' || item.type === 'event') {
    const gradients = { defi: 'linear-gradient(135deg,#43cea2,#185a9d)', challenge: 'linear-gradient(135deg,#c86dd7,#3023ae)', event: 'linear-gradient(135deg,#185a9d,#0a3d91)' };
    const icons = { defi: 'flame', challenge: 'trophy', event: 'calendar' };
    const labels = { defi: 'Défi', challenge: 'Challenge', event: 'Événement' };
    const bg = item.data.image_url ? `background-image:url('${item.data.image_url}');` : `background:${gradients[item.type]};`;
    return `
      <div class="thumb-card" style="${bg}${dimmed}">
        <div class="tc-badge"><i data-lucide="${icons[item.type]}"></i> ${labels[item.type]}</div>
        <i data-lucide="grip-vertical" class="tc-drag"></i>
        ${actions}
        <div class="tc-content"><div class="tc-title">${item.data.title}</div></div>
      </div>`;
  }
  return '';
}

async function renderTabletMenuTab() {
  const el = document.getElementById('tabContent');
  el.innerHTML = '<p class="empty">Chargement...</p>';
  const client = clients.find(c => c.id === selectedClientId);
  const { activeDefis, activeChallenges, activeEvents } = await loadActiveTabletMenuItems(selectedClientId);
  const allGames = clientGames.filter(cg => cg.game_id !== 'indextest').map(cg => {
    const catalogRow = games.find(g => g.id === cg.game_id) || { id: cg.game_id, name: cg.game_id };
    return {
      type: 'game', sort_order: cg.sort_order || 0, visible: cg.enabled,
      data: { ...catalogRow, image_url: cg.image_url || catalogRow.image_url },
      id: cg.game_id,
    };
  });

  const indexCatalogRow = games.find(g => g.id === 'indextest');

  let stack = [
    { type: 'index', sort_order: client.index_sort_order ?? -1000, id: 'index', visible: client.show_index_banner, data: { image_url: client.index_image_url || indexCatalogRow?.image_url } },
    ...activeDefis.map(d => ({ type: 'defi', sort_order: d.sort_order || 0, data: d, id: d.id, visible: d.is_active })),
    ...activeChallenges.map(c => ({ type: 'challenge', sort_order: c.sort_order || 0, data: c, id: c.id, visible: c.is_active })),
    ...allGames,
  ].sort((a, b) => a.sort_order - b.sort_order);

  let eventsList = activeEvents.map(ev => ({ type: 'event', sort_order: ev.sort_order || 0, data: ev, id: ev.id, visible: ev.is_active }))
    .sort((a, b) => a.sort_order - b.sort_order);

  function render() {
    el.innerHTML = `
      <p class="section-sub">Tout ce qui est actif pour ce client s'affiche ici automatiquement. Glisse une vignette pour changer son ordre, masque/réaffiche-la avec l'œil, ou change sa photo avec l'icône image.</p>
      <div class="menu-section-title">Contenu principal (empilé)</div>
      <div class="menu-stack" id="mainStack">
        ${stack.length ? stack.map(thumbCardHTML).join('') : '<p class="empty">Rien pour l\'instant.</p>'}
      </div>
      <div class="menu-section-title" style="margin-top:22px;">Événements (défilent toutes les 4s sur la tablette)</div>
      <div class="menu-row" id="eventsRow">
        ${eventsList.length ? eventsList.map(thumbCardHTML).join('') : '<p class="empty">Aucun événement actif.</p>'}
      </div>
    `;
    wireDrag(document.getElementById('mainStack'), stack, persistStack);
    wireDrag(document.getElementById('eventsRow'), eventsList, persistEvents);
    wireActions(document.getElementById('mainStack'));
    wireActions(document.getElementById('eventsRow'));
  }

  function findItem(type, id) {
    return [...stack, ...eventsList].find(it => it.type === type && String(it.id) === String(id));
  }

  async function toggleVisible(type, id) {
    const item = findItem(type, id);
    if (!item) return;
    const newVisible = !item.visible;
    if (type === 'index') await sb.from('clients').update({ show_index_banner: newVisible }).eq('id', selectedClientId);
    else if (type === 'game') await sb.from('client_games').update({ enabled: newVisible }).eq('client_id', selectedClientId).eq('game_id', id);
    else if (type === 'defi') await sb.from('defis').update({ is_active: newVisible }).eq('id', id);
    else if (type === 'challenge') await sb.from('challenges').update({ is_active: newVisible }).eq('id', id);
    else if (type === 'event') await sb.from('events').update({ is_active: newVisible }).eq('id', id);
    await loadClientDetail(selectedClientId);
    await loadClients();
    renderTabletMenuTab();
  }

  async function uploadPhoto(type, id, file) {
    let image_url;
    try { image_url = await uploadBanner(file); } catch (e) { alert("Erreur d'upload : " + e.message); return; }
    let result;
    if (type === 'game') result = await sb.from('client_games').update({ image_url }).eq('client_id', selectedClientId).eq('game_id', id);
    else if (type === 'defi') result = await sb.from('defis').update({ image_url }).eq('id', id);
    else if (type === 'challenge') result = await sb.from('challenges').update({ image_url }).eq('id', id);
    else if (type === 'event') result = await sb.from('events').update({ image_url }).eq('id', id);
    else if (type === 'index') result = await sb.from('clients').update({ index_image_url: image_url }).eq('id', selectedClientId);
    if (result?.error) { alert("Erreur en enregistrant l'image : " + result.error.message); return; }
    await loadClientDetail(selectedClientId);
    await loadClients();
    renderTabletMenuTab();
  }

  function wireActions(container) {
    if (!container) return;
    container.querySelectorAll('[data-toggle-visible]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        const [type, id] = btn.dataset.toggleVisible.split(':');
        toggleVisible(type, id);
      });
    });
    container.querySelectorAll('[data-upload-photo]').forEach(input => {
      input.addEventListener('click', (e) => e.stopPropagation());
      input.addEventListener('change', (e) => {
        const [type, id] = input.dataset.uploadPhoto.split(':');
        const file = e.target.files[0];
        if (file) uploadPhoto(type, id, file);
      });
    });
  }

  function wireDrag(container, items, persistFn) {
    let dragSrcIndex = null;
    container.querySelectorAll('.thumb-card').forEach((card, idx) => {
      card.draggable = true;
      card.addEventListener('dragstart', () => { dragSrcIndex = idx; card.classList.add('dragging'); });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      card.addEventListener('dragover', (e) => e.preventDefault());
      card.addEventListener('drop', async (e) => {
        e.preventDefault();
        if (dragSrcIndex === null || dragSrcIndex === idx) return;
        const moved = items.splice(dragSrcIndex, 1)[0];
        items.splice(idx, 0, moved);
        await persistFn(items);
        render();
      });
    });
  }

  async function persistStack(items) {
    await Promise.all(items.map((item, i) => {
      if (item.type === 'index') return sb.from('clients').update({ index_sort_order: i }).eq('id', selectedClientId);
      if (item.type === 'game') return sb.from('client_games').update({ sort_order: i }).eq('client_id', selectedClientId).eq('game_id', item.id);
      if (item.type === 'defi') return sb.from('defis').update({ sort_order: i }).eq('id', item.id);
      if (item.type === 'challenge') return sb.from('challenges').update({ sort_order: i }).eq('id', item.id);
    }));
    await loadClientDetail(selectedClientId);
    await loadClients();
  }
  async function persistEvents(items) {
    await Promise.all(items.map((item, i) => sb.from('events').update({ sort_order: i }).eq('id', item.id)));
    await loadClientDetail(selectedClientId);
  }

  render();
}

      renderAdsTab();

        <tr><th>Photo</th><th>Identifiant</th><th>Nom</th><th>Description</th><th></th></tr>
        ${allGames.map(g => `
          <tr>
            <td>${g.image_url ? `<img src="${g.image_url}" style="width:44px;height:44px;object-fit:cover;border-radius:8px;">` : '<span class="badge">Aucune</span>'}</td>
            <td><span class="key-chip">${g.id}</span></td>
            <td>${g.name}</td>
            <td style="color:var(--text-dim);">${g.description || ''}</td>
            <td><button class="btn-ghost" data-edit-game="${g.id}">Modifier</button></td>
          </tr>
        `).join('')}
      </table>

  `;

    renderContentView();
  });
  main.querySelectorAll('[data-edit-game]').forEach(btn => {
    btn.addEventListener('click', () => { editingGameId = btn.dataset.editGame; renderContentView(); });

}

/* ---------------- Questionnaires ---------------- */
let questionnaires = [];
let editingQuestionnaireId = null;

async function loadQuestionnaires(clientId) {
  const { data } = await sb.from('questionnaires').select('*').eq('client_id', clientId).order('created_at', { ascending: false });
  questionnaires = data || [];
}
async function loadQuestionnaireDetail(qId) {
  const { data } = await sb.from('questions')
    .select('*, question_options(*)')
    .eq('questionnaire_id', qId)
    .order('sort_order');
  (data || []).forEach(q => q.question_options.sort((a, b) => a.sort_order - b.sort_order));
  return data || [];
}

async function renderQuestionnairesTab() {
  await loadQuestionnaires(selectedClientId);
  const el = document.getElementById('tabContent');
  if (editingQuestionnaireId) { await renderQuestionnaireEditor(el); return; }

  el.innerHTML = `
    <div class="card">
      <h3>Nouveau questionnaire</h3>
      <div class="inline-form">
        <input id="qnTitle" placeholder="Titre (ex: Ressenti du jour)">
        <button class="btn-primary" id="btnAddQuestionnaire" style="width:auto;">Créer</button>
      </div>
    </div>
    <div class="card">
      <h3>Questionnaires de ce client</h3>
      ${questionnaires.length ? questionnaires.map(q => `
        <div class="event-item">
          <div class="title-row">
            <b>${q.title}</b>
            <span style="display:flex;gap:6px;">
              <button class="btn-ghost" data-edit-qn="${q.id}">Modifier les questions</button>
              <button class="btn-destructive" data-del-qn="${q.id}">Supprimer</button>
            </span>
          </div>
        </div>
      `).join('') : '<div class="empty">Aucun questionnaire pour ce client.</div>'}
    </div>
  `;
  document.getElementById('btnAddQuestionnaire').addEventListener('click', async () => {
    const title = document.getElementById('qnTitle').value.trim();
    if (!title) return;
    const { error } = await sb.from('questionnaires').insert({ client_id: selectedClientId, title });
    if (error) { alert('Erreur : ' + error.message); return; }
    renderQuestionnairesTab();
  });
  el.querySelectorAll('[data-edit-qn]').forEach(btn => {
    btn.addEventListener('click', () => { editingQuestionnaireId = btn.dataset.editQn; renderQuestionnairesTab(); });
  });
  el.querySelectorAll('[data-del-qn]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Supprimer ce questionnaire (et ses questions) ?')) return;
      await sb.from('questionnaires').delete().eq('id', btn.dataset.delQn);
      renderQuestionnairesTab();
    });
  });
}

async function renderQuestionnaireEditor(el) {
  const qn = questionnaires.find(q => q.id === editingQuestionnaireId);
  const questions = await loadQuestionnaireDetail(editingQuestionnaireId);

  el.innerHTML = `
    <button class="btn-ghost" id="btnBackToQnList" style="margin-bottom:14px;">← Retour aux questionnaires</button>
    <div class="section-title" style="font-size:17px;">${qn?.title || ''}</div>
    <div class="section-sub">Une question à la fois s'affichera sur la tablette, avec Suivant/Précédent et Valider sur la dernière.</div>
    ${questions.map((q, qi) => `
      <div class="card">
        ${i18nFieldGroup('q_' + q.id, 'question_text', 'Question', q, false)}
        <button class="btn-destructive" data-del-question="${q.id}" style="width:auto;margin-bottom:10px;">Supprimer la question</button>
        <div class="options-list" data-question-options="${q.id}">
          ${q.question_options.map(o => `
            <div style="border-top:1px solid var(--border);padding-top:8px;margin-top:8px;">
              ${i18nFieldGroup('o_' + o.id, 'option_text', 'Réponse', o, false)}
              <button class="btn-destructive" data-del-option="${o.id}" style="width:auto;">✕ Supprimer cette réponse</button>
            </div>
          `).join('')}
        </div>
        <button class="btn-ghost" data-save-question="${q.id}" style="width:auto;margin-top:10px;">Enregistrer les traductions</button>
        <button class="btn-ghost" data-add-option="${q.id}" style="width:auto;margin-top:6px;">+ Ajouter une réponse</button>
      </div>
    `).join('')}
    <div class="card">
      <h3>Nouvelle question</h3>
      <input id="newQuestionText" placeholder="Texte de la question (français)" style="margin-bottom:10px;">
      <button class="btn-primary" id="btnAddQuestion" style="width:auto;">Ajouter la question</button>
    </div>
  `;

  document.getElementById('btnBackToQnList').addEventListener('click', () => { editingQuestionnaireId = null; renderQuestionnairesTab(); });

  document.getElementById('btnAddQuestion').addEventListener('click', async () => {
    const question_text = document.getElementById('newQuestionText').value.trim();
    if (!question_text) return;
    const { error } = await sb.from('questions').insert({ questionnaire_id: editingQuestionnaireId, question_text, sort_order: questions.length });
    if (error) { alert('Erreur : ' + error.message); return; }
    renderQuestionnaireEditor(el);
  });

  el.querySelectorAll('[data-save-question]').forEach(btn => {
    btn.addEventListener('click', async () => {
      await sb.from('questions').update(readI18nField('q_' + btn.dataset.saveQuestion, 'question_text')).eq('id', btn.dataset.saveQuestion);
      const optionsContainer = el.querySelector(`[data-question-options="${btn.dataset.saveQuestion}"]`);
      const optionIds = [...optionsContainer.querySelectorAll('[data-del-option]')].map(b => b.dataset.delOption);
      await Promise.all(optionIds.map(oid => sb.from('question_options').update(readI18nField('o_' + oid, 'option_text')).eq('id', oid)));
      renderQuestionnaireEditor(el);
    });
  });
  el.querySelectorAll('[data-del-question]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Supprimer cette question et ses réponses ?')) return;
      await sb.from('questions').delete().eq('id', btn.dataset.delQuestion);
      renderQuestionnaireEditor(el);
    });
  });
  el.querySelectorAll('[data-del-option]').forEach(btn => {
    btn.addEventListener('click', async () => {
      await sb.from('question_options').delete().eq('id', btn.dataset.delOption);
      renderQuestionnaireEditor(el);
    });
  });
  el.querySelectorAll('[data-add-option]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const qId = btn.dataset.addOption;
      const q = questions.find(x => x.id === qId);
      const option_text = prompt('Texte de la réponse :');
      if (!option_text || !option_text.trim()) return;
      await sb.from('question_options').insert({ question_id: qId, option_text: option_text.trim(), sort_order: q.question_options.length });
      renderQuestionnaireEditor(el);
    });
  });
}

/* ---------------- CRM (prospects / clients / anciens clients) ---------------- */
let crmContacts = [];
let crmFilter = 'prospect'; // 'prospect' | 'client' | 'ancien' | 'factures'
function invoiceStatusBadge(status) {
  const cls = { brouillon: 'badge-brouillon', envoyee: 'badge-envoyee', payee: 'badge-payee' }[status] || 'badge';
  const label = { brouillon: 'Brouillon', envoyee: 'Envoyée', payee: 'Payée' }[status] || status;
  return `<span class="badge ${cls}">${label}</span>`;
}
let editingCrmId = null;

async function loadCrmContacts() {
  const { data } = await sb.from('crm_contacts').select('*, clients(name)').order('created_at', { ascending: false });
  crmContacts = data || [];
}

async function renderCRMView() {
  await loadCrmContacts();
  if (editingCrmId) { await renderCrmDetail(); return; }

  const main = document.getElementById('main');
  const filterCounts = {
    prospect: crmContacts.filter(c => c.status === 'prospect').length,
    client: crmContacts.filter(c => c.status === 'client').length,
    ancien: crmContacts.filter(c => c.status === 'ancien').length,
  };
  const filtered = crmContacts.filter(c => c.status === crmFilter);

  let bodyHTML;
  if (crmFilter === 'factures') {
    const { data: allInvoices } = await sb.from('invoices').select('*, crm_contacts(id, company_name)').order('issue_date', { ascending: false });
    bodyHTML = `
      <div class="card">
        ${allInvoices?.length ? `
          <table>
            <tr><th>N°</th><th>Entreprise</th><th>Date</th><th>Montant</th><th>Statut</th><th></th></tr>
            ${allInvoices.map(inv => {
              const total = (inv.line_items || []).reduce((a, li) => a + li.quantity * li.unit_price, 0);
              return `
                <tr>
                  <td><b>${inv.invoice_number}</b></td>
                  <td>${inv.crm_contacts?.company_name || '—'}</td>
                  <td>${new Date(inv.issue_date).toLocaleDateString('fr-CH')}</td>
                  <td>${total.toFixed(2)} ${inv.currency}</td>
                  <td>${invoiceStatusBadge(inv.status)}</td>
                  <td><button class="btn-ghost" data-open-contact-invoice="${inv.crm_contacts?.id || ''}">Ouvrir</button></td>
                </tr>
              `;
            }).join('')}
          </table>
        ` : '<p class="empty">Aucune facture pour l\'instant.</p>'}
      </div>
    `;
  } else {
    bodyHTML = `
      <div class="card">
        <h3>Nouveau contact</h3>
        <div class="form-grid" style="grid-template-columns:1fr 1fr;">
          <input id="crmCompany" placeholder="Nom de l'entreprise">
          <input id="crmContactName" placeholder="Nom du responsable">
          <input id="crmRole" placeholder="Poste">
          <input id="crmEmail" type="email" placeholder="Email">
          <input id="crmPhone" placeholder="Téléphone">
          <select id="crmStatus" style="padding:13px 14px;border-radius:10px;border:1px solid var(--border);background:#17132a;color:var(--text);">
            <option value="prospect">Prospect</option>
            <option value="client">Client actuel</option>
            <option value="ancien">Ancien client</option>
          </select>
        </div>
        <button class="btn-primary" id="btnAddCrm" style="width:auto;margin-top:8px;">Créer</button>
      </div>
      <div class="card">
        ${filtered.length ? `
          <table>
            <tr><th>Entreprise</th><th>Responsable</th><th>Email</th><th>Client PandaFit lié</th><th></th></tr>
            ${filtered.map(c => `
              <tr style="cursor:pointer;" data-open-crm="${c.id}">
                <td><b>${c.company_name}</b></td>
                <td>${c.contact_name || '—'}</td>
                <td>${c.email || '—'}</td>
                <td>${c.clients?.name ? `<span class="badge">${c.clients.name}</span>` : '—'}</td>
                <td><button class="btn-ghost" data-open-crm="${c.id}">Ouvrir</button></td>
              </tr>
            `).join('')}
          </table>
        ` : '<p class="empty">Aucun contact dans cette catégorie.</p>'}
      </div>
    `;
  }

  main.innerHTML = `
    <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;">
      <span style="display:flex;align-items:center;gap:10px;"><i data-lucide="briefcase"></i> CRM</span>
      <button class="btn-ghost" id="btnCompanySettings" style="width:auto;font-size:12.5px;padding:8px 12px;">⚙ Coordonnées de facturation</button>
    </div>
    <div class="section-sub">Fichier des prospects, clients actuels et anciens clients de PandaFit.</div>
    <div class="tabs">
      <div class="tab ${crmFilter === 'prospect' ? 'active' : ''}" data-crm-filter="prospect">Prospects (${filterCounts.prospect})</div>
      <div class="tab ${crmFilter === 'client' ? 'active' : ''}" data-crm-filter="client">Clients actuels (${filterCounts.client})</div>
      <div class="tab ${crmFilter === 'ancien' ? 'active' : ''}" data-crm-filter="ancien">Anciens clients (${filterCounts.ancien})</div>
      <div class="tab ${crmFilter === 'factures' ? 'active' : ''}" data-crm-filter="factures">Factures</div>
    </div>
    ${bodyHTML}

  main.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { crmFilter = t.dataset.crmFilter; renderCRMView(); }));
  document.getElementById('btnCompanySettings').addEventListener('click', () => renderCompanySettings());

    el.addEventListener('click', () => { editingCrmId = el.dataset.openCrm; renderCRMView(); });

    el.addEventListener('click', () => {
      if (!el.dataset.openContactInvoice) return;
      editingCrmId = el.dataset.openContactInvoice;
      renderCRMView();
    });
  });
  document.getElementById('btnAddCrm')?.addEventListener('click', async () => {
    const company_name = document.getElementById('crmCompany').value.trim();
    if (!company_name) return;
    const payload = {
      company_name,
      contact_name: document.getElementById('crmContactName').value.trim() || null,
      role: document.getElementById('crmRole').value.trim() || null,

/* ---------------- Génération du PDF avec QR-facture suisse ---------------- */
function buildSwissQRData(company, invoice, total) {
  const lines = [
    'SPC', '0200', '1',
    (company.iban || '').replace(/\s/g, ''),
    'S',
    company.company_name || '',
    company.address_street || '',
    company.address_number || '',
    company.address_zip || '',
    company.address_city || '',
    company.address_country || 'CH',
    '', '', '', '', '', '', '', // ultimate creditor (non utilisé, 7 lignes vides)
    total.toFixed(2),
    invoice.currency || 'CHF',
    'S',
    invoice.debtor_name || '',
    invoice.debtor_street || '',
    invoice.debtor_number || '',
    invoice.debtor_zip || '',
    invoice.debtor_city || '',
    invoice.debtor_country || 'CH',
    'NON', '',
    invoice.message || '',
    'EPD',
    '', '', '',
  ];
  return lines.join('\n');
}
