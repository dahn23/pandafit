<style>
  /* Rapport anonymisé et agrégé, lisible à l'écran et imprimable en A4 */
  :root { --text: #1d2130; --dim: #5f6677; --border: #dfe3ea; --green: #17a461; --good: #2fbf71; --mid: #f2b43a; --risk: #e0564a; }
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { margin: 0; background: #e9edf2; color: var(--text); font-family: Montserrat, sans-serif; }
  .bar-top { max-width: 210mm; margin: 14px auto 0; display: flex; justify-content: flex-end; gap: 8px; padding: 0 8px; }
  .bar-top .langs { display: flex; gap: 4px; margin-right: auto; }
  .bar-top .langs button { background: #fff; color: var(--dim); padding: 8px 10px; font-size: 12px; }
  .bar-top .langs button.on { background: var(--text); color: #fff; }
  .bar-top button { font: 700 14px Montserrat, sans-serif; border: none; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: var(--green); color: #fff; }
  .page { width: 210mm; max-width: 100%; min-height: 297mm; margin: 12px auto 30px; background: #fff; padding: 15mm 15mm 12mm; box-shadow: 0 2px 14px rgba(20,25,40,.12); }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .top img { height: 15mm; max-width: 55mm; object-fit: contain; }
  .k { font-size: 9pt; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--green); margin-top: 9mm; }
  h1 { font-size: 23pt; font-weight: 900; margin: 2mm 0 1mm; line-height: 1.1; }
  .meta { font-size: 10.5pt; color: var(--dim); font-weight: 600; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4mm; margin-top: 8mm; }
  .kpi { border: 1px solid var(--border); border-radius: 3mm; padding: 4mm; }
  .kpi .l { font-size: 7.5pt; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .kpi .v { font-size: 20pt; font-weight: 900; margin-top: 1.5mm; }
  .kpi .s { font-size: 8pt; color: var(--dim); margin-top: 1mm; }
  h2 { font-size: 12pt; font-weight: 800; margin: 8mm 0 3mm; }
  .zones { display: flex; height: 8mm; border-radius: 2mm; overflow: hidden; }
  .zones span { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 8.5pt; font-weight: 800; white-space: nowrap; overflow: hidden; }
  .leg { display: flex; flex-wrap: wrap; gap: 6mm; font-size: 8.5pt; color: var(--dim); margin-top: 2mm; }
  .leg i { display: inline-block; width: 3mm; height: 3mm; border-radius: 50%; margin-right: 1.5mm; vertical-align: -0.3mm; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 7mm; }
  .hist { display: flex; align-items: flex-end; gap: 1.5mm; height: 30mm; border-bottom: 1px solid var(--border); }
  .hist div { flex: 1; border-radius: 1mm 1mm 0 0; }
  .hist-x { display: flex; gap: 1.5mm; font-size: 7pt; color: var(--dim); margin-top: 1mm; }
  .hist-x span { flex: 1; text-align: center; }
  .cmp .row { display: flex; align-items: center; gap: 3mm; margin: 3mm 0; font-size: 9.5pt; }
  .cmp .row b { width: 32mm; }
  .cmp .track { flex: 1; height: 4mm; background: #eef1f5; border-radius: 2mm; overflow: hidden; }
  .cmp .track span { display: block; height: 100%; background: var(--green); }
  .cmp .row em { font-style: normal; font-weight: 800; width: 14mm; text-align: right; }
  ul { margin: 0; padding-left: 5mm; font-size: 10pt; line-height: 1.55; }
  li { margin-bottom: 1.5mm; }
  .note { white-space: pre-line; font-size: 10pt; line-height: 1.55; background: #f3f5f8; border-radius: 3mm; padding: 4mm 5mm; }
  .box { background: #f3f5f8; border-radius: 3mm; padding: 4mm 5mm; font-size: 9pt; line-height: 1.5; margin-top: 7mm; }
  .foot { margin-top: 8mm; padding-top: 4mm; border-top: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 8pt; color: var(--dim); }
  .msg { max-width: 520px; margin: 18vh auto; background: #fff; border-radius: 14px; padding: 24px; text-align: center; font-size: 15px; line-height: 1.5; }
  .msg a { color: var(--green); font-weight: 700; }
  @media print { html, body { background: #fff; } .bar-top { display: none; } .page { margin: 0; box-shadow: none; } @page { size: A4; margin: 0; } }
  @media (max-width: 700px) { .page { padding: 18px; min-height: 0; } .kpis { grid-template-columns: 1fr 1fr; } .two { grid-template-columns: 1fr; } }

function hm(iso) { return new Date(iso).toLocaleTimeString(R().locale, { hour: '2-digit', minute: '2-digit' }); }
const pct = (n, t) => t ? Math.round(100 * n / t) : 0;
const num = n => Number(n).toLocaleString(R().locale);

// Recommandations générées à partir des résultats agrégés (le conseiller ajoute son propre mot)
function recommendations(d) {
  const r = [], L = R();
  const riskPct = pct(d.risk, d.participants), goodPct = pct(d.good, d.participants);
  if (riskPct >= 15) r.push(d.campaign ? L.r_riskCampaign(riskPct) : L.r_risk(riskPct));
  else if (goodPct >= 50) r.push(L.r_good);
  else r.push(L.r_mid);
  if (d.avg_static != null && d.avg_movement != null && d.avg_static - d.avg_movement >= 20) r.push(L.r_move(d.avg_movement, d.avg_static));
  const p = d.campaign?.pairs;
  if (d.campaign?.step === 't1') {
    if (p?.n >= 5 && p.delta > 0) r.unshift(L.r_progress(num(p.delta), p.improved_pct));
    r.push(L.r_program);
  } else r.push(L.r_remeasure);
  return r;
}

// Code personnel désactivé pour l'instant (décision Dan 06.11.2026) : pas de progression appariée ni de mention du code.
const PERSONAL_CODE = false;
// Bloc « Mois de l'équilibre » : engagement des 4 semaines + progression appariée (clôture)
function campaignHTML(d) {
  const c = d.campaign, L = R();
  if (!c) return '';
  const short = iso => new Date(iso + 'T12:00').toLocaleDateString(L.locale, { day: 'numeric', month: 'long' });
  const maxW = Math.max(1, ...c.weeks.map(w => w.plays));
  const total = c.weeks.reduce((s, w) => s + w.plays, 0);
  const p = c.pairs;
  let prog = '';
  if (PERSONAL_CODE && c.step === 't1') {
    prog = p?.n >= 5 ? `
      <h2>${L.progTitle}</h2>
      <div class="kpis">
        <div class="kpi"><div class="l">${L.twice}</div><div class="v">${p.n}</div><div class="s">${L.twiceSub}</div></div>
        <div class="kpi"><div class="l">${L.avg}</div><div class="v">${p.avg_t0} → ${p.avg_t1}</div><div class="s">${L.avgPts((p.delta > 0 ? '+' : '') + num(p.delta))}</div></div>
        <div class="kpi"><div class="l">${L.improve}</div><div class="v">${p.improved_pct} %</div><div class="s">${L.improveSub}</div></div>
        <div class="kpi"><div class="l">${L.risk}</div><div class="v">${p.risk_t0} → ${p.risk_t1}</div><div class="s">${L.riskPeople}</div></div>
      </div>`
      : `<h2>${L.progTitle}</h2><p style="font-size:10pt;color:var(--dim);margin:0;">${L.progWait(p?.n || 0)}</p>`;
  }
  return `
    ${prog}
    <div class="two">
      <div>
        <h2>${L.training}</h2>
        <div class="hist" style="height:24mm;">${c.weeks.map(w => `<div style="height:${Math.round(100 * w.plays / maxW)}%;background:var(--green);" title="${w.plays}"></div>`).join('')}</div>
        <div class="hist-x">${c.weeks.map(w => `<span>${L.wk} ${w.week} · ${w.plays}</span>`).join('')}</div>
        <p style="font-size:8.5pt;color:var(--dim);margin:2mm 0 0;">${L.plays(total, short(c.starts_on), short(c.ends_on))}</p>
      </div>
      <div>
        <h2>${L.defis}</h2>
        <table style="width:100%;border-collapse:collapse;font-size:9pt;">
          ${c.defis.map((x, i) => `<tr style="border-bottom:1px solid var(--border);"><td style="padding:1.6mm 0;">${esc(L.defiName(i + 1, x.game_id))}</td><td style="color:var(--dim);">${esc(GAME_NAMES[x.game_id] || x.game_id)}</td><td style="text-align:right;font-weight:800;">${L.scores(x.entries)}</td></tr>`).join('')}
        </table>
        ${PERSONAL_CODE && c.step === 't0' && c.t0?.participants ? `<p style="font-size:8.5pt;color:var(--dim);margin:2mm 0 0;">${L.t0note(short(c.ends_on))}</p>` : ''}
      </div>
    </div>`;
}

function langBar() {
  return `<div class="bar-top"><span class="langs">${['fr', 'de', 'en', 'it'].map(l => `<button data-lang="${l}" class="${l === lang ? 'on' : ''}">${l.toUpperCase()}</button>`).join('')}</span><button onclick="window.print()">${R().print}</button></div>`;
}
function render(d) {
  const ev = d.event, L = R();
  document.documentElement.lang = lang; document.title = 'PandaFit — ' + L.title;
  if (!d.enough) {
    app.innerHTML = langBar() + `<div class="msg"><b>${esc(d.client?.name || '')} · ${esc(day(ev.starts_at))}</b><br><br>${L.notEnough(d.participants)}</div>`;
    return wireLang();
  }
  const n = d.participants;
  const z = d.zones;
  const maxBin = Math.max(1, ...d.histogram.map(h => h.count));
  const binColor = from => from >= z.good_min ? 'var(--good)' : (from + 10 > z.risk_below ? 'var(--mid)' : 'var(--risk)');
  app.innerHTML = langBar() + `
    <div class="page">
      <div class="top"><img src="logo-pandafit.png" alt="PandaFit">${d.client?.logo_url ? `<img src="${esc(d.client.logo_url)}" alt="${esc(d.client.name)}">` : ''}</div>
      <div class="k">${d.campaign?.step === 't1' ? L.kT1 : d.campaign?.step === 't0' ? L.kT0 : L.kSession}</div>
      <h1>${esc(L.offers[ev.offer] || 'PandaFit')}</h1>
      <div class="meta">${esc(d.client?.name || '')} · ${esc(day(ev.starts_at))} · ${hm(ev.starts_at)} – ${hm(ev.ends_at)}${d.coaches?.length ? ' · ' + L.by + ' ' + esc(d.coaches.join(L.and)) : ''}</div>
      <div class="kpis">
        <div class="kpi"><div class="l">${L.participants}</div><div class="v">${n}</div><div class="s">${d.registered ? L.ofRegistered(pct(n, d.registered), d.registered) : L.measured}</div></div>
        <div class="kpi"><div class="l">${L.avg}</div><div class="v">${d.avg} / 100</div><div class="s">${L.wholeGroup}</div></div>
        <div class="kpi"><div class="l">${L.good}</div><div class="v">${pct(d.good, n)} %</div><div class="s">${L.goodSub(z.good_min)}</div></div>
        <div class="kpi"><div class="l">${L.risk}</div><div class="v">${pct(d.risk, n)} %</div><div class="s">${L.riskSub(z.risk_below)}</div></div>
      </div>
      <h2>${L.zonesTitle}</h2>
      <div class="zones">
        ${d.good ? `<span style="width:${pct(d.good, n)}%;background:var(--good);">${pct(d.good, n)} %</span>` : ''}
        ${d.mid ? `<span style="width:${pct(d.mid, n)}%;background:var(--mid);">${pct(d.mid, n)} %</span>` : ''}
        ${d.risk ? `<span style="width:${pct(d.risk, n)}%;background:var(--risk);">${pct(d.risk, n)} %</span>` : ''}
      </div>
      <div class="leg"><span><i style="background:var(--good)"></i>${L.legGood(z.good_min)}</span><span><i style="background:var(--mid)"></i>${L.legMid(z.risk_below, z.good_min - 1)}</span><span><i style="background:var(--risk)"></i>${L.legRisk(z.risk_below)}</span></div>
      <div class="two">
        <div>
          <h2>${L.dist}</h2>
          <div class="hist">${d.histogram.map(h => `<div style="height:${Math.round(100 * h.count / maxBin)}%;background:${binColor(h.from)};" title="${h.count}"></div>`).join('')}</div>
          <div class="hist-x">${d.histogram.map(h => `<span>${h.from}</span>`).join('')}</div>
        </div>
        <div class="cmp">
          <h2>${L.tests}</h2>
          <div class="row"><b>${L.static}</b><div class="track"><span style="width:${d.avg_static ?? 0}%"></span></div><em>${d.avg_static ?? '—'}</em></div>
          <div class="row"><b>${L.movement}</b><div class="track"><span style="width:${d.avg_movement ?? 0}%"></span></div><em>${d.avg_movement ?? '—'}</em></div>
          <p style="font-size:8.5pt;color:var(--dim);margin:2mm 0 0;">${L.testsNote}</p>
        </div>
      </div>
      ${campaignHTML(d)}
      <h2>${L.reco}</h2>
      <ul>${recommendations(d).map(r => `<li>${esc(r)}</li>`).join('')}</ul>
      ${ev.note ? `<h2>${L.advisor}</h2><div class="note">${esc(ev.note)}</div>` : ''}
      <div class="box">${L.privacy}</div>
      <div class="foot"><span>PandaFit SA · info@pandafit.ch · pandafit.ch</span><span>${ev.published_at ? L.published(new Date(ev.published_at).toLocaleDateString(L.locale)) : L.draft}</span></div>
    </div>`;
  wireLang();
}
function wireLang() {
  app.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang;
    try { localStorage.setItem('pf_report_lang', lang); } catch (e) {}
    render(data);
  }));
}

(async () => {
  if (!lang) lang = 'fr';
  if (!eventId) { app.innerHTML = `<div class="msg">${R().badLink}</div>`; return; }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { app.innerHTML = `<div class="msg">${R().login}</div>`; return; }
  const res = await sb.rpc('report_data', { p_event: eventId });
  if (res.error || !res.data) { app.innerHTML = `<div class="msg">${R().unavailable}</div>`; return; }
  data = res.data;
  // Langue : choix mémorisé de la personne, sinon langue de la séance
  let saved = null; try { saved = localStorage.getItem('pf_report_lang'); } catch (e) {}
  if (!saved && data.event?.language && RT[data.event.language]) lang = data.event.language;
  render(data);
})();
</script>
