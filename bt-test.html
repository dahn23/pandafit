<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PandaFit — Test reconnexion Bluetooth</title>
<style>
  :root { --bg:#0f1216; --panel:#1a1f27; --panel2:#232a34; --text:#e8edf3; --muted:#9aa7b6;
          --ok:#38d39f; --warn:#ffcc55; --err:#ff6b7d; --primary:#4c8dff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:14px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:12.5px; margin:0 0 14px; }
  .status { font-size:20px; font-weight:800; padding:14px; border-radius:12px; background:var(--panel); text-align:center; margin-bottom:12px; }
  .status.ok { background:#0e3a2e; color:var(--ok); }
  .status.warn { background:#3a3410; color:var(--warn); }
  .status.err { background:#3a1620; color:var(--err); }
  .metrics { display:flex; gap:8px; margin-bottom:12px; }
  .metric { flex:1; background:var(--panel); border-radius:10px; padding:10px; text-align:center; }
  .metric .n { font-size:22px; font-weight:800; }
  .metric .l { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .caps { background:var(--panel); border-radius:10px; padding:10px 12px; font-size:12.5px; margin-bottom:12px; }
  .caps div { display:flex; justify-content:space-between; padding:2px 0; }
  .caps .yes { color:var(--ok); font-weight:700; }
  .caps .no { color:var(--err); font-weight:700; }
  button { width:100%; border:none; border-radius:12px; padding:16px; font-size:16px; font-weight:700;
           margin-bottom:10px; color:#fff; background:var(--panel2); cursor:pointer; }
  button.primary { background:var(--primary); }
  button.warn { background:#7a5a12; }
  button:active { filter:brightness(1.2); }
  #log { background:#0a0d11; border-radius:10px; padding:10px; height:38vh; overflow-y:auto;
         font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; word-break:break-word; }
  #log .t { color:var(--muted); }
  #log .ok { color:var(--ok); }
  #log .warn { color:var(--warn); }
  #log .err { color:var(--err); }
</style>
</head>
<body>
  <h1>🐼 Test reconnexion Bluetooth</h1>
  <p class="sub">Diagnostic autonome — le but est de voir si le capteur peut se reconnecter <b>sans toucher l'écran</b>. Non lié à l'app.</p>

  <div class="status" id="status">Prêt</div>

  <div class="metrics">
    <div class="metric"><div class="n" id="hz">0</div><div class="l">paquets/s</div></div>
    <div class="metric"><div class="n" id="pkt">0</div><div class="l">paquets reçus</div></div>
  </div>

  <div class="caps" id="caps"></div>

  <button class="primary" id="btnManual">1 · Connexion manuelle (sélecteur) — à faire une fois</button>
  <button id="btnAuto">2 · Tester la reconnexion AUTO (sans sélecteur)</button>
  <button class="warn" id="btnReload">3 · Recharger la page (simule un refresh)</button>
  <button id="btnDisc">Déconnecter</button>

  <div id="log"></div>

<script>
const SERVICE_UUID   = "0000acc1-1211-ef1e-aaaa-aaaaaaaaaaaa";
const DATA_CHAR_UUID = "00000180-0000-1000-8000-00805f9b34fb";
const NAME_PREFIXES  = ['ASI_BLE', 'AdMOS_BLE', 'PandaFit'];

let device = null, characteristic = null, adAbort = null;
let pkt = 0, lastCount = 0, lastT = 0;

const $ = id => document.getElementById(id);

function log(msg, cls) {
  const el = $('log');
  const t = new Date().toLocaleTimeString();
  const line = document.createElement('div');
  line.innerHTML = `<span class="t">${t}</span> <span class="${cls||''}">${msg}</span>`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}
function setStatus(text, state) {
  const el = $('status');
  el.textContent = text;
  el.className = 'status' + (state ? ' ' + state : '');
}
function isConnected() { return !!(device && device.gatt && device.gatt.connected); }
function withTimeout(p, ms, label) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error((label||'opération') + ' : délai dépassé ' + ms + 'ms')), ms))]);
}

function showCaps() {
  const hasBT = !!navigator.bluetooth;
  const hasGetDevices = !!(navigator.bluetooth && navigator.bluetooth.getDevices);
  const hasWatchAds = ('BluetoothDevice' in window) && ('watchAdvertisements' in BluetoothDevice.prototype);
  const row = (label, ok, hint) => `<div><span>${label}</span><span class="${ok?'yes':'no'}">${ok?'OUI':'NON'+(hint?' — '+hint:'')}</span></div>`;
  $('caps').innerHTML =
    row('Web Bluetooth', hasBT) +
    row('getDevices() (appareils mémorisés)', hasGetDevices, 'active le flag new-permissions-backend') +
    row('watchAdvertisements() (écoute annonces)', hasWatchAds, 'active le flag experimental-web-platform-features');
  if (!hasGetDevices || !hasWatchAds) {
    log('⚠️ Des drapeaux Chrome manquent. Active-les puis RELANCE Chrome :', 'warn');
    log('   chrome://flags/#enable-experimental-web-platform-features → Enabled', 'warn');
    log('   chrome://flags/#enable-web-bluetooth-new-permissions-backend → Enabled', 'warn');
  }
}

function onData(evt) {
  pkt++; lastCount++;
  const now = performance.now();
  if (now - lastT >= 1000) { $('hz').textContent = lastCount; lastCount = 0; lastT = now; }
  $('pkt').textContent = pkt;
}

function onDisconnect() {
  setStatus('⚠️ Déconnecté', 'warn');
  log('gattserverdisconnected détecté → tentative de reconnexion automatique…', 'warn');
  autoReconnect('déconnexion');
}

async function attach(d) {
  device = d;
  d.removeEventListener('gattserverdisconnected', onDisconnect);
  d.addEventListener('gattserverdisconnected', onDisconnect);
  setStatus('Connexion GATT…');
  const server = await d.gatt.connect();
  const svc = await server.getPrimaryService(SERVICE_UUID);
  characteristic = await svc.getCharacteristic(DATA_CHAR_UUID);
  await characteristic.startNotifications();
  characteristic.addEventListener('characteristicvaluechanged', onData);
  lastT = performance.now(); lastCount = 0;
  setStatus('✅ CONNECTÉ — ' + (d.name || 'capteur'), 'ok');
  log('✅ Connecté à ' + (d.name || 'capteur') + ' — attends que "paquets/s" monte pour confirmer le flux.', 'ok');
}

async function manualConnect() {
  if (!navigator.bluetooth) { log('Web Bluetooth indisponible.', 'err'); return; }
  try {
    log('Ouverture du sélecteur…');
    const d = await navigator.bluetooth.requestDevice({
      filters: NAME_PREFIXES.map(p => ({ namePrefix: p })),
      optionalServices: [SERVICE_UUID]
    });
    log('Appareil choisi : ' + (d.name || '(sans nom)'));
    await attach(d);
  } catch (e) { log('Connexion manuelle annulée/échouée : ' + e.message, 'err'); setStatus('Échec connexion manuelle', 'err'); }
}

async function getGranted() {
  if (!navigator.bluetooth || !navigator.bluetooth.getDevices) return null;
  const known = await navigator.bluetooth.getDevices();
  log('getDevices() → ' + known.length + ' appareil(s) mémorisé(s) : ' + (known.map(d => d.name || '(sans nom)').join(', ') || '—'));
  return known.find(d => NAME_PREFIXES.some(p => d.name && d.name.startsWith(p))) || known[0] || null;
}

async function autoReconnect(origin) {
  log('— Reconnexion AUTO (déclenchée par : ' + origin + ') —');
  if (isConnected()) { log('Déjà connecté, rien à faire.', 'ok'); return; }

  let d = device || await getGranted();
  if (!d) { log('Aucun appareil autorisé. Fais d\'abord "1 · Connexion manuelle".', 'err'); setStatus('Aucun appareil mémorisé', 'err'); return; }
  device = d;

  // Méthode A : connexion GATT directe (méthode actuelle de l'app — échoue souvent car pas de scan actif)
  setStatus('Méthode A : connexion directe…', 'warn');
  log('Méthode A : gatt.connect() direct…');
  try {
    await withTimeout(attach(d), 7000, 'connexion directe');
    log('✅✅ Méthode A a réussi (connexion directe).', 'ok');
    return;
  } catch (e) { log('Méthode A a échoué : ' + e.message, 'warn'); }

  // Méthode B : watchAdvertisements → attendre une annonce → connecter
  if (!('watchAdvertisements' in BluetoothDevice.prototype)) {
    log('Méthode B impossible : watchAdvertisements() absent (drapeau Chrome manquant).', 'err');
    setStatus('❌ Reconnexion auto impossible (flags)', 'err');
    return;
  }
  setStatus('Méthode B : écoute des annonces…', 'warn');
  log('Méthode B : watchAdvertisements() — en attente d\'une annonce du capteur (jusqu\'à 30s)…');
  try {
    if (adAbort) { try { adAbort.abort(); } catch (_) {} }
    adAbort = new AbortController();
    let done = false;
    const onAd = async (ev) => {
      if (done) return; done = true;
      log('📡 Annonce reçue (RSSI ' + (ev.rssi ?? '?') + ') → connexion…', 'ok');
      d.removeEventListener('advertisementreceived', onAd);
      try { adAbort.abort(); } catch (_) {}
      try { await attach(d); log('✅✅ Méthode B (watchAdvertisements) a réussi.', 'ok'); }
      catch (e) { log('Connexion après annonce a échoué : ' + e.message, 'err'); setStatus('❌ Échec connexion après annonce', 'err'); }
    };
    d.addEventListener('advertisementreceived', onAd);
    await d.watchAdvertisements({ signal: adAbort.signal });
    log('watchAdvertisements actif — en écoute…');
    setTimeout(() => {
      if (!done && !isConnected()) {
        log('⏱️ Aucune annonce reçue en 30s. Le capteur n\'émet peut-être pas d\'annonces exploitables.', 'err');
        setStatus('❌ Aucune annonce en 30s', 'err');
        try { adAbort.abort(); } catch (_) {}
      }
    }, 30000);
  } catch (e) { log('watchAdvertisements a échoué : ' + e.message, 'err'); setStatus('❌ watchAdvertisements échec', 'err'); }
}

$('btnManual').addEventListener('click', manualConnect);
$('btnAuto').addEventListener('click', () => autoReconnect('bouton'));
$('btnReload').addEventListener('click', () => location.reload());
$('btnDisc').addEventListener('click', () => { if (device && device.gatt.connected) device.gatt.disconnect(); setStatus('Déconnecté manuellement', 'warn'); });

window.addEventListener('load', async () => {
  showCaps();
  log('Page chargée. Origine : ' + location.origin);
  try {
    const d = await getGranted();
    if (d) { log('Un capteur est déjà autorisé sur cette origine → test de reconnexion AUTO au chargement (simule l\'après-refresh).', 'ok'); autoReconnect('chargement de la page'); }
    else { log('Aucun capteur autorisé pour l\'instant. Commence par "1 · Connexion manuelle".'); }
  } catch (e) { log('getDevices() au chargement : ' + e.message, 'warn'); }
});
</script>
</body>
</html>
